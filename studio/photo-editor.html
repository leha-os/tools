    else tc.clearRect(0,0,doc.w,doc.h); });
}
function newLayerAction(){
  const before=snapDoc();
  const L=makeLayer(); doc.layers.push(L); doc.active=doc.layers.length-1;
  pushDocHist(t('hist_new_layer'),before,snapDoc()); afterHistNav();
}
function transformDoc(kind,label){
  const before=snapDoc();
  const swap=kind==='rot90cw'||kind==='rot90ccw';
  const nw=swap?doc.h:doc.w, nh=swap?doc.w:doc.h;
  for(const L of doc.layers){
    const nc=newLayerCanvas(nw,nh), c=nc.getContext('2d');
    c.save();
    if(kind==='rot90cw'){ c.translate(nw,0); c.rotate(Math.PI/2); }
    else if(kind==='rot90ccw'){ c.translate(0,nh); c.rotate(-Math.PI/2); }
    else if(kind==='rot180'){ c.translate(nw,nh); c.rotate(Math.PI); }
    else if(kind==='fliph'){ c.translate(nw,0); c.scale(-1,1); }
    else if(kind==='flipv'){ c.translate(0,nh); c.scale(1,-1); }
    c.drawImage(L.cv,0,0); c.restore(); L.cv=nc;
  }
  doc.w=nw; doc.h=nh; clearSelection();
  pushDocHist(label,before,snapDoc()); afterHistNav();
}

function optSlider(label,min,max,val,step,set){
  const d=el('div','opt');
  const lb=el('label'); lb.textContent=label; d.appendChild(lb);
  const r=el('input'); r.type='range'; r.min=min; r.max=max; r.step=step||1; r.value=val;
  const n=el('input'); n.type='number'; n.min=min; n.max=max; n.step=step||1; n.value=val;
  const upd=v=>{ v=clamp(parseFloat(v),min,max); if(isNaN(v))return; r.value=v; n.value=v; set(v); };
  r.addEventListener('input',()=>upd(r.value));
  n.addEventListener('change',()=>upd(n.value));
  d.appendChild(r); d.appendChild(n); return d;
}

/* ---------------- file I/O ---------------- */
function openAsLayer(){
  const i=el('input'); i.type='file'; i.accept='image/*';
  i.addEventListener('change',()=>{ if(i.files[0]) openImageFile(i.files[0],true); });
  i.click();
}
function placeImageAsLayer(src,w,h,name){
  const before=snapDoc();
  const L=makeLayer((name||'Image').replace(/\.[^.]+$/,''),doc.w,doc.h);
  const c=layerCtx(L);
  let dw=w, dh=h;
  if(w>doc.w||h>doc.h){ const s=Math.min(doc.w/w,doc.h/h); dw=Math.max(1,Math.round(w*s)); dh=Math.max(1,Math.round(h*s)); }
  c.imageSmoothingEnabled=true; c.imageSmoothingQuality='high';
  c.drawImage(src,(doc.w-dw)/2,(doc.h-dh)/2,dw,dh);
  doc.layers.push(L); doc.active=doc.layers.length-1;
  pushDocHist(t('hist_place'),before,snapDoc()); afterHistNav();
  toast(t('toast_img_added'));
}
async function openImageFile(file,asLayer){
  const url=URL.createObjectURL(file);
  let img;
  try{ img=await loadImage(url); }
  catch(e){ URL.revokeObjectURL(url); toast(t('toast_cant_open')); return; }
  let src=img, w=img.naturalWidth||img.width, h=img.naturalHeight||img.height;
  if(isHuge(w,h)){
    // Anti-lag: ask the user before opening a huge image
    const choice=await largeImageDialog({w,h,context:asLayer?'layer':'open'});
    if(!choice){ URL.revokeObjectURL(url); return; } // cancelled
    if(choice.downscale){ src=downscaleImage(img,choice.size); w=src.width; h=src.height; }
  }
  URL.revokeObjectURL(url);
  if(asLayer){ placeImageAsLayer(src,w,h,file.name); return; }
  createDocument(w,h,'transparent',(file.name||'image').replace(/\.[^.]+$/,''));
  const L=activeLayer();
  layerCtx(L).drawImage(src,0,0,w,h);
  L.name='Background';
  clearHist(); dirty=true; renderLayersPane(); updateStatus();
  toast(t('toast_opened',{w:w,h:h}));
}
function saveProject(){
  const layers=doc.layers.map(L=>({name:L.name,visible:L.visible,opacity:L.opacity,blend:L.blend,
    data:L.cv.toDataURL('image/png')}));
  const proj={app:'PhotoEditor',version:1,width:doc.w,height:doc.h,name:doc.name,active:doc.active,layers};
  download('data:application/json;charset=utf-8,'+encodeURIComponent(JSON.stringify(proj)),
    (doc.name||'project')+'.json');
  toast(t('toast_saved',{n:layers.length}));
}
async function openProjectFile(file){
  let proj;
  try{ proj=JSON.parse(await file.text()); }
  catch(e){ toast(t('toast_bad_proj')); return; }
  if(!proj||proj.app!=='PhotoEditor'||!Array.isArray(proj.layers)){ toast(t('toast_bad_proj')); return; }
  const w=proj.width|0, h=proj.height|0;
  if(!(w>0&&h>0&&w<=12000&&h<=12000)){ toast(t('toast_bad_dim')); return; }
  toast(t('toast_loading'));
  try{
    const layers=[];
    for(const pl of proj.layers){
      const img=await loadImage(pl.data);
      const L=makeLayer(pl.name||'Layer',w,h);
      L.visible=pl.visible!==false;
      L.opacity=(pl.opacity==null?1:pl.opacity);
      L.blend=BLEND[pl.blend]?pl.blend:'Normal';
      layerCtx(L).drawImage(img,0,0);
      layers.push(L);
    }
    doc={w,h,layers,active:clamp(proj.active|0,0,layers.length-1),name:proj.name||'Untitled'};
    clearHist(); clearSelection(); fitView(); afterHistNav();
    toast(t('toast_proj_opened'));
  }catch(e){ toast(t('toast_proj_fail')); }
}

function nudge(e){
  const L=activeLayer(); if(!L) return;
  const st=e.shiftKey?10:1;
  const dx=e.key==='ArrowLeft'?-st:(e.key==='ArrowRight'?st:0);
  const dy=e.key==='ArrowUp'?-st:(e.key==='ArrowDown'?st:0);
  if(!dx&&!dy) return;
  const before=snapRect(L,null);
  const nc=newLayerCanvas(doc.w,doc.h);
  nc.getContext('2d').drawImage(L.cv,dx,dy);
  const c=layerCtx(L);
  c.save(); c.globalCompositeOperation='source-over';
  c.clearRect(0,0,doc.w,doc.h); c.drawImage(nc,0,0); c.restore();
  pushLayerHist(t('hist_nudge'),L.id,before,snapRect(L,null));
  dirty=true; updateStatus();
}
document.addEventListener('keydown',e=>{
  const tag=(e.target.tagName||'').toLowerCase();
  const typing=tag==='input'||tag==='textarea'||tag==='select'||e.target.isContentEditable;
  if($('#dlgback')){ if(e.key==='Escape') closeDialog(); return; }
  if(typing) return;
  if(e.key===' '){ spaceDown=true; e.preventDefault(); return; }
  altDown=e.altKey;
  const mod=e.ctrlKey||e.metaKey, k=e.key.toLowerCase();
  if(mod){
    if(e.shiftKey&&k==='n'){ e.preventDefault(); newLayerAction(); return; }
    if(e.shiftKey&&k==='i'){ e.preventDefault(); invertSelection(); return; }
    switch(k){
      case 'n': e.preventDefault(); newDocDialog(); return;
      case 'o': e.preventDefault(); $('#fileimg').click(); return;
      case 's': e.preventDefault(); saveProject(); return;
      case 'z': e.preventDefault(); if(e.shiftKey) redo(); else undo(); return;
      case 'y': e.preventDefault(); redo(); return;
      case 'x': e.preventDefault(); copySel(true); return;
      case 'c': e.preventDefault(); copySel(false); return;
      case 'v': e.preventDefault(); pasteClipboard(); return;
      case 'a': e.preventDefault(); selectAll(); return;
      case 'd': e.preventDefault(); clearSelection(); return;
      case 'e': e.preventDefault(); mergeDown(); return;
      case 'j': e.preventDefault(); duplicateActiveLayer(); return;
      case 'i': if(e.altKey){ e.preventDefault(); imageSizeDialog(); } return;
      case '+': case '=': e.preventDefault(); zoomCenter(1.25); return;
      case '-': case '_': e.preventDefault(); zoomCenter(0.8); return;
      case '0': e.preventDefault(); fitView(); return;
      case '1': e.preventDefault(); actualPixels(); return;
      case ']': e.preventDefault(); moveActiveLayer(1); return;
      case '[': e.preventDefault(); moveActiveLayer(-1); return;
    }
    if(e.altKey&&(k==='c')){ e.preventDefault(); canvasSizeDialog(); return; }
    return;
  }
  if(e.key==='Escape'){
    if(cropState){ cropState=null; dirty=true; }
    else if(shapePrev){ shapePrev=null; dirty=true; }
    else clearSelection();
    return;
  }
  if(e.key==='Enter'){ if(tool==='crop'&&cropState&&cropState.r) applyCrop(); return; }
  if(e.key==='Delete'||e.key==='Backspace'){ e.preventDefault(); deleteSel(); return; }
  if(e.key.indexOf('Arrow')===0){ e.preventDefault(); nudge(e); return; }
  if(e.key==='F5'&&e.shiftKey){ e.preventDefault(); fillDialog(); return; }
  const up=e.key.toUpperCase();
  if(['V','M','L','C','I','B','E','G','T','U','Z','H'].includes(up)){ cycleToolKey(up); return; }
  if(up==='X'){ const t=fg; fg=bgc; bgc=t; renderColorPane(); return; }
  if(up==='D'){ fg='#1a1a1a'; bgc='#ffffff'; renderColorPane(); return; }
});
document.addEventListener('keyup',e=>{
  if(e.key===' ') spaceDown=false;
  altDown=e.altKey;
});

/* ---------------- drag & drop / file inputs ---------------- */
wrap.addEventListener('dragover',e=>e.preventDefault());
wrap.addEventListener('drop',e=>{
  e.preventDefault();
  const f=e.dataTransfer&&e.dataTransfer.files&&e.dataTransfer.files[0];
  if(!f) return;
  if(f.type.indexOf('image/')===0) openImageFile(f,true);
  else if(/\.json$/i.test(f.name)) openProjectFile(f);
  else toast(t('toast_bad_type'));
});
$('#fileimg').addEventListener('change',e=>{
  if(e.target.files[0]) openImageFile(e.target.files[0],false);
  e.target.value='';
});
$('#fileproj').addEventListener('change',e=>{
  if(e.target.files[0]) openProjectFile(e.target.files[0]);
  e.target.value='';
});

/* ---------------- init ---------------- */

/* ============ LEHA templates: hash loader (#tpl=id) ============ */
function loadTemplateFromHash(){
  var m=(location.hash||'').match(/^#tpl=([a-z0-9-]+)/i);
  if(!m||!window.LEHA_TEMPLATES||!LEHA_TEMPLATES.photo[m[1]])return;
  var T=LEHA_TEMPLATES.photo[m[1]];
  createDocument(T.w,T.h,'blank',t(T.nameKey));
  doc.layers=[];
  for(var i=0;i<T.layers.length;i++){
    var ld=T.layers[i];
    var L=makeLayer(t(ld.nameKey),T.w,T.h);
    if(ld.blend)L.blend=ld.blend;
    if(ld.opacity!=null)L.opacity=ld.opacity;
    try{ ld.draw(layerCtx(L),T.w,T.h,lang); }catch(e){}
    doc.layers.push(L);
  }
  doc.active=doc.layers.length-1;
  renderLayersPane(); renderOptions(); updateStatus(); fitView(); dirty=true;
  try{ history.replaceState(null,'',location.pathname+location.search); }catch(e){}
}

function init(){
  try{ const s=localStorage.getItem('leha_lang'); if(s==='en'||s==='vi') lang=s; }catch(_){}
  document.documentElement.lang=lang;
  buildToolbar();
  buildMenuBar();
  buildDock();
  initMobileUI();
  $$('#docktabs .dtab').forEach(b=>{ b.textContent=t('tab_'+b.dataset.tab); });
  createDocument(1600,900,'white','Untitled-1');
  loadTemplateFromHash();
  setTool('brush');
  window.addEventListener('resize',()=>{ resizeView(); dirty=true; });
  requestAnimationFrame(loop);
}
init();
</script>
