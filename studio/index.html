<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEHA Studio</title>
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#141414; color:#e8e8e8; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  header { padding:64px 24px 8px; text-align:center; position:relative; }
  .lang { position:absolute; top:18px; right:22px; display:flex; border:1px solid #333; border-radius:20px; overflow:hidden; }
  .lang button { background:transparent; border:0; color:#8a8a8a; font-size:12px; font-weight:700; padding:7px 13px; cursor:pointer; min-height:44px; }
  .lang button.on { background:#d4af37; color:#141414; }
  .logo { width:64px; height:64px; margin:0 auto 18px; border-radius:16px; background:linear-gradient(135deg,#c9a227,#8a6d1a); display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800; color:#141414; }
  h1 { font-size:32px; letter-spacing:3px; }
  h1 .gold { color:#d4af37; }
  main { flex:1; display:flex; gap:20px; justify-content:center; align-items:stretch; flex-wrap:wrap; padding:48px 24px; max-width:1100px; margin:0 auto; width:100%; }
  .card { background:#1e1e1e; border:1px solid #2c2c2c; border-radius:14px; padding:34px 26px; width:220px; text-decoration:none; color:inherit; transition:transform .15s, border-color .15s, box-shadow .15s; display:flex; flex-direction:column; align-items:center; text-align:center; }
  .card:hover { transform:translateY(-4px); border-color:#d4af37; box-shadow:0 12px 32px rgba(0,0,0,.5); }
  .card .icon { width:56px; height:56px; border-radius:14px; display:flex; align-items:center; justify-content:center; margin-bottom:16px; }
  .card h2 { font-size:17px; font-weight:600; }
  .i-photo { background:linear-gradient(135deg,#1f6feb33,#1f6feb11); border:1px solid #1f6feb55; }
  .i-vector { background:linear-gradient(135deg,#a371f733,#a371f711); border:1px solid #a371f755; }
  .i-pdf { background:linear-gradient(135deg,#da363333,#da363311); border:1px solid #da363355; }
  .i-tpl { background:linear-gradient(135deg,#d4af3733,#d4af3711); border:1px solid #d4af3755; }
  footer { text-align:center; padding:22px; color:#555; font-size:12px; }
  @media (max-width:560px){ main{ gap:14px; padding:32px 16px; } .card{ width:calc(50% - 7px); padding:26px 12px; } }
</style>
</head>
<body>
<header>
  <div class="lang"><button id="lvi" class="on">VI</button><button id="len">EN</button></div>
  <div class="logo">L</div>
  <h1>LEHA <span class="gold">STUDIO</span></h1>
</header>
<main>
  <a class="card" href="photo-editor.html">
    <div class="icon i-photo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    </div>
    <h2 data-i="c1"></h2>
  </a>
  <a class="card" href="vector-editor.html">
    <div class="icon i-vector">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#d2a8ff" stroke-width="1.8"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><circle cx="11" cy="11" r="2"/></svg>
    </div>
    <h2 data-i="c2"></h2>
  </a>
  <a class="card" href="pdf-tools/index.html">
    <div class="icon i-pdf">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ff7b72" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15h6M9 11h2"/></svg>
    </div>
    <h2 data-i="c3"></h2>
  </a>
  <a class="card" href="templates.html">
    <div class="icon i-tpl">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </div>
    <h2 data-i="c4"></h2>
  </a>
</main>
<footer>LEHA Studio</footer>
<script>
var LANG = {
  vi: { c1: "Chỉnh sửa ảnh", c2: "Vẽ vector", c3: "Công cụ PDF", c4: "Thư viện mẫu" },
  en: { c1: "Photo Editor", c2: "Vector Editor", c3: "PDF Tools", c4: "Templates" }
};
function setLang(l) {
  try { localStorage.setItem("leha_lang", l); } catch (e) {}
  document.documentElement.lang = l;
  document.querySelectorAll("[data-i]").forEach(function (el) {
    var k = el.getAttribute("data-i");
    if (LANG[l][k] !== undefined) el.textContent = LANG[l][k];
  });
  document.getElementById("lvi").className = l === "vi" ? "on" : "";
  document.getElementById("len").className = l === "en" ? "on" : "";
}
var initLang = "vi";
try { initLang = localStorage.getItem("leha_lang") || "vi"; } catch (e) {}
if (!LANG[initLang]) initLang = "vi";
document.getElementById("lvi").onclick = function () { setLang("vi"); };
document.getElementById("len").onclick = function () { setLang("en"); };
setLang(initLang);
</script>
</body>
</html>
