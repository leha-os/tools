<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>LEHA Studio — Bộ công cụ sáng tạo miễn phí</title>
<meta name="description" content="Chỉnh sửa ảnh, vẽ vector và xử lý PDF hoàn toàn miễn phí, chạy 100% trên trình duyệt. File của bạn không bao giờ rời khỏi máy.">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  body { background:#141414; color:#e8e8e8; font-family:-apple-system,"Segoe UI",Roboto,Arial,sans-serif; min-height:100vh; display:flex; flex-direction:column; }
  header { padding:56px 24px 12px; text-align:center; position:relative; }
  .lang { position:absolute; top:18px; right:22px; display:flex; border:1px solid #333; border-radius:20px; overflow:hidden; }
  .lang button { background:transparent; border:0; color:#8a8a8a; font-size:12px; font-weight:700; padding:7px 13px; cursor:pointer; }
  .lang button.on { background:#d4af37; color:#141414; }
  .logo { width:64px; height:64px; margin:0 auto 18px; border-radius:16px; background:linear-gradient(135deg,#c9a227,#8a6d1a); display:flex; align-items:center; justify-content:center; font-size:30px; font-weight:800; color:#141414; }
  h1 { font-size:34px; letter-spacing:.5px; }
  h1 .gold { color:#d4af37; }
  .tagline { margin-top:10px; color:#9a9a9a; font-size:15px; }
  .badge { display:inline-block; margin-top:14px; font-size:12px; color:#7fd67f; border:1px solid #2c4a2c; background:#162116; padding:5px 14px; border-radius:20px; }
  main { flex:1; display:flex; gap:22px; justify-content:center; align-items:stretch; flex-wrap:wrap; padding:44px 24px; max-width:1100px; margin:0 auto; width:100%; }
  .card { background:#1e1e1e; border:1px solid #2c2c2c; border-radius:14px; padding:30px 26px; width:300px; text-decoration:none; color:inherit; transition:transform .15s, border-color .15s, box-shadow .15s; display:flex; flex-direction:column; }
  .card:hover { transform:translateY(-4px); border-color:#d4af37; box-shadow:0 12px 32px rgba(0,0,0,.5); }
  .card .icon { width:52px; height:52px; border-radius:12px; display:flex; align-items:center; justify-content:center; margin-bottom:18px; }
  .card h2 { font-size:20px; margin-bottom:6px; }
  .card .en { font-size:12px; color:#8a8a8a; margin-bottom:12px; }
  .card p { font-size:13.5px; color:#b5b5b5; line-height:1.6; flex:1; }
  .card .go { margin-top:18px; font-size:14px; font-weight:600; color:#d4af37; }
  .i-photo { background:linear-gradient(135deg,#1f6feb33,#1f6feb11); border:1px solid #1f6feb55; }
  .i-vector { background:linear-gradient(135deg,#a371f733,#a371f711); border:1px solid #a371f755; }
  .i-pdf { background:linear-gradient(135deg,#da363333,#da363311); border:1px solid #da363355; }
  .i-tpl { background:linear-gradient(135deg,#d4af3733,#d4af3711); border:1px solid #d4af3755; }
  footer { text-align:center; padding:26px; color:#6a6a6a; font-size:12.5px; border-top:1px solid #222; }
  footer b { color:#9a9a9a; }
</style>
</head>
<body>
<header>
  <div class="lang"><button id="lvi" class="on">VI</button><button id="len">EN</button></div>
  <div class="logo">L</div>
  <h1>LEHA <span class="gold">STUDIO</span></h1>
  <p class="tagline" data-i="tagline"></p>
  <span class="badge" data-i="badge"></span>
</header>
<main>
  <a class="card" href="photo-editor.html">
    <div class="icon i-photo">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#58a6ff" stroke-width="1.8"><rect x="3" y="3" width="18" height="18" rx="2"/><circle cx="8.5" cy="8.5" r="1.5"/><path d="M21 15l-5-5L5 21"/></svg>
    </div>
    <h2 data-i="c1t"></h2>
    <div class="en" data-i="c1e"></div>
    <p data-i="c1p"></p>
    <span class="go" data-i="go"></span>
  </a>
  <a class="card" href="vector-editor.html">
    <div class="icon i-vector">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#d2a8ff" stroke-width="1.8"><path d="M12 19l7-7 3 3-7 7-3-3z"/><path d="M18 13l-1.5-7.5L2 2l3.5 14.5L13 18l5-5z"/><circle cx="11" cy="11" r="2"/></svg>
    </div>
    <h2 data-i="c2t"></h2>
    <div class="en" data-i="c2e"></div>
    <p data-i="c2p"></p>
    <span class="go" data-i="go"></span>
  </a>
  <a class="card" href="pdf-tools/index.html">
    <div class="icon i-pdf">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#ff7b72" stroke-width="1.8"><path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"/><path d="M14 2v6h6"/><path d="M9 15h6M9 11h2"/></svg>
    </div>
    <h2 data-i="c3t"></h2>
    <div class="en" data-i="c3e"></div>
    <p data-i="c3p"></p>
    <span class="go" data-i="go"></span>
  </a>
  <a class="card" href="templates.html">
    <div class="icon i-tpl">
      <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="#d4af37" stroke-width="1.8"><rect x="3" y="3" width="7" height="7" rx="1"/><rect x="14" y="3" width="7" height="7" rx="1"/><rect x="3" y="14" width="7" height="7" rx="1"/><rect x="14" y="14" width="7" height="7" rx="1"/></svg>
    </div>
    <h2 data-i="c4t"></h2>
    <div class="en" data-i="c4e"></div>
    <p data-i="c4p"></p>
    <span class="go" data-i="go"></span>
  </a>
</main>
<footer data-i="foot"></footer>
<script>
var LANG = {
  vi: {
    title: "LEHA Studio — Bộ công cụ sáng tạo miễn phí",
    tagline: "Bộ công cụ sáng tạo miễn phí — mở là dùng, không cần cài đặt, không cần tài khoản.",
    badge: "100% chạy trên trình duyệt · File không rời khỏi máy bạn",
    c1t: "Chỉnh sửa ảnh", c1e: "Photo Editor · phong cách Photoshop",
    c1p: "Layers, brush, vùng chọn, chữ, shapes, filter và chỉnh màu. Mở và xuất PNG / JPEG / WebP. Ảnh nặng có chế độ thu nhỏ chống lag.",
    c2t: "Vẽ vector", c2e: "Vector Editor · phong cách Illustrator",
    c2p: "Bút pen bezier, shapes, text, layers, gộp/tách path (pathfinder), nhiều artboard. Xuất SVG / PNG / JPEG.",
    c3t: "Công cụ PDF", c3e: "PDF Tools · phong cách PDF24",
    c3p: "14 công cụ: gộp, tách, nối thành 1 trang dài giữ nguyên vector, xoay, watermark, đặt mật khẩu, ảnh ↔ PDF và hơn nữa.",
    go: "Mở công cụ →",
    c4t: "Thư viện mẫu", c4e: "Templates · bấm là sửa được ngay",
    c4p: "10+ mẫu thiết kế vẽ sẵn: poster, card visit, logo, icon… mở thẳng trong editor để chỉnh sửa.",
    foot: "<b>LEHA Studio</b> — miễn phí cho mọi người"
  },
  en: {
    title: "LEHA Studio — Free Creative Tools",
    tagline: "Free creative toolkit — open and use, no install, no account needed.",
    badge: "100% in-browser · Your files never leave your device",
    c1t: "Photo Editor", c1e: "Photoshop-style",
    c1p: "Layers, brushes, selections, text, shapes, filters and color adjustments. Open and export PNG / JPEG / WebP. Large images get a downscale option to stay smooth.",
    c2t: "Vector Editor", c2e: "Illustrator-style",
    c2p: "Bezier pen, shapes, text, layers, boolean pathfinder ops, multiple artboards. Export SVG / PNG / JPEG.",
    c3t: "PDF Tools", c3e: "PDF24-style",
    c3p: "14 tools: merge, split, single long page with vectors intact, rotate, watermark, password protection, images ↔ PDF and more.",
    go: "Open →",
    c4t: "Template library", c4e: "Templates · click to edit instantly",
    c4p: "10+ ready-made designs: posters, business cards, logos, icons… open directly in the editor.",
    foot: "<b>LEHA Studio</b> — free for everyone"
  }
};
function setLang(l) {
  try { localStorage.setItem("leha_lang", l); } catch (e) {}
  document.documentElement.lang = l;
  document.title = LANG[l].title;
  document.querySelectorAll("[data-i]").forEach(function (el) {
    var k = el.getAttribute("data-i");
    if (LANG[l][k] !== undefined) el.innerHTML = LANG[l][k];
  });
  document.getElementById("lvi").className = l === "vi" ? "on" : "";
  document.getElementById("len").className = l === "en" ? "on" : "";
}
var initLang = "vi";
try { initLang = localStorage.getItem("leha_lang") || "vi"; } catch (e) {}
if (!LANG[initLang]) initLang = "vi";
document.getElementById("lvi").onclick = function () { setLang("vi"); };
document.getElementById("len").onclick = function () { setLang("en"); };
setLang(initLang);
</script>
</body>
</html>
