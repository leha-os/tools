<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#FAFAF8">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="[LEHA] Gmail Hubs">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" href="./icon128.png">
  <link rel="apple-touch-icon" href="./icon128.png">
  <title>[LEHA] Gmail Hubs PRO</title>
  <style>
    :root{--bg:#FAFAF8;--surface:#FFF;--surface-2:#F5F5F3;--surface-3:#EFEEE9;--border:#E8E6E1;--border-strong:#D8D5CF;--text:#11110F;--text-2:#6B6A67;--text-3:#9C9B99;--yellow:#FFF2A8;--yellow-border:#E8D96E;--danger:#DC2626;--success:#16A34A;--warning:#D97706;--blue:#2563EB;--accent:#4f46e5;--accent-soft:#eef2ff;--safe-top:env(safe-area-inset-top,0px);--safe-bottom:env(safe-area-inset-bottom,0px);--nav-h:56px;--header-h:52px;}
    body.dark-mode{--bg:#0F0F0F;--surface:#161616;--surface-2:#1E1E1E;--surface-3:#252525;--border:#262626;--border-strong:#333;--text:#F5F5F3;--text-2:#9A9996;--text-3:#5A5A58;--yellow:#3A3510;--yellow-border:#5A4E1A;--danger:#EF4444;--success:#22C55E;--warning:#F59E0B;--blue:#60A5FA;--accent:#818cf8;--accent-soft:#312e81;}
    *{box-sizing:border-box;-webkit-font-smoothing:antialiased}
    html,body{margin:0;padding:0;height:100%}
    body{font-family:ui-sans-serif,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;background:var(--bg);color:var(--text);font-size:13px;line-height:1.4;overflow-x:hidden;transition:background-color .15s,color .15s}
    button{font:inherit;cursor:pointer;border:none;background:none;color:inherit;padding:0}
    input,textarea,select{font:inherit;color:inherit}
    input:focus,textarea:focus,select:focus{outline:none}
    a{color:var(--blue);text-decoration:none}a:hover{text-decoration:underline}
    ::-webkit-scrollbar{width:5px;height:5px}::-webkit-scrollbar-thumb{background:var(--border-strong);border-radius:999px}
    #boot-error{position:fixed;inset:0;background:#fff;color:#111;padding:40px 20px;font-family:system-ui;text-align:center;z-index:9999;display:none}
    .app{display:flex;flex-direction:column;min-height:100vh;padding-bottom:calc(var(--nav-h) + var(--safe-bottom))}
    .header{position:sticky;top:var(--safe-top);z-index:30;background:var(--surface);border-bottom:1px solid var(--border)}
    .header-inner{max-width:1280px;margin:0 auto;height:52px;display:flex;align-items:center;justify-content:space-between;gap:12px;padding:0 12px}
    .brand{display:flex;align-items:center;gap:10px;min-width:0}
    .brand-icon{width:30px;height:30px;display:flex;align-items:center;justify-content:center;background:linear-gradient(135deg,#4f46e5,#06b6d4);color:#fff;border-radius:8px;font-weight:700;font-size:13px;flex-shrink:0;overflow:hidden}
    .brand-icon img{width:100%;height:100%;object-fit:cover;display:block}
    .brand-text{display:flex;flex-direction:column;line-height:1.1;min-width:0}
    .brand-title-row{display:flex;align-items:center;gap:6px}
    .brand-title{font-size:13.5px;font-weight:700;letter-spacing:-.025em;white-space:nowrap}
    .badge-pro{font-size:9.5px;font-weight:800;background:var(--accent-soft);color:var(--accent);padding:2px 6px;border-radius:6px;letter-spacing:.03em}
    .brand-sub{font-size:10px;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3);margin-top:2px;white-space:nowrap}
    .header-stats{margin-left:12px;padding-left:12px;border-left:1px solid var(--border);display:none;align-items:center;gap:8px;color:var(--text-3);font-size:11px}
    @media(min-width:768px){.header-stats{display:flex}.header-inner{padding:0 16px}}
    .header-actions{display:flex;align-items:center;gap:6px}
    .btn{display:inline-flex;align-items:center;justify-content:center;gap:4px;height:28px;padding:0 11px;border:1px solid var(--border);border-radius:999px;font-size:11.5px;font-weight:600;color:var(--text-2);background:transparent;white-space:nowrap;transition:background-color .12s}
    .btn:hover{background:var(--surface-2)}.btn-primary{background:var(--text);color:var(--bg);border-color:var(--text)}.btn-primary:hover{opacity:.9}
    .btn-sm{height:26px;padding:0 10px;font-size:11px}.btn-icon{width:28px;height:28px;padding:0}
    .container{max-width:1280px;margin:0 auto;padding:0 12px}@media(min-width:768px){.container{padding:0 16px}}
    .search-wrap{padding:12px 0 10px}.search{position:relative}
    .search input{width:100%;height:36px;padding:0 32px;border-radius:12px;border:1px solid var(--border);background:var(--surface);font-size:13px}
    .search-icon{position:absolute;left:10px;top:50%;transform:translateY(-50%);color:var(--text-3);pointer-events:none}
    .search-clear{position:absolute;right:6px;top:50%;transform:translateY(-50%);padding:4px;border-radius:999px;color:var(--text-3)}
    .dot{width:6px;height:6px;border-radius:999px;flex-shrink:0}
    .pill-x{padding:4px;color:var(--text-3);border-radius:4px}.pill-x:hover{color:var(--text);background:var(--surface-2)}
    .unread-badge{display:inline-flex;align-items:center;justify-content:center;min-width:16px;height:14px;padding:0 4px;margin-left:4px;border-radius:999px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:700}
    .table-header{max-width:1280px;margin:0 auto;padding:0 12px;border-top:1px solid var(--border);border-bottom:1px solid var(--border);background:var(--surface-2)}
    @media(min-width:768px){.table-header{padding:0 16px}}
    .table-header-inner{display:flex;align-items:center;height:30px;font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.06em;color:var(--text-3)}
    .table-header-inner>*:first-child{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
    .table-header-inner>*:last-child{width:140px;flex-shrink:0;text-align:right;padding-right:4px}
    .row-list{max-width:1280px;margin:0 auto}
    .row{display:flex;align-items:center;gap:8px;height:38px;padding:6px 12px;background:var(--surface);border-bottom:1px solid var(--border);cursor:pointer;font-size:13px;line-height:1;transition:background-color .1s}
    @media(min-width:768px){.row{padding:6px 16px}}
    .row:hover{background:var(--surface-2)}.row.unread{background:color-mix(in srgb,var(--yellow) 22%,var(--surface))}
    .row.selected{background:color-mix(in srgb,var(--text) 8%,var(--surface))}
    .row-left{flex:1;min-width:0;display:flex;align-items:center;gap:8px}
    .row-check{width:16px;height:16px;flex-shrink:0;opacity:0;cursor:pointer;accent-color:var(--text)}
    .row-list:hover .row-check,.row.selected .row-check,.row-check:checked{opacity:1}
    @media(max-width:767px){.row-check{opacity:1}}
    .row-account{display:none;height:20px;align-items:center;border:1px solid;border-radius:999px;padding:0 8px;font-size:11px;font-weight:500;line-height:1;white-space:nowrap;flex-shrink:0}
    @media(min-width:768px){.row-account{display:inline-flex}}
    .row-content{min-width:0;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;align-items:center}
    .row-from{font-weight:600;color:var(--text);flex-shrink:0}.row-sep{margin:0 4px;color:var(--text-3);flex-shrink:0}.row-subject{color:var(--text-2);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
    .row-date{margin-left:8px;font-size:11px;color:var(--text-3);display:none;flex-shrink:0}@media(min-width:768px){.row-date{display:inline}}
    .row-right{width:145px;flex-shrink:0;display:flex;align-items:center;justify-content:flex-end;gap:4px}
    .otp-badge{display:inline-flex;align-items:center;justify-content:center;min-width:56px;height:20px;padding:0 6px;border-radius:6px;border:1px solid var(--yellow-border);background:var(--yellow);color:var(--text);font-family:ui-monospace,SFMono-Regular,Menlo,monospace;font-size:12px;font-weight:700;letter-spacing:.04em}
    .otp-none{font-size:11px;color:var(--text-3)}
    .copy-btn{position:relative;display:inline-flex;align-items:center;justify-content:center;height:20px;width:36px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:10.5px;font-weight:600;color:var(--text-2)}
    .copy-btn:hover{background:var(--surface-2)}
    .magic-btn{display:inline-flex;align-items:center;justify-content:center;height:20px;padding:0 8px;border-radius:6px;border:1px solid var(--border);background:var(--surface);font-size:10.5px;font-weight:600;color:var(--blue);white-space:nowrap}
    .row-del{display:none;padding:4px;border-radius:4px;color:var(--text-3);cursor:pointer}
    .row:hover .row-del{display:inline-flex}.row-del:hover{background:color-mix(in srgb,var(--danger) 15%,var(--surface));color:var(--danger)}
    @media(max-width:767px){.row-del{display:inline-flex}}
    .empty{display:flex;flex-direction:column;align-items:center;justify-content:center;padding:60px 16px;text-align:center}
    .empty-icon{width:40px;height:40px;display:flex;align-items:center;justify-content:center;border-radius:999px;background:var(--surface-2);border:1px solid var(--border);color:var(--text-3);margin-bottom:12px}
    .empty-title{font-size:13px;font-weight:600}.empty-text{font-size:12px;color:var(--text-2);margin-top:4px;max-width:360px;line-height:1.5}
    .toast{position:fixed;bottom:calc(var(--nav-h) + var(--safe-bottom) + 16px);left:50%;transform:translateX(-50%);z-index:100;padding:8px 16px;border-radius:999px;background:#11110F;color:#fff;font-size:12px;font-weight:500;box-shadow:0 10px 15px -3px rgba(0,0,0,.2);max-width:calc(100vw - 32px);text-align:center;display:flex;align-items:center;gap:8px}
    .modal-backdrop{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;background:rgba(0,0,0,.5);padding:12px}
    .modal{width:100%;max-width:420px;max-height:85vh;border-radius:16px;background:var(--surface);border:1px solid var(--border);box-shadow:0 20px 25px -5px rgba(0,0,0,.15);display:flex;flex-direction:column;overflow:hidden}
    .modal.wide{max-width:640px}
    @media(max-width:480px){
      .modal-backdrop{align-items:flex-end;padding:0}
      .modal{max-width:100%;max-height:90vh;border-radius:16px 16px 0 0;margin:0}
      .modal.wide{max-width:100%}
    }
    .modal-header{padding:12px 14px;border-bottom:1px solid var(--border);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-shrink:0}
    .modal-title{font-size:14px;font-weight:700;letter-spacing:-.025em}
    .modal-body{padding:14px;overflow-y:auto;flex:1;-webkit-overflow-scrolling:touch}.modal-footer{padding:10px 14px;border-top:1px solid var(--border);display:flex;justify-content:flex-end;gap:8px;flex-shrink:0}
    .modal-close{padding:6px;border-radius:999px;color:var(--text-3);min-width:32px;min-height:32px;display:inline-flex;align-items:center;justify-content:center}.modal-close:hover{background:var(--surface-2)}
    .field{margin-bottom:12px}.field-label{display:block;font-size:11px;font-weight:600;color:var(--text-2);margin-bottom:4px;text-transform:uppercase;letter-spacing:.04em}
    .field-input{width:100%;height:36px;padding:0 12px;border:1px solid var(--border);border-radius:8px;background:var(--surface);font-size:13px}
    .field-help{font-size:11px;color:var(--text-3);margin-top:4px;line-height:1.5}
    .tabs{display:flex;gap:2px;padding:8px 16px 0;border-bottom:1px solid var(--border);flex-shrink:0}
    .tab{padding:6px 10px;border-radius:6px 6px 0 0;font-size:12px;font-weight:600;color:var(--text-2)}
    .tab.active{background:var(--surface-2);color:var(--text)}.tab:hover:not(.active){background:var(--surface-2)}
    .icon{display:inline-block;vertical-align:middle;flex-shrink:0}
    .bulk-bar{width:max-content;max-width:calc(100vw - 24px);white-space:nowrap;position:fixed;bottom:calc(var(--nav-h) + var(--safe-bottom) + 16px);left:50%;transform:translateX(-50%);z-index:40;display:flex;align-items:center;gap:4px;padding:6px 10px;border-radius:999px;background:#11110F;color:#fff;box-shadow:0 10px 15px -3px rgba(0,0,0,.2)}
    .bulk-bar button{flex-shrink:0;white-space:nowrap;color:#fff;padding:5px 10px;border-radius:999px;font-size:11.5px;font-weight:600}.bulk-bar button:hover{background:rgba(255,255,255,.15)}
    .bulk-count{white-space:nowrap;flex-shrink:0;font-size:11.5px;padding:0 6px;opacity:.9}
    .bottom-nav{position:fixed;bottom:0;left:0;right:0;z-index:50;height:calc(var(--nav-h) + var(--safe-bottom));padding-bottom:var(--safe-bottom);background:var(--surface);border-top:1px solid var(--border);display:flex;align-items:stretch;justify-content:space-around}
    .nav-tab{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;color:var(--text-3);font-size:10px;font-weight:600;text-transform:uppercase;letter-spacing:.05em;position:relative;transition:color .15s;background:none;border:none;cursor:pointer}
    .nav-tab.active{color:var(--bg)}
    .nav-tab.active::before{content:'';position:absolute;inset:6px 20px;background:var(--text);border-radius:10px;z-index:-1}
    .nav-tab .nav-badge{position:absolute;top:6px;right:calc(50% - 20px);min-width:16px;height:14px;padding:0 4px;border-radius:999px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:700;display:flex;align-items:center;justify-content:center}
    .swipe-wrap{position:relative;overflow:hidden}
    .swipe-delete-bg{position:absolute;inset:0;background:var(--danger);color:#fff;display:flex;align-items:center;padding-left:16px;font-weight:600;font-size:12px;gap:6px;pointer-events:none}
    .swipe-content{position:relative;background:var(--surface);will-change:transform}
    .modal.email{height:min(86dvh,780px);max-height:86dvh}
    @media(max-width:767px){.email-bd{padding:0;align-items:stretch}.modal.email{height:100dvh;max-height:100dvh;border-radius:0;width:100%;max-width:100%}.modal{max-height:92dvh}}
    .nav-scroll{flex:1;min-width:0;display:flex;overflow-x:auto;scrollbar-width:none}.nav-scroll::-webkit-scrollbar{display:none}
    .nav-scroll .nav-tab{flex:0 0 auto;min-width:78px;max-width:150px;padding:0 12px}
    .nav-scroll .nav-tab.active::before{inset:7px 4px}
    .nav-label{font-size:11px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:120px}
    .nav-add{flex:0 0 48px;font-size:20px;color:var(--text-2);background:none;border:none;border-left:1px solid var(--border)}
    .filter-btn{height:36px;flex-shrink:0;white-space:nowrap}
    .filter-pop{position:absolute;top:42px;right:0;z-index:40;width:min(340px,94vw);max-height:min(60vh,420px);overflow-y:auto;background:var(--surface);border:1px solid var(--border);border-radius:12px;box-shadow:0 12px 28px -8px rgba(0,0,0,.2);padding:8px}
    .pill-chip{font-size:11px;font-weight:600;border:1px solid;border-radius:999px;padding:2px 9px;background:transparent;cursor:pointer;white-space:nowrap}
    .acc-screen{position:fixed;inset:0;z-index:55;background:var(--bg);display:flex;flex-direction:column;padding-top:var(--safe-top)}
    .acc-head{display:flex;align-items:center;gap:8px;padding:8px 12px;border-bottom:1px solid var(--border);background:var(--surface)}
    .acc-body{flex:1;overflow-y:auto;padding-bottom:calc(var(--safe-bottom) + 70px)}
    /* NÚT GOM NHÓM / COLLAPSE NỔI BẬT DỄ NHẬN BIẾT */
    .grp-chip{flex-shrink:0;display:inline-flex;align-items:center;gap:4px;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;background:var(--accent-soft);border:1px solid var(--accent);color:var(--accent);cursor:pointer;margin-left:8px;transition:all .15s}
    .grp-chip:hover{background:var(--accent);color:#fff}
    .grp-chip.is-open{background:var(--accent);color:#fff}
    .row.is-grouped-parent{border-left:3px solid var(--accent)}
    .row.sub{padding-left:28px;background:color-mix(in srgb,var(--accent-soft) 35%,var(--surface));border-left:3px solid color-mix(in srgb,var(--accent) 45%,transparent)}
    .pill-head{display:flex;align-items:center;gap:8px;padding:7px 12px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:12px;font-weight:700;cursor:pointer}
    .pill-caret{width:12px;color:var(--text-3)}.pill-name{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}.pill-count{font-size:10.5px;font-weight:500;color:var(--text-3)}
    .nb-tool{width:28px;height:28px;display:inline-flex;align-items:center;justify-content:center;border-radius:5px;color:var(--text-2);font-size:12px;font-weight:600;flex-shrink:0}
    .nb-tool:hover{background:var(--surface-2)}
    .editor-toolbar{display:flex;flex-wrap:wrap;gap:2px;padding:6px 8px;border:1px solid var(--border);border-bottom:none;border-radius:8px 8px 0 0;background:var(--surface-2)}
  </style>
</head>
<body>
  <div id="boot-error">
    <h2>⚠️ Không tải được ứng dụng</h2>
    <p>Ứng dụng cần <b>internet</b> để tải thư viện Preact từ CDN lần đầu.</p>
    <pre id="boot-detail" style="white-space:pre-wrap;font-size:11px;color:#b91c1c;margin-top:12px"></pre>
    <p><button onclick="ghReset()" style="padding:8px 14px;border-radius:8px;border:1px solid #999;background:#fff;cursor:pointer">Xóa cache &amp; tải lại</button></p>
  </div>
  <div id="app"></div>

  <script src="https://unpkg.com/preact@10.19.6/dist/preact.umd.js"></script>
  <script src="https://unpkg.com/preact@10.19.6/hooks/dist/hooks.umd.js"></script>
  <script>
    if ('serviceWorker' in navigator && location.protocol !== 'file:') {
      navigator.serviceWorker.register('./sw.js').catch(function(){});
    }
    window.ghReset = function(){
      var rs = navigator.serviceWorker ? navigator.serviceWorker.getRegistrations() : Promise.resolve([]);
      rs.then(function(r){ return Promise.all(r.map(function(x){ return x.unregister(); })); })
        .then(function(){ return window.caches ? caches.keys() : []; })
        .then(function(k){ return Promise.all(k.map(function(x){ return caches.delete(x); })); })
        .then(function(){ location.reload(); });
    };
    window.addEventListener('error', function(e){
      if(document.getElementById('app').innerHTML.trim()) return;
      document.getElementById('boot-error').style.display='block';
      if(e && e.message) document.getElementById('boot-detail').textContent = e.message;
    });

    (function(){
      'use strict';
      if(!window.preact || !window.preactHooks){
        document.getElementById('boot-error').style.display='block';
        return;
      }
      var h = window.preact.h, render = window.preact.render;
      var useState = window.preactHooks.useState, useEffect = window.preactHooks.useEffect,
          useRef = window.preactHooks.useRef, useMemo = window.preactHooks.useMemo,
          useCallback = window.preactHooks.useCallback;

      var COLORS = ['#2563EB','#DB2777','#059669','#EA580C','#7C3AED','#0891B2','#16A34A','#DC2626','#D97706','#4F46E5'];
      function hexToRgb(hex){ var h2=hex.replace('#',''); var n=parseInt(h2,16); return [(n>>16)&255,(n>>8)&255,n&255]; }
      function rgba(hex,a){ var c=hexToRgb(hex); return 'rgba('+c[0]+','+c[1]+','+c[2]+','+a+')'; }
      function darken(hex,f){ var c=hexToRgb(hex); var o=1-f; return 'rgb('+Math.max(0,Math.floor(c[0]*o))+','+Math.max(0,Math.floor(c[1]*o))+','+Math.max(0,Math.floor(c[2]*o))+')'; }
      function uid(p){ return (p||'id')+'_'+Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-4); }
      function formatDate(ts){ var d=new Date(ts), n=new Date(); if(d.toDateString()===n.toDateString()) return d.toLocaleTimeString('vi-VN',{hour:'2-digit',minute:'2-digit'}); return d.toLocaleDateString('vi-VN',{day:'2-digit',month:'2-digit'}); }
      function formatFull(ts){ return new Date(ts).toLocaleString('vi-VN',{day:'2-digit',month:'2-digit',year:'numeric',hour:'2-digit',minute:'2-digit'}); }

      var LS = {
        ACCOUNTS:'gmail_hub_accounts',
        EMAILS:'gmail_hub_emails',
        NOTES:'gmail_hub_notes',
        SETTINGS:'gmail_hub_settings',
        ACTIVE_TAB:'gh_activeTab',
        DELETED_IDS:'gmail_hub_deleted_ids'
      };
      function loadJSON(k,fb){ try{var v=localStorage.getItem(k); return v?JSON.parse(v):fb;}catch(e){return fb;} }
      function saveJSON(k,v){ try{localStorage.setItem(k,JSON.stringify(v));}catch(e){} }

      function idbOpen(){ return new Promise(function(res,rej){ var r=indexedDB.open('gmailhub',1); r.onupgradeneeded=function(){ r.result.createObjectStore('kv'); }; r.onsuccess=function(){res(r.result);}; r.onerror=function(){rej(r.error);}; }); }
      function idbGet(k){ return idbOpen().then(function(db){ return new Promise(function(res,rej){ var q=db.transaction('kv').objectStore('kv').get(k); q.onsuccess=function(){res(q.result);}; q.onerror=function(){rej(q.error);}; }); }); }
