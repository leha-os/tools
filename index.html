<script>
let reposCache=[], customNames=JSON.parse(localStorage.getItem('customNames')||'{}');
let selected = new Map();
const $=s=>document.querySelector(s);
function getHeaders(){
 let t=localStorage.getItem('gh_token')||'';
 let h={'Accept':'application/vnd.github.v3+json'};
 if(t) h['Authorization']='token '+t;
 return h;
}
async function fetchContents(user, repo, path=''){
 let headers=getHeaders();
 let url=`https://api.github.com/repos/${user}/${repo}/contents/${path}?ref=main`;
 let res=await fetch(url,{headers});
 if(res.status===404){
  url=`https://api.github.com/repos/${user}/${repo}/contents/${path}?ref=master`;
  res=await fetch(url,{headers});
 }
 if(!res.ok) return [];
 let d=await res.json();
 return Array.isArray(d)?d:[];
}
// Recursive scan for nested folders con của con của con
async function scanFolderRecursive(user, repo, basePath, grouped, depth=0, maxDepth=4){
 if(depth>maxDepth) return;
 let contents = await fetchContents(user, repo, basePath);
 let htmlFiles = contents.filter(f=>f.type==='file' && f.name.toLowerCase().endsWith('.html'));
 let subDirs = contents.filter(f=>f.type==='dir');
 if(htmlFiles.length){
   if(!grouped[basePath]) grouped[basePath]=[];
   grouped[basePath].hasIndex = htmlFiles.some(f=>f.name.toLowerCase()==='index.html');
   htmlFiles.forEach(file=>{
     let pub = file.name.toLowerCase()==='index.html' ? `https://${user}.github.io/${repo}/${basePath}${basePath?'/':''}`.replace('//','/').replace('https:/','https://') : `https://${user}.github.io/${repo}/${basePath?basePath+'/':''}${file.name}`;
     // fix double slash for root
     if(basePath==='') pub = file.name.toLowerCase()==='index.html' ? `https://${user}.github.io/${repo}/` : `https://${user}.github.io/${repo}/${file.name}`;
     grouped[basePath].push({label:file.name, path:`${repo}/${basePath?basePath+'/':''}${file.name}`, url:pub, key:`${repo}/${basePath?basePath+'/':''}${file.name}`, githubUrl:`https://github.com/${user}/${repo}/blob/main/${basePath?basePath+'/':''}${file.path.split('/').pop()}`, filePath:`${basePath?basePath+'/':''}${file.name}`, filePathFull: file.path, repo:repo, depth});
   });
 }
 // recurse into subfolders
 for(let dir of subDirs){
   let subPath = basePath ? `${basePath}/${dir.name}` : dir.name;
   await scanFolderRecursive(user, repo, subPath, grouped, depth+1, maxDepth);
 }
}

let CACHE_KEY='leha_links_cache_v4';
function saveCache(repos, groupedData){
 try{ localStorage.setItem(CACHE_KEY, JSON.stringify({repos, groupedData, ts:Date.now()})); }catch(e){}
}
function loadCache(){
 try{
  let raw=localStorage.getItem(CACHE_KEY);
  if(!raw) return null;
  let j=JSON.parse(raw);
  if(Date.now()-j.ts > 24*60*60*1000) return null;
  return j;
 }catch(e){ return null; }
}
function renderFromCache(){
 let cache=loadCache();
 if(!cache) return false;
 reposCache=cache.repos;
 document.getElementById('syncStatus').innerText='cached • '+new Date(cache.ts).toLocaleTimeString();
 renderReposFromGrouped(cache.repos, cache.groupedData);
 return true;
}

function renderReposFromGrouped(repos, groupedByRepo){
 let filter=document.getElementById('search').value.toLowerCase();
 let out=document.getElementById('out'); if(!out) return;
 out.innerHTML='';
 for(let repo of repos){
   let grouped=groupedByRepo[repo.name];
   if(!grouped) continue;
   let folderNames=Object.keys(grouped).filter(k=>Array.isArray(grouped[k]) && grouped[k].length>0).sort();
   // Put root first, then sort by depth then name
   folderNames.sort((a,b)=>{
     if(a==='') return -1; if(b==='') return 1;
     let da=a.split('/').length, db=b.split('/').length;
     if(da!==db) return da-db;
     return a.localeCompare(b);
   });
   let hasMatch = !filter || repo.name.toLowerCase().includes(filter) || folderNames.some(fn=> grouped[fn].some(f=> (f.label||'').toLowerCase().includes(filter) || (fn||'').toLowerCase().includes(filter) ));
   if(!hasMatch) continue;
   let isRepoCollapsed = localStorage.getItem('collapsed_'+repo.name);
   if(isRepoCollapsed===null) isRepoCollapsed='1';
   let repoCollapsed = isRepoCollapsed==='1';
   let foldersHtml = folderNames.map(folder=>{
     let files=grouped[folder];
     if(!files || !files.length) return '';
     let filteredFiles = filter ? files.filter(f=> (f.label||'').toLowerCase().includes(filter) || folder.toLowerCase().includes(filter) || repo.name.toLowerCase().includes(filter)) : files;
     if(!filteredFiles.length) return '';
     let folderKey = repo.name+'::'+folder;
     let isFolderCollapsed = localStorage.getItem('collapsed_folder_'+folderKey);
     if(isFolderCollapsed===null) isFolderCollapsed = folder==='' ? '0' : '1'; // root open by default
     let fCollapsed = isFolderCollapsed==='1';
     let folderLabel = folder==='' ? '(root)' : folder;
     let depth = folder ? folder.split('/').length : 0;
     let indentClass = depth<=1 ? 'pl-8' : depth===2 ? 'pl-12' : depth===3 ? 'pl-16' : 'pl-20';
     let hasIndex = grouped[folder].hasIndex;
     return `
     <div class="folder-group border-t border-[#cbd5e1]">
       <div class="flex items-center gap-2 px-4 py-2 bg-white hover:bg-[#f6f8fa] cursor-pointer select-none ${indentClass}" onclick="toggleFolder('${folderKey.replace(/'/g, "\\'")}')">
         <span class="text-[12px]">${fCollapsed?'▸':'▾'}</span>
         <span class="text-[13px]">${folder===''?'🗂️':'📁'}</span>
         <span class="text-[13px] font-medium truncate">${folderLabel}</span>
         ${hasIndex ? `<a href="https://leha-os.github.io/${repo.name}${folder?'/'+folder+'/':'/'}" target="_blank" class="ml-2 text-[11px] text-[#57606a] hover:text-[#24292f] hover:underline shrink-0" onclick="event.stopPropagation()">/${folder?folder+'/':''}</a>` : ``}
       </div>
       <div class="folder-body ${fCollapsed?'hidden':''}" id="folder-${CSS.escape(folderKey)}">
         ${filteredFiles.map(l=>{
           let selId=l.repo+'::'+l.filePath;
           let isSel=selected.has(selId);
           let displayName = customNames[l.key] || l.label;
           let hasNote = !!customNames[l.key];
           return `
           <div data-sel="${selId}" class="file-row ${isSel?'selected':''} flex items-center justify-between ${indentClass} pr-3 py-2 text-[13px] group border-t border-[#f6f8fa]">
             <div class="flex items-center gap-2 min-w-0 flex-1">
               <input type="checkbox" ${isSel?'checked':''} onchange="toggleSelect('${l.repo}','${l.filePath}','${l.key}')" class="w-3.5 h-3.5">
               <span class="text-[12px] text-[#8b949e]">↳</span>
               <span class="truncate ${hasNote?'font-medium text-[#24292f]':''}" title="${l.path}" ondblclick="editNote('${l.key.replace(/'/g, "\\'")}')">${displayName}</span>
               ${hasNote?`<span class="ml-1 text-[10px] bg-[#f6f8fa] text-[#57606a] px-1 rounded">note</span>`:''}
             </div>
             <div class="flex items-center gap-1">
               <a href="${l.url}" target="_blank" class="text-[12px] bg-[#0d1117] text-white px-3 py-1.5 rounded-md">OPEN</a>
               <button onclick="copyLink('${l.url}')" class="text-[12px] border bg-white px-3 py-1.5 rounded-md">Copy</button>
               <div class="dropdown">
                 <button onclick="toggleMenu('${selId}')" class="text-[12px] border bg-white px-2 py-1.5 rounded-md">⋯</button>
                 <div id="menu-${selId}" class="dropdown-menu hidden">
                   <button onclick="editNote('${l.key.replace(/'/g, "\\'")}');closeAllMenus()">📝 Edit ghi chú</button>
                   <button onclick="editFile('${l.repo}','${l.filePath}');closeAllMenus()">✏️ Edit Real</button>
                   <button onclick="window.open('${l.githubUrl}','_blank');closeAllMenus()">🔗 Github</button>
                   <button onclick="deleteFile('${l.repo}','${l.filePath}');closeAllMenus()" class="text-[#cf222e]">🗑️ Del</button>
                 </div>
               </div>
             </div>
           </div>
           `;
         }).join('')}
       </div>
     </div>
     `;
   }).join('');
   let hasRootIndex = grouped[''] && grouped[''].hasIndex;
   let section=document.createElement('div');
   section.className='border-b-2 border-[#6b7280] last:border-0';
   section.innerHTML=`
     <div class="repo-header px-3 py-2.5 bg-[#f6f8fa] flex items-center gap-2 cursor-pointer select-none" onclick="toggleRepo('${repo.name}')">
       <span class="text-[13px]">${repoCollapsed?'▸':'▾'}</span>
       <span class="font-semibold text-[14px] text-[#24292f]">${repo.name}</span>
       ${hasRootIndex ? `<a href="https://leha-os.github.io/${repo.name}/" target="_blank" class="ml-auto text-[12px] text-[#57606a] hover:text-[#24292f] hover:underline" onclick="event.stopPropagation()">/leha-os.github.io/${repo.name}/</a>` : ``}
     </div>
     <div class="repo-body ${repoCollapsed?'hidden':''}" id="body-${repo.name}">
       ${foldersHtml || `<div class="pl-8 pr-3 py-2 text-[12px] text-[#8b949e]">No HTML</div>`}
     </div>
   `;
   out.appendChild(section);
 }
}

async function scanAll(force=false){
 let user='leha-os';
 let headers=getHeaders();
 let btn=document.getElementById('scanBtn');
 let oldText=btn?btn.innerText:'';
 if(btn){ btn.innerText='Syncing...'; btn.disabled=true; }
 try{
   if(!force){
     if(renderFromCache()){
       setTimeout(()=>scanAll(true), 400);
       return;
     }
   }
   let res=await fetch(`https://api.github.com/user/repos?per_page=100&sort=updated`,{headers});
   let repos=[];
   if(res.ok && localStorage.getItem('gh_token')){
     let data=await res.json();
     repos=data.filter(r=>r.owner.login.toLowerCase()==user.toLowerCase());
   }
   if(!repos.length){
     let r2=await fetch(`https://api.github.com/users/${user}/repos?per_page=100&sort=updated`,{headers});
     repos=await r2.json();
   }
   reposCache=repos;
   let groupedByRepo={};
   let out=document.getElementById('out');
   if(out && force) out.innerHTML='<div class="p-4 text-[13px] text-[#57606a]">Đang sync nhanh + quét folder con của con... hiện từng repo khi xong.</div>';
   
   const batchSize=5;
   for(let i=0;i<repos.length;i+=batchSize){
     let batch=repos.slice(i,i+batchSize);
     await Promise.all(batch.map(async (repo)=>{
       let grouped={}; grouped['']=[];
       await scanFolderRecursive(user, repo.name, '', grouped, 0, 4);
       // also ensure root has hasIndex flag
       if(!grouped['']) grouped['']=[]; if(grouped[''].hasIndex===undefined) grouped[''].hasIndex=false;
       groupedByRepo[repo.name]=grouped;
     }));
     if(force){
       renderReposFromGrouped(repos.slice(0, i+batchSize), groupedByRepo);
       document.getElementById('syncStatus').innerText=`syncing ${Math.min(i+batchSize, repos.length)}/${repos.length}...`;
     }
   }
   renderReposFromGrouped(repos, groupedByRepo);
   saveCache(repos, groupedByRepo);
   document.getElementById('syncStatus').innerText='synced '+new Date().toLocaleTimeString();
 } finally {
   if(btn){ btn.innerText=oldText||'Sync now'; btn.disabled=false; }
 }
}

function toggleSelect(repo, path, key){
 let id=repo+'::'+path;
 if(selected.has(id)) selected.delete(id);
 else selected.set(id,{repo,path,key});
 updateBulkBar();
 document.querySelectorAll(`[data-sel="${CSS.escape(id)}"]`).forEach(el=>{
   if(selected.has(id)) el.classList.add('selected');
   else el.classList.remove('selected');
   let cb=el.querySelector('input[type=checkbox]');
   if(cb) cb.checked=selected.has(id);
 });
}
function updateBulkBar(){
 let bar=document.getElementById('bulkBar');
 let cnt=document.getElementById('bulkCount');
 if(selected.size===0){ bar.classList.add('hidden'); }
 else { bar.classList.remove('hidden'); cnt.innerText=selected.size+' selected'; }
}
function clearSelection(){ selected.clear(); updateBulkBar(); document.querySelectorAll('.file-row').forEach(r=>{ r.classList.remove('selected'); let cb=r.querySelector('input'); if(cb) cb.checked=false; }); }
function toggleRepo(name){
 let body=document.getElementById('body-'+name);
 if(!body) return;
 let isHidden=body.classList.contains('hidden');
 body.classList.toggle('hidden');
 localStorage.setItem('collapsed_'+name, isHidden?'0':'1');
}
function toggleFolder(key){
 let id='folder-'+CSS.escape(key);
 let body=document.getElementById(id);
 if(!body) return;
 let isHidden=body.classList.contains('hidden');
 body.classList.toggle('hidden');
 localStorage.setItem('collapsed_folder_'+key, isHidden?'0':'1');
}
function collapseAll(){
 document.querySelectorAll('.repo-body').forEach(b=>b.classList.add('hidden'));
 document.querySelectorAll('.folder-body').forEach(b=>b.classList.add('hidden'));
 document.querySelectorAll('[id^="body-"]').forEach(b=>{ localStorage.setItem('collapsed_'+b.id.replace('body-',''),'1'); });
}
function openAll(){
 document.querySelectorAll('.repo-body').forEach(b=>b.classList.remove('hidden'));
 document.querySelectorAll('.folder-body').forEach(b=>b.classList.remove('hidden'));
 document.querySelectorAll('[id^="body-"]').forEach(b=>{ localStorage.setItem('collapsed_'+b.id.replace('body-',''),'0'); });
}
async function editNote(key){
 let cur=customNames[key]||'';
 let nv=await customPrompt('Đổi tên hiển thị dễ nhớ (chỉ lưu ở máy bạn):', cur, 'VD: Khách A - chốt v1');
 if(nv===null) return;
 if(nv.trim()===''){ delete customNames[key]; } else { customNames[key]=nv.trim(); }
 localStorage.setItem('customNames', JSON.stringify(customNames));
 let cache=loadCache(); if(cache) renderReposFromGrouped(cache.repos, cache.groupedData); else renderFromCache();
}
function toggleMenu(id){
 let menu=document.getElementById('menu-'+id);
 if(!menu) return;
 let isHidden=menu.classList.contains('hidden');
 closeAllMenus();
 if(isHidden) menu.classList.remove('hidden');
}
function closeAllMenus(){
 document.querySelectorAll('.dropdown-menu').forEach(m=>m.classList.add('hidden'));
}
document.addEventListener('click', function(e){ if(!e.target.closest('.dropdown')) closeAllMenus(); });
function copyLink(url){ navigator.clipboard.writeText(url); const s=document.getElementById('syncStatus'); let old=s.innerText; s.innerText='copied!'; setTimeout(()=>s.innerText=old,1200); }

function showCustomModal({title, msg, input, placeholder, okText, danger}){
 return new Promise(resolve=>{
  const modal=document.getElementById('customModal');
  document.getElementById('customModalTitle').innerText=title||'Xác nhận';
  document.getElementById('customModalMsg').innerText=msg||'';
  const inputWrap=document.getElementById('customModalInputWrap');
  const inputEl=document.getElementById('customModalInput');
  const okBtn=document.getElementById('customModalOk');
  const cancelBtn=document.getElementById('customModalCancel');
  if(input!==undefined){
    inputWrap.classList.remove('hidden');
    inputEl.value=input;
    inputEl.placeholder=placeholder||'';
    setTimeout(()=>inputEl.focus(),100);
  } else {
    inputWrap.classList.add('hidden');
  }
  okBtn.innerText=okText||'OK';
  okBtn.className = danger ? 'px-4 py-2 text-[13px] bg-[#cf222e] text-white rounded-md hover:bg-[#a40e26]' : 'px-4 py-2 text-[13px] bg-[#0d1117] text-white rounded-md hover:bg-black';
  modal.classList.remove('hidden');
  function cleanup(result){
    modal.classList.add('hidden');
    okBtn.removeEventListener('click', onOk);
    cancelBtn.removeEventListener('click', onCancel);
    modal.removeEventListener('click', onOutside);
    inputEl.removeEventListener('keydown', onKey);
    resolve(result);
  }
  function onOk(){ if(inputWrap.classList.contains('hidden')) cleanup(true); else cleanup(inputEl.value); }
  function onCancel(){ cleanup(null); }
  function onOutside(e){ if(e.target===modal) cleanup(null); }
  function onKey(e){ if(e.key==='Enter') onOk(); if(e.key==='Escape') onCancel(); }
  okBtn.addEventListener('click', onOk);
  cancelBtn.addEventListener('click', onCancel);
  modal.addEventListener('click', onOutside);
  inputEl.addEventListener('keydown', onKey);
 });
}
async function customConfirm(msg, title){
  const r=await showCustomModal({title:title||'Xác nhận', msg, okText:'Xóa', danger:true});
  return !!r;
}
async function customPrompt(msg, def, placeholder){
  const r=await showCustomModal({title:'Nhập thông tin', msg, input:def||'', placeholder:placeholder||'', okText:'OK', danger:false});
  return r;
}


async function moveFolder(repoName, folderPath){
 let token=localStorage.getItem('gh_token'); if(!token){ await showCustomModal({title:'Thiếu token', msg:'Cần token'}); return; }
 let displayPath = folderPath==='' ? '(root)' : folderPath;
 const confirmMove = await customConfirm(`Di chuyển cả folder "${displayPath}" trong repo "${repoName}"?\nSẽ di chuyển tất cả file bên trong kể cả folder con của con.`, `Move folder ${displayPath}`);
 if(!confirmMove) return;
 let cache=loadCache();
 if(!cache){ await showCustomModal({title:'Chưa có cache', msg:'Bấm Sync now trước'}); return; }
 let groupedByRepo = cache.groupedData;
 let grouped = groupedByRepo[repoName];
 if(!grouped){ return; }
 // Collect all files under this folder (including nested)
 let filesToMove=[];
 for(let key of Object.keys(grouped)){
   if(folderPath==='' ){
     // root: only move files in root? For root we ask user to specify? We'll move only root files
     if(key==='') filesToMove.push(...grouped[key]);
   } else {
     if(key===folderPath || key.startsWith(folderPath+'/')){
       filesToMove.push(...grouped[key].map(f=>({...f, originalFolderKey:key})));
     }
   }
 }
 if(!filesToMove.length){ await showCustomModal({title:'Trống', msg:'Folder này không có file HTML nào'}); return; }

 let newRepo = await customPrompt(`Di chuyển ${filesToMove.length} file từ folder "${displayPath}"\nNhập repo đích (để trống = giữ nguyên repo ${repoName}):`, repoName, 'repo đích');
 if(newRepo===null) return;
 if(!newRepo) newRepo=repoName;

 let targetFolder = await customPrompt(`Nhập folder đích mới (ví dụ: lab-moi/ hoặc archive/2024/):`, folderPath, 'folder đích');
 if(targetFolder===null) return;
 targetFolder = targetFolder.trim().replace(/^\/+|\/+$/g,''); // trim slashes

 const ok = await showCustomModal({title:`Move folder ${displayPath} → ${targetFolder||'(root)'}`, msg:`Di chuyển ${filesToMove.length} file từ "${repoName}/${displayPath}" sang "${newRepo}/${targetFolder||'(root)'}".\nGiữ cấu trúc con bên trong.`, okText:'Move folder', danger:false});
 if(!ok) return;

 document.getElementById('syncStatus').innerText=`moving folder ${filesToMove.length} files...`;
 let moved=0, failed=0;
 for(let file of filesToMove){
   // compute relative path from source folder
   let relPath;
   if(folderPath===''){
     relPath = file.filePath; // already root file name
   } else {
     // file.filePath is like "lab/sub/file.html" -> relative is sub/file.html or file.html
     if(file.filePath===folderPath) relPath = file.filePath.split('/').pop();
     else if(file.filePath.startsWith(folderPath+'/')) relPath = file.filePath.substring(folderPath.length+1);
     else relPath = file.filePath;
   }
   let destPath = targetFolder ? `${targetFolder}/${relPath}` : relPath;
   try{
     let srcRes=await fetch(`https://api.github.com/repos/leha-os/${file.repo}/contents/${file.filePathFull||file.filePath}?ref=main`,{headers:getHeaders()});
     if(!srcRes.ok) srcRes=await fetch(`https://api.github.com/repos/leha-os/${file.repo}/contents/${file.filePathFull||file.filePath}?ref=master`,{headers:getHeaders()});
     if(!srcRes.ok){ failed++; continue; }
     let srcData=await srcRes.json();
     let createRes=await fetch(`https://api.github.com/repos/leha-os/${newRepo}/contents/${destPath}`,{
       method:'PUT',
       headers:{...getHeaders(),'Content-Type':'application/json'},
       body: JSON.stringify({message:`Move folder ${displayPath}: ${file.filePath} -> ${destPath}`, content: srcData.content})
     });
     if(!createRes.ok){ failed++; continue; }
     // delete source if different
     if(newRepo!==file.repo || destPath!==file.filePath){
       await fetch(`https://api.github.com/repos/leha-os/${file.repo}/contents/${file.filePathFull||file.filePath}`,{
         method:'DELETE',
         headers:{...getHeaders(),'Content-Type':'application/json'},
         body: JSON.stringify({message:`Delete after folder move to ${newRepo}/${destPath}`, sha: srcData.sha})
       });
     }
     moved++;
     document.getElementById('syncStatus').innerText=`moving ${moved}/${filesToMove.length}...`;
   }catch(e){ failed++; }
 }
 await showCustomModal({title:'Xong', msg:`Đã di chuyển ${moved} file, lỗi ${failed} file.`, okText:'OK'});
 scanAll(true);
}

async function moveSelected(){
 if(selected.size===0) return;
 let token=localStorage.getItem('gh_token'); if(!token){ await showCustomModal({title:'Thiếu token', msg:'Cần token có quyền repo để move', okText:'OK'}); return; }
 let repos=[...new Set([...selected.values()].map(v=>v.repo))];
 let targetRepo = repos.length===1 ? repos[0] : null;
 let newRepo = await customPrompt(`Bạn đang chọn ${selected.size} file từ repo: ${repos.join(', ')}\nNhập repo đích (để trống = giữ nguyên):`, targetRepo||'', 'tên repo đích');
 if(newRepo===null) return;
 if(!newRepo) newRepo=null;
 let targetFolder = await customPrompt('Nhập folder đích (ví dụ: lab/ hoặc để trống = root):','lab/', 'lab/');
 if(targetFolder===null) return;
 targetFolder = targetFolder.trim();
 if(targetFolder && !targetFolder.endsWith('/')) targetFolder+='/';
 if(targetFolder==='/' ) targetFolder='';
 const okMove = await showCustomModal({title:`Move ${selected.size} files`, msg:`Move tới ${newRepo?newRepo+'/':'(giữ repo cũ)'}${targetFolder||'(root)'} ?`, okText:'Move'});
 if(!okMove) return;
 for(let [id, info] of selected){
   let destRepo = newRepo || info.repo;
   let fileName = info.path.split('/').pop();
   let destPath = targetFolder + fileName;
   try{
     let srcRes=await fetch(`https://api.github.com/repos/leha-os/${info.repo}/contents/${info.path}?ref=main`,{headers:getHeaders()});
     if(!srcRes.ok) srcRes=await fetch(`https://api.github.com/repos/leha-os/${info.repo}/contents/${info.path}?ref=master`,{headers:getHeaders()});
     if(!srcRes.ok) continue;
     let srcData=await srcRes.json();
     let createRes=await fetch(`https://api.github.com/repos/leha-os/${destRepo}/contents/${destPath}`,{
       method:'PUT',
       headers:{...getHeaders(),'Content-Type':'application/json'},
       body: JSON.stringify({message:`Move ${info.path} to ${destPath}`, content: srcData.content})
     });
     if(!createRes.ok) continue;
     if(destRepo!==info.repo || destPath!==info.path){
       await fetch(`https://api.github.com/repos/leha-os/${info.repo}/contents/${info.path}`,{
         method:'DELETE',
         headers:{...getHeaders(),'Content-Type':'application/json'},
         body: JSON.stringify({message:`Delete after move`, sha: srcData.sha})
       });
     }
   }catch(e){}
 }
 clearSelection();
 scanAll(true);
}
async function deleteSelected(){
 if(selected.size===0) return;
 const okDel=await customConfirm(`Xóa ${selected.size} file đã chọn? Không khôi phục được.`, `Xóa ${selected.size} files`);
 if(!okDel) return;
 for(let [id, info] of selected){
   await deleteFile(info.repo, info.path, true);
 }
 clearSelection();
 scanAll(true);
}

<div id="editModal" class="hidden fixed inset-0 bg-black/60 flex items-center justify-center p-2 z-50">
  <div class="bg-white rounded-lg border w-full max-w-4xl max-h-[95vh] flex flex-col">
    <div class="px-4 py-3 border-b flex justify-between items-center bg-[#f6f8fa] rounded-t-lg">
      <div><span id="editTitle" class="text-[14px] font-semibold">Edit</span><div id="editPath" class="text-[12px] text-[#57606a]"></div></div>
      <button onclick="closeModal()" class="w-7 h-7 rounded-full hover:bg-[#9ca3af] flex items-center justify-center">✕</button>
    </div>
    <div class="px-4 py-3 border-b bg-[#fff8c5] flex flex-wrap gap-2 items-center text-[13px]">
      <span class="font-semibold">⚡</span>
      <button onclick="applyBGConfig()" class="bg-[#0d1117] text-white px-4 py-2 rounded-md font-medium">BG_CONFIG → Replace to</button>
      <button onclick="applyHeroLogo()" class="bg-white border px-4 py-2 rounded-md">HERO_CONFIG → Replace to</button>
    </div>
    <div class="p-3 flex-1 overflow-hidden flex flex-col">
      <textarea id="editContent" class="w-full flex-1 min-h-[420px] border rounded-md p-3 text-[13px] font-mono"></textarea>
    </div>
    <div class="px-4 py-3 border-t flex justify-end gap-2 bg-[#f6f8fa] rounded-b-lg">
      <button onclick="closeModal()" class="border bg-white px-4 py-2 text-[13px] rounded-md">Cancel</button>
      <button onclick="saveFile()" class="bg-[#2ea043] text-white px-8 py-2.5 text-[14px] font-bold rounded-md">Save</button>
    </div>
  </div>
</div>
<script>
let curEdit={repo:null,path:null,sha:null};
function b64DecodeUtf8(b64){
  b64=b64.replace(/\n/g,'').trim();
  try{
    const binary=atob(b64);
    const bytes=Uint8Array.from(binary, c=>c.charCodeAt(0));
    return new TextDecoder('utf-8').decode(bytes);
  }catch(e){ return atob(b64); }
}
function b64EncodeUtf8(str){
  const bytes=new TextEncoder().encode(str);
  let binary=''; bytes.forEach(b=>binary+=String.fromCharCode(b));
  return btoa(binary);
}
async function editFile(repo,filePath){
 let token=localStorage.getItem('gh_token'); if(!token){ await showCustomModal({title:'Thiếu token', msg:'Cần token'}); return; }
 let res=await fetch('https://api.github.com/repos/leha-os/'+repo+'/contents/'+filePath+'?ref=main',{headers:getHeaders()});
 if(!res.ok) res=await fetch('https://api.github.com/repos/leha-os/'+repo+'/contents/'+filePath+'?ref=master',{headers:getHeaders()});
 if(!res.ok){ await showCustomModal({title:'Lỗi', msg:'Fetch failed '+res.status}); return; }
 let data=await res.json();
 let content=b64DecodeUtf8(data.content);
 curEdit={repo,path:filePath,sha:data.sha};
 document.getElementById('editTitle').innerText=filePath;
 document.getElementById('editPath').innerText='leha-os/'+repo+'/'+filePath;
 document.getElementById('editContent').value=content;
 document.getElementById('editModal').classList.remove('hidden');
}
function applyBGConfig(){
  let ta=document.getElementById('editContent');
  let newBG = "const BG_CONFIG = {\n  type: \"radial_breath\",\n  radial: {\n    colors: [\"#0f172a\", \"#1e293b\", \"#334155\"],\n    breatheDuration: 8000,\n    scale: [1, 1.08, 1],\n    opacity: 0.6\n  },\n  noise: { enabled: true, opacity: 0.03, size: 200 },\n  dust: { enabled: true, count: 40, speed: 0.15, size: [1, 2.5], opacity: [0.1, 0.4], drift: true }\n};";
  let old=ta.value;
  if(old.indexOf('BG_CONFIG')!==-1){ ta.value = old.replace(/const\s+BG_CONFIG\s*=\s*\{[\s\S]*?\n\};/, newBG); if(ta.value===old) ta.value = old.replace(/BG_CONFIG[\s\S]*?\};/, newBG.replace('const ','')); } else { ta.value = newBG + "\n\n" + old; }
}
function applyHeroLogo(){
  let ta=document.getElementById('editContent');
  let newHero = "const HERO_CONFIG = {\n  type: \"logo\",\n  logo: { src: \"/assets/logo.svg\", width: 180, height: 180, animate: \"float_gentle\" },\n  centered: true\n};";
  let old=ta.value;
  if(old.indexOf('HERO_CONFIG')!==-1){ ta.value = old.replace(/const\s+HERO_CONFIG\s*=\s*\{[\s\S]*?\n\};/, newHero); if(ta.value===old) ta.value = old.replace(/HERO_CONFIG[\s\S]*?\};/, newHero.replace('const ','')); } else { ta.value = newHero + "\n\n" + old; }
}
function closeModal(){document.getElementById('editModal').classList.add('hidden');}
async function saveFile(){
 let txt=document.getElementById('editContent').value;
 let b64=b64EncodeUtf8(txt);
 let res=await fetch('https://api.github.com/repos/leha-os/'+curEdit.repo+'/contents/'+curEdit.path,{method:'PUT',headers:{...getHeaders(),'Content-Type':'application/json'},body:JSON.stringify({message:'Edit '+curEdit.path,content:b64,sha:curEdit.sha})});
 if(res.ok){ await showCustomModal({title:'Đã lưu', msg:'Saved!'}); closeModal(); scanAll(true); } else { await showCustomModal({title:'Lỗi', msg:await res.text()}); }
}
async function deleteFile(repo,filePath, silent){
 let token=localStorage.getItem('gh_token'); if(!token){ return; }
 if(!silent){ const ok=await customConfirm('Xóa file '+repo+'/'+filePath+'? Không khôi phục được.', 'Xóa file'); if(!ok) return; }
 let r=await fetch('https://api.github.com/repos/leha-os/'+repo+'/contents/'+filePath+'?ref=main',{headers:getHeaders()});
 if(!r.ok) r=await fetch('https://api.github.com/repos/leha-os/'+repo+'/contents/'+filePath+'?ref=master',{headers:getHeaders()});
 if(!r.ok) return;
 let d=await r.json();
 let del=await fetch('https://api.github.com/repos/leha-os/'+repo+'/contents/'+filePath,{method:'DELETE',headers:{...getHeaders(),'Content-Type':'application/json'},body:JSON.stringify({message:'Delete '+filePath,sha:d.sha})});
 if(del.ok && !silent){ await showCustomModal({title:'Đã xóa', msg:'Deleted'}); scanAll(true); }
}
</script>
