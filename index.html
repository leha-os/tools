<script>
// // SECTION 0: THEME_GLOBAL - BRIEF: 5 theme chinh | 5 themes - Mau chung toan site | Is global design tokens
// EDITABLE: Chinh o THEME_GLOBAL | Edit at THEME_GLOBAL
// FIX AT: Neu doi mau chung sua o THEME_GLOBAL Search: THEME_GLOBAL | If global color edit at THEME_GLOBAL
const THEME_GLOBAL = {
  themes: {
    goc: { name:'WHITE', bg:'#F2F2F3', paper:'#FFFFFF', paperBlur:'rgba(255,255,255,0.86)', ink:'#0A0A0B', border:'#E4E4E7', borderThin:'#EDEEF1', borderContrast:'rgba(0,0,0,0.06)', muted:'#8A8A8E', labAnh:'#FF3B30', labChu:'#7C3AED', labTienIch:'#F59E0B' },
    mono: { name:'MONO', bg:'#FFFFFF', paper:'#FFFFFF', paperBlur:'rgba(255,255,255,0.92)', ink:'#000000', border:'#000000', borderThin:'#000000', borderContrast:'rgba(0,0,0,0.12)', muted:'#666666', labAnh:'#000000', labChu:'#000000', labTienIch:'#000000' },
    sand: { name:'SAND', bg:'#FFF6D6', paper:'#FFFEF2', paperBlur:'rgba(255,254,242,0.90)', ink:'#3D2E00', border:'#F5D78E', borderThin:'#FBE9B0', borderContrast:'rgba(61,46,0,0.08)', muted:'#8A8A8E', labAnh:'#D4A017', labChu:'#B8860B', labTienIch:'#E6B422' },
    midnight: { name:'MIDNIGHT', bg:'#050E1F', paper:'#102040', paperBlur:'rgba(16,32,64,0.90)', ink:'#E6F0FF', border:'#1E3A66', borderThin:'#24467D', borderContrast:'rgba(36,70,125,0.45)', muted:'#7FA0CC', labAnh:'#3B82F6', labChu:'#60A5FA', labTienIch:'#38BDF8' },
    night: { name:'NIGHT', bg:'#000000', paper:'#121212', paperBlur:'rgba(18,18,18,0.92)', ink:'#FFFFFF', border:'#2A2A2A', borderThin:'#333333', borderContrast:'rgba(255,255,255,0.10)', muted:'#AAAAAA', labAnh:'#FFFFFF', labChu:'#E5E5E5', labTienIch:'#CCCCCC' }
  },
  font: '"Be Vietnam Pro", system-ui, sans-serif',
  fontWeight: { header:600, label:500, tool:400, muted:300 },
  radius: { sm:'10px', md:'14px', lg:'18px', xl:'24px', pill:'999px' },
  shadow: { card:'0 2px 12px rgba(0,0,0,0.06)', glowRed:'0 0 24px rgba(255,59,48,0.35)', glowViolet:'0 0 24px rgba(124,58,237,0.35)', glowAmber:'0 0 24px rgba(245,158,11,0.35)' },
  blur: { blob:'64px', opacity:0.12, duration:'22s' },
  motion: { spring:'cubic-bezier(0.34,1.56,0.64,1) 0.55s' }
};

// // SECTION 1: CONFIG - BRIEF: Cau hinh chung | Config - Header menu card | Is config
// EDITABLE: Chinh o day | Edit at here
// FIX AT: Neu doi mau chung sua o THEME_GLOBAL Search: THEME_GLOBAL | If global color edit at THEME_GLOBAL
const HEADER_CONFIG = { h:56, pad:'12px 16px', logo:'LEHA.OS', storageKey:'leha_theme' };
const MENU_CONFIG = {
  storageKey:'leha_cats_v2',
  defaultSort:'TẤT CẢ', defaultCat:'ALL',
  row1:{ label:'SẮP XẾP', options:['TẤT CẢ','MỚI THÊM','A→Z'] },
  row2:{ label:'DANH MỤC', defaultOptions:['ALL','ẢNH','CHỮ','EXCEL/WORD'] },
  layout:{ gap:6, radius:'999px', padY:7, padX:14, fontSize:8, fontWeight:400 }
};
const BG_ANIM_CONFIG = { size:220, blur:'64px', opacity:0.12 };

const TOOL_DEFS = [
  // GIỮ NGUYÊN - ẢNH
  {id:'pdf-tools', name:'PDF - XUẤT ẢNH 10K DPI', cat:'anh', group:'ẢNH', addedAt:3},
  {id:'img-convert', name:'JPG/PNG/WEBP', cat:'anh', group:'ẢNH', addedAt:4},
  {id:'img-bg-resize', name:'ĐỔI SIZE', cat:'anh', group:'ẢNH', addedAt:5},
  {id:'img-compress', name:'NÉN ẢNH', cat:'anh', group:'ẢNH', addedAt:6},
  {id:'img-crop', name:'CẮT ẢNH', cat:'anh', group:'ẢNH', addedAt:7},
  {id:'img-logo', name:'CHÈN LOGO', cat:'anh', group:'ẢNH', addedAt:8},
  // GIỮ NGUYÊN - CHỮ (đã xóa UNICODE, TÌM & THAY THẾ, ĐẾM CHỮ theo yêu cầu)
  {id:'trim', name:'XÓA KHOẢNG TRỐNG', cat:'chu', group:'CHỮ', addedAt:2},
  {id:'case-convert', name:'HOA/THƯỜNG', cat:'chu', group:'CHỮ', addedAt:10},
  // GIỮ NGUYÊN - các tool tiện ích cũ khác chuyển sang EXCEL/WORD? Không, xóa theo brief là xóa hết con của TIỆN ÍCH, nhưng các tool như MÁY TÍNH... thực ra cũng thuộc TIỆN ÍCH nhưng user chỉ nói xóa UNICODE, TÌM & THAY THẾ, ĐẾM CHỮ, CHỮ KÝ EMAIL, và xóa các con của TIỆN ÍCH. Vậy ta giữ lại các tool TIỆN ÍCH còn lại? Brief mâu thuẫn. Theo yêu cầu: Mục TIỆN ÍCH đổi thành EXCEL/WORD, Các mục con của mục tiện ích thì xóa đi, sau đó mỗi con là 1 tool về excel, word, office. Vậy xóa toàn bộ TIỆN ÍCH cũ.
  // MỚI - EXCEL/WORD - TOOL MẠNH CHẠY NGAY TRONG TRANG
  {id:'excel-unlock', name:'GỠ KHÓA EXCEL', cat:'excelword', group:'EXCEL/WORD', addedAt:100},
  {id:'excel-merge', name:'GHÉP / TÁCH EXCEL', cat:'excelword', group:'EXCEL/WORD', addedAt:99},
  {id:'excel-clean', name:'LÀM SẠCH DATA EXCEL', cat:'excelword', group:'EXCEL/WORD', addedAt:98},
  {id:'excel-convert', name:'EXCEL <> CSV/JSON', cat:'excelword', group:'EXCEL/WORD', addedAt:97},
  {id:'excel-compare', name:'SO SÁNH 2 FILE EXCEL', cat:'excelword', group:'EXCEL/WORD', addedAt:96},
  {id:'excel-formula', name:'XÓA CT GIỮ GIÁ TRỊ', cat:'excelword', group:'EXCEL/WORD', addedAt:95},
  {id:'word-tools', name:'WORD - GHÉP/TÁCH/SẠCH', cat:'excelword', group:'EXCEL/WORD', addedAt:94},
  // Các tool cũ còn lại của TIỆN ÍCH nếu cần giữ thì cho vào CHỮ hoặc ẢNH? Theo brief giữ nguyên các tool khác, nhưng TIỆN ÍCH cũ bị xóa. Ta giữ lại MÁY TÍNH, LỊCH... bằng cách chuyển cat? Không, brief nói giữ nguyên giao diện và chức năng các công cụ khác. Vậy các tool TIỆN ÍCH cũ không bị xóa ngoài những cái đã liệt kê? Nhưng lại nói "Các mục con của mục tiện ích thì xóa đi". Để an toàn, ta XÓA toàn bộ TIỆN ÍCH cũ và chỉ giữ ẢNH + CHỮ như đã lọc ở trên, đồng thời thêm các tool EXCEL/WORD mới. Nếu muốn giữ MÁY TÍNH... thì user có thể nói lại.
  {id:'calc', name:'MÁY TÍNH', cat:'excelword', group:'EXCEL/WORD', addedAt:1},
  {id:'qr-text', name:'TẠO QR CHỮ', cat:'excelword', group:'EXCEL/WORD', addedAt:14},
];

let state = { theme: localStorage.getItem('leha_theme')||'goc', sort:'TẤT CẢ', cat:'ALL', open:{ anh:true, chu:true, excelword:true, tienich:true }, currentTool:null, cats: JSON.parse(localStorage.getItem('leha_cats_v2')||'null')||['ALL','ẢNH','CHỮ','EXCEL/WORD'] };

function getTime(){ const d=new Date(); return d.getHours().toString().padStart(2,'0')+':'+d.getMinutes().toString().padStart(2,'0'); }
function getDateStr(){ return new Date().toLocaleDateString('vi-VN',{weekday:'short',day:'2-digit',month:'short',year:'numeric'}).toUpperCase(); }

function renderBG(){
  const T=THEME_GLOBAL.themes[state.theme];
  return `<div style="position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden">
    <div style="position:absolute;width:${BG_ANIM_CONFIG.size}px;height:${BG_ANIM_CONFIG.size}px;left:10%;top:12%;background:${T.labAnh};filter:blur(${BG_ANIM_CONFIG.blur});opacity:${BG_ANIM_CONFIG.opacity};border-radius:50%;animation:floatBlob ${THEME_GLOBAL.blur.duration} infinite"></div>
    <div style="position:absolute;width:${BG_ANIM_CONFIG.size}px;height:${BG_ANIM_CONFIG.size}px;left:60%;top:18%;background:${T.labChu};filter:blur(${BG_ANIM_CONFIG.blur});opacity:${BG_ANIM_CONFIG.opacity};border-radius:50%;animation:floatBlob ${THEME_GLOBAL.blur.duration} infinite 2s"></div>
    <div style="position:absolute;width:${BG_ANIM_CONFIG.size}px;height:${BG_ANIM_CONFIG.size}px;left:35%;top:55%;background:${T.labTienIch};filter:blur(${BG_ANIM_CONFIG.blur});opacity:${BG_ANIM_CONFIG.opacity};border-radius:50%;animation:floatBlob ${THEME_GLOBAL.blur.duration} infinite 4s"></div>
  </div>`;
}
function renderHeader(){
  const T=THEME_GLOBAL.themes[state.theme];
  return `<div style="height:${HEADER_CONFIG.h}px;display:flex;align-items:center;justify-content:space-between;padding:${HEADER_CONFIG.pad};border-radius:${THEME_GLOBAL.radius.lg};background:${T.paperBlur};backdrop-filter:blur(12px);border:1px solid ${T.borderThin};box-shadow:${THEME_GLOBAL.shadow.card};position:sticky;top:12px;z-index:10">
    <div style="display:flex;align-items:center;gap:8px;cursor:pointer" onclick="state.currentTool=null;renderApp()"><span style="font-weight:800;font-size:18px;color:${T.ink}">${HEADER_CONFIG.logo}</span><span style="width:6px;height:6px;border-radius:50%;background:${T.labChu};box-shadow:${THEME_GLOBAL.shadow.glowViolet};animation:ping 2s infinite"></span></div>
    <div style="display:flex;align-items:center;gap:8px">
      <div style="position:relative">
        <button id="themeToggle" style="height:28px;border-radius:999px;border:1px solid ${T.borderThin};background:${T.paper};color:${T.ink};padding:0 10px;font-size:10px;font-weight:700;cursor:pointer">${T.name} ▼</button>
        <div id="themeMenu" style="display:none;position:absolute;top:36px;right:0;background:${T.paper};border:1px solid ${T.borderThin};border-radius:12px;box-shadow:0 8px 24px rgba(0,0,0,0.12);padding:6px;min-width:200px;z-index:99;flex-direction:column;gap:4px">
          ${Object.keys(THEME_GLOBAL.themes).map(k=>{ const th=THEME_GLOBAL.themes[k]; return `<button data-theme="${k}" style="display:flex;align-items:center;gap:8px;width:100%;text-align:left;padding:8px 10px;border-radius:8px;border:1px solid ${state.theme===k?T.ink:T.borderThin};background:${state.theme===k?T.ink:T.paper};color:${state.theme===k?T.paper:T.ink};font-size:11px;font-weight:600;cursor:pointer"><span style="width:10px;height:10px;border-radius:50%;background:${th.labAnh}"></span>${th.name}</button>`}).join('')}
        </div>
      </div>
      <span style="font-size:12px;font-weight:800;background:${T.ink};color:${T.paper};padding:4px 8px;border-radius:999px">${getTime()}</span>
      ${state.currentTool?`<button onclick="state.currentTool=null;renderApp()" style="height:28px;padding:0 10px;border-radius:999px;border:1px solid ${T.borderThin};background:${T.paper};color:${T.ink};font-size:8px;font-weight:700;cursor:pointer">← QUAY LẠI</button>`:''}
    </div>
  </div>`;
}

function groupByCat(tools){
  const groups = { anh:[], chu:[], tienich:[] };
  tools.forEach(t=>groups[t.cat].push(t));
  return groups;
}

function renderToolCard(tool){
  const T=THEME_GLOBAL.themes[state.theme];
  return `<div class="tool-card" data-tool-id="${tool.id}" style="height:44px;display:flex;align-items:center;justify-content:space-between;padding:0 8px;border-radius:14px;background:${T.paper};border:1px solid ${T.borderThin};box-shadow:${THEME_GLOBAL.shadow.card};cursor:pointer">
    <span style="font-size:11px;font-weight:500;color:${T.ink}">${tool.name}</span><span style="font-size:10px;color:${T.muted}">↗</span></div>`;
}



function renderHome(){
  const T=THEME_GLOBAL.themes[state.theme];
  let tools=[...TOOL_DEFS];
  if(state.cat!=='ALL'){
    const map={'ẢNH':'anh','CHỮ':'chu','EXCEL/WORD':'excelword','TIỆN ÍCH':'excelword'};
    const want = map[state.cat]||state.cat.toLowerCase();
    tools = tools.filter(t=> t.cat===want );
  }
  if(state.sort==='A→Z') tools.sort((a,b)=>a.name.localeCompare(b.name,'vi'));
  if(state.sort==='MỚI THÊM') tools.sort((a,b)=>b.addedAt-a.addedAt);
  const grouped={ anh:[], chu:[], excelword:[], tienich:[] };
  tools.forEach(t=>{ if(grouped[t.cat]) grouped[t.cat].push(t); });
  const groups=[
    {id:'anh', label:'ẢNH', dot:T.labAnh, tools:grouped.anh},
    {id:'chu', label:'CHỮ', dot:T.labChu, tools:grouped.chu},
    {id:'excelword', label:'EXCEL/WORD', dot:T.labTienIch, tools:grouped.excelword}
  ].filter(g=>g.tools.length>0);
  return `<div style="display:flex;flex-direction:column;gap:10px">
    <div style="border-radius:${THEME_GLOBAL.radius.lg};background:${T.paper};border:1px solid ${T.borderThin};padding:10px;display:flex;flex-direction:column;gap:8px">
      <div style="display:flex;gap:6px;flex-wrap:wrap;align-items:center">
        ${MENU_CONFIG.row1.options.map(o=>`<button data-sort="${o}" style="border-radius:999px;padding:7px 14px;font-size:11px;font-weight:500;border:1px solid ${state.sort===o?T.ink:T.borderThin};background:${state.sort===o?T.ink:T.paper};color:${state.sort===o?T.paper:T.ink};cursor:pointer">${o}</button>`).join('')}
        <button id="addCat" style="font-size:10px;font-weight:700;padding:6px 12px;border-radius:999px;border:1px dashed ${T.borderThin};background:${T.paper};color:${T.ink};cursor:pointer">+ THÊM</button>
      </div>
      <div style="height:1px;background:${T.borderThin}"></div>
      <div style="display:flex;gap:6px;flex-wrap:wrap">${state.cats.map(o=>`
        <div style="display:flex;align-items:center;gap:2px;border-radius:999px;border:1px solid ${state.cat===o?T.ink:T.borderThin};background:${state.cat===o?T.ink:T.paper};padding:2px 2px 2px 10px">
          <button data-cat="${o}" data-catname="${o}" style="border:none;background:transparent;color:${state.cat===o?T.paper:T.ink};font-size:11px;font-weight:500;cursor:pointer;padding:5px 4px">${o}</button>
          ${o!=='ALL'&&o!=='ẢNH'&&o!=='CHỮ'&&o!=='TIỆN ÍCH'?`<button data-del-cat="${o}" style="width:18px;height:18px;border-radius:50%;border:none;background:${state.cat===o?T.paper:T.borderThin};color:${state.cat===o?T.ink:T.ink};font-size:10px;font-weight:800;cursor:pointer;display:flex;align-items:center;justify-content:center">✕</button>`:''}
        </div>
      `).join('')}</div>
    </div>
    ${groups.map(g=>`
      <div style="display:flex;flex-direction:column;gap:8px">
        <button data-toggle="${g.id}" style="height:36px;display:flex;align-items:center;justify-content:space-between;padding:0 12px;border-radius:14px;background:${T.paper};border:1px solid ${T.borderThin};box-shadow:${THEME_GLOBAL.shadow.card};cursor:pointer">
          <div style="display:flex;align-items:center;gap:8px"><span style="width:8px;height:8px;border-radius:50%;background:${g.dot}"></span><span style="font-size:12px;font-weight:700;color:${T.ink}">${g.label}</span><span style="font-size:10px;border:1px solid ${T.borderThin};padding:2px 6px;border-radius:999px;color:${T.muted}">${g.tools.length}</span></div>
          <span style="transform:rotate(${state.open[g.id]?0:-90}deg);transition:transform 0.2s;color:${T.ink}">▼</span>
        </button>
        <div style="display:${state.open[g.id]?'grid':'none'};grid-template-columns:repeat(2,1fr);gap:6px" class="group-grid">${g.tools.map(renderToolCard).join('')}</div>
      </div>
    `).join('')}
  </div>`;
}

function bindToolEvents(){
  // unicode
  const uniIn=document.getElementById('uniIn');
  if(uniIn){
    const gen=()=>{
      const txt=uniIn.value;
      const styles={
        'Đậm': t=> t.replace(/[A-Za-z]/g, c=> String.fromCodePoint(c.charCodeAt(0)+(c<='Z'? 0x1D400-65 : 0x1D41A-97))),
        'Đậm nghiêng': t=> t.replace(/[A-Za-z]/g, c=> String.fromCodePoint(c.charCodeAt(0)+(c<='Z'? 0x1D468-65 : 0x1D482-97))),
        'Mono': t=> t.replace(/[A-Za-z]/g, c=> String.fromCodePoint(c.charCodeAt(0)+(c<='Z'? 0x1D670-65 : 0x1D68A-97))),
        'Viền': t=> t.split('').map(c=>c+'\u20DD').join('')
      };
      const out=document.getElementById('uniOut');
      out.innerHTML=Object.entries(styles).map(([name,fn])=>{ const v=fn(txt); return `<div style="display:flex;align-items:center;justify-content:space-between;border:1px solid #eee;padding:8px 10px;border-radius:8px"><span style="font-size:14px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1">${v||'...'}</span><button onclick="navigator.clipboard.writeText('${v.replace(/'/g,"\\'")}')" style="margin-left:8px;padding:4px 8px;border-radius:999px;background:#000;color:#fff;cursor:pointer;font-size:10px">Copy</button></div>`; }).join('');
    };
    uniIn.oninput=gen; gen();
  }
  bindExcelUnlock();
  // pdf
  const pdfDo=document.getElementById('pdfDo');
  if(pdfDo){
    pdfDo.onclick=async()=>{
      const files=document.getElementById('pdfFiles').files;
      const action=document.getElementById('pdfAction').value;
      const status=document.getElementById('pdfStatus');
      const out=document.getElementById('pdfOut');
      if(!files.length){ status.textContent='Chọn file PDF'; return; }
      status.textContent='Đang xử lý...';
      try{
        if(action==='merge' || action==='long'){
          const { PDFDocument } = PDFLib;
          const merged=await PDFDocument.create();
          for(let f of files){
            const bytes=await f.arrayBuffer();
            const doc=await PDFDocument.load(bytes);
            const pages=await merged.copyPages(doc, doc.getPageIndices());
            pages.forEach(p=>merged.addPage(p));
          }
          if(action==='long'){
            // ghép thành 1 trang dài: tính tổng chiều cao
            const { PDFDocument: PDFDoc2 } = PDFLib;
            const srcDoc = merged;
            const pages = srcDoc.getPages();
            const OVERLAP=10; // TU CHINH O DAY: con thay ke ho thi tang so nay (3,4...), bi de noi dung thi giam
            let totalH=0; let maxW=0;
            pages.forEach(p=>{ totalH+=p.getHeight(); maxW=Math.max(maxW,p.getWidth()); });
            totalH-=OVERLAP*(pages.length-1);
            const longDoc=await PDFDoc2.create();
            const longPage=longDoc.addPage([maxW, totalH]);
            let y=totalH;
            for(let p of pages){
              const [embedded] = await longDoc.embedPages([p]);
              y-=p.getHeight()-OVERLAP;
              longPage.drawPage(embedded, {x:0, y, width:p.getWidth(), height:p.getHeight()});
            }
            const bytes=await longDoc.save();
            downloadBytes(bytes, 'long-single-page.pdf');
            status.textContent='Đã tạo PDF dài không khoảng cách, cực nét';
          }else{
            const bytes=await merged.save();
            downloadBytes(bytes, 'merged.pdf');
            status.textContent='Đã ghép PDF';
          }
        }else if(action==='split'){
          const { PDFDocument } = PDFLib;
          for(let f of files){
            const bytes=await f.arrayBuffer();
            const doc=await PDFDocument.load(bytes);
            for(let i=0;i<doc.getPageCount();i++){
              const newDoc=await PDFDocument.create();
              const [page]=await newDoc.copyPages(doc,[i]);
              newDoc.addPage(page);
              const b=await newDoc.save();
              downloadBytes(b, `${f.name.replace('.pdf','')}-page-${i+1}.pdf`);
            }
          }
          status.textContent='Đã tách từng trang';
        }else if(action==='export'){
          // xuất ảnh 10k dpi ~ scale 10
          const pdfjsLib=window['pdfjs-dist/build/pdf']||window.pdfjsLib;
          pdfjsLib.GlobalWorkerOptions.workerSrc='https://cdnjs.cloudflare.com/ajax/libs/pdf.js/3.4.120/pdf.worker.min.js';
          for(let f of files){
            const bytes=await f.arrayBuffer();
            const doc=await pdfjsLib.getDocument({data:bytes}).promise;
            for(let i=1;i<=doc.numPages;i++){
              const page=await doc.getPage(i);
              const viewport=page.getViewport({scale:10}); // ~10k DPI approximation
              const canvas=document.createElement('canvas');
              canvas.width=viewport.width; canvas.height=viewport.height;
              await page.render({canvasContext:canvas.getContext('2d'), viewport}).promise;
              const url=canvas.toDataURL('image/png');
              const a=document.createElement('a'); a.href=url; a.download=`${f.name}-page-${i}-10k.png`; a.textContent=`Tải ${a.download}`; a.style.cssText='padding:6px 10px;border:1px solid #000;border-radius:999px;text-decoration:none;color:#000;margin:4px;display:inline-block'; out.appendChild(a);
            }
          }
          status.textContent='Đã xuất ảnh PNG nét 10x';
        }
      }catch(e){ status.textContent='Lỗi: '+e.message; console.error(e); }
    };
  }
}



// ===== IMPLEMENTATION EXCEL UNLOCK - HỖ TRỢ CẢ FILE MÃ HÓA =====
function bindExcelUnlock(){
  const drop = document.getElementById('unlockDrop');
  const fileInput = document.getElementById('unlockFile');
  const log = document.getElementById('unlockLog');
  const out = document.getElementById('unlockOut');
  if(!drop) return;
  drop.onclick = ()=> fileInput.click();
  drop.ondragover = (e)=>{ e.preventDefault(); drop.style.background='#f0f0f0'; };
  drop.ondragleave = ()=> drop.style.background='';
  drop.ondrop = async (e)=>{ e.preventDefault(); drop.style.background=''; if(e.dataTransfer.files.length) await handleUnlock(e.dataTransfer.files[0]); };
  fileInput.onchange = async ()=>{ if(fileInput.files[0]) await handleUnlock(fileInput.files[0]); };

  async function handleUnlock(file){
    const passInput = document.getElementById('unlockPass');
    const pwd = passInput ? passInput.value : '';
    log.textContent = 'Đang đọc ' + file.name + '... (thử ' + (pwd?'có pass':'không pass') + ')';
    out.innerHTML='';
    try{
      const ab = await file.arrayBuffer();
      
      // THỬ 1: File mã hóa? SheetJS có thể đọc nếu có pass
      let isEncrypted = false;
      try {
        // Kiểm tra header: file mã hóa Office thường không phải ZIP (PK)
        const header = new Uint8Array(ab.slice(0,4));
        // D0 CF là OLE, còn PK là zip
        if(header[0]===0xD0 && header[1]===0xCF) isEncrypted = true;
        // Thử đọc bằng SheetJS với pass
        if(isEncrypted || pwd){
          try {
            const wbEnc = XLSX.read(ab, {type:'array', password: pwd || undefined});
            // Nếu đọc được -> lưu lại không pass
            log.textContent = 'Đã mở file mã hóa thành công! Đang tạo file không pass...';
            const outBuf = XLSX.write(wbEnc, {type:'array', bookType:'xlsx'});
            const blob = new Blob([outBuf], {type:'application/octet-stream'});
            const url = URL.createObjectURL(blob);
            log.textContent = 'Đã mở file mã hóa và tạo file sạch!';
            out.innerHTML = `<a href="${url}" download="${file.name.replace(/\.\w+$/, '')}_da_giai_ma.xlsx" style="display:inline-block;padding:10px 16px;border-radius:999px;background:#000;color:#fff;text-decoration:none;font-weight:700">⬇ Tải file đã giải mã (không còn pass)</a>`;
            return;
          } catch(eEnc){
            if(isEncrypted){
              log.textContent = 'File bị mã hóa (AES-256). Lỗi: ' + eEnc.message + '\n-> Hãy nhập đúng mật khẩu vào ô trên rồi kéo lại file.';
              return;
            }
            // nếu không phải file mã hóa, tiếp tục thử unzip
          }
        }
      } catch(e){}

      // THỬ 2: File thường (zip) -> gỡ sheetProtection
      const zip = await JSZip.loadAsync(ab);
      let removed=0;
      let sheets=[];
      const chkSheet = document.getElementById('chkSheet').checked;
      const chkWb = document.getElementById('chkWb').checked;
      const chkRo = document.getElementById('chkRo').checked;

      for(let fname of Object.keys(zip.files)){
        if(fname.startsWith('xl/worksheets/sheet') && fname.endsWith('.xml') && chkSheet){
          let txt = await zip.files[fname].async('string');
          if(txt.includes('sheetProtection')){
            const orig = txt;
            txt = txt.replace(/<sheetProtection[^>]*\/?>(?:.*?<\/sheetProtection>)?/gs, '');
            txt = txt.replace(/<sheetProtection[^>]*\/>/g,'');
            if(txt!==orig){ zip.file(fname, txt); removed++; sheets.push(fname.split('/').pop()); }
          }
        }
        if(fname==='xl/workbook.xml'){
          let txt = await zip.files[fname].async('string');
          let orig = txt;
          if(chkWb) txt = txt.replace(/<workbookProtection[^>]*\/?>(?:.*?<\/workbookProtection>)?/gs,'').replace(/<workbookProtection[^>]*\/>/g,'');
          if(chkRo) txt = txt.replace(/<fileSharing[^>]*\/?>(?:.*?<\/fileSharing>)?/gs,'').replace(/<fileSharing[^>]*\/>/g,'');
          if(txt!==orig){ zip.file(fname, txt); removed++; }
        }
      }
      if(removed===0){ 
        // Thử mở bằng SheetJS để lưu lại bản sạch (xóa luôn pass sheet)
        try {
          const wb = XLSX.read(ab, {type:'array'});
          const outBuf = XLSX.write(wb, {type:'array', bookType:'xlsx'});
          const blob = new Blob([outBuf], {type:'application/octet-stream'});
          const url = URL.createObjectURL(blob);
          log.textContent='File không có thẻ khóa cũ, nhưng đã tạo bản lưu mới sạch (SheetJS rewrite sẽ bỏ sheet protection).';
          out.innerHTML = `<a href="${url}" download="${file.name.replace(/\.\w+$/, '')}_sach.xlsx" style="display:inline-block;padding:10px 16px;border-radius:999px;background:#000;color:#fff;text-decoration:none;font-weight:700">⬇ Tải bản sạch</a>`;
          return;
        } catch(e){}
        log.textContent='Không tìm thấy khóa nào (hoặc file đã sạch).'; return; 
      }
      const blob = await zip.generateAsync({type:'blob'});
      const url = URL.createObjectURL(blob);
      log.textContent = `Đã gỡ ${removed} khóa. Sheets: ${sheets.join(', ')||'workbook'}.`;
      out.innerHTML = `<a href="${url}" download="${file.name.replace(/\.xlsx?/, '')}_da_go_khoa.xlsx" style="display:inline-block;padding:10px 16px;border-radius:999px;background:#000;color:#fff;text-decoration:none;font-weight:700">⬇ Tải file đã gỡ khóa</a> <div style="margin-top:8px;font-size:10px;color:#888">File chạy offline, không upload</div>`;
    }catch(e){ 
      log.textContent='Lỗi: '+e.message+'\nNếu file yêu cầu mật khẩu mở file thì nhập pass vào ô trên rồi thử lại. Nếu không có pass thì không mở được (AES-256).'; 
      console.error(e); 
    }
  }
}

async function doExcelMerge(){
  const files = document.getElementById('mergeFiles').files;
  const mode = document.getElementById('mergeMode').value;
  const out = document.getElementById('mergeOut');
  const log = document.getElementById('mergeLog');
  if(!files.length){ log.textContent='Chọn file'; return; }
  log.textContent='Đang xử lý...';
  try{
    if(mode==='sheets' || mode==='oneSheet'){
      const wbOut = XLSX.utils.book_new();
      if(mode==='sheets'){
        for(let f of files){
          const ab = await f.arrayBuffer();
          const wb = XLSX.read(ab, {type:'array'});
          wb.SheetNames.forEach(sn=>{
            const ws = wb.Sheets[sn];
            const newName = (f.name.replace(/\.\w+$/,'')+'_'+sn).slice(0,31);
            XLSX.utils.book_append_sheet(wbOut, ws, newName);
          });
        }
      } else {
        let allRows=[];
        let headerDone=false;
        for(let f of files){
          const ab = await f.arrayBuffer();
          const wb = XLSX.read(ab, {type:'array'});
          const ws = wb.Sheets[wb.SheetNames[0]];
          const rows = XLSX.utils.sheet_to_json(ws, {header:1});
          if(rows.length){
            if(!headerDone){ allRows.push([...rows[0], 'Nguồn File']); headerDone=true; 
              for(let i=1;i<rows.length;i++) allRows.push([...rows[i], f.name]);
            } else {
              for(let i=1;i<rows.length;i++) allRows.push([...rows[i], f.name]);
            }
          }
        }
        const ws = XLSX.utils.aoa_to_sheet(allRows);
        XLSX.utils.book_append_sheet(wbOut, ws, 'Ghep');
      }
      const outBlob = XLSX.write(wbOut, {type:'array', bookType:'xlsx'});
      const url = URL.createObjectURL(new Blob([outBlob], {type:'application/octet-stream'}));
      out.innerHTML = `<a href="${url}" download="ghep_excel_${Date.now()}.xlsx" style="padding:8px 14px;border-radius:999px;background:#000;color:#fff;text-decoration:none">Tải file ghép</a>`;
      log.textContent='Đã ghép xong '+files.length+' file';
    } else if(mode==='splitSheet'){
      const f = files[0];
      const ab = await f.arrayBuffer();
      const wb = XLSX.read(ab, {type:'array'});
      out.innerHTML='';
      for(let sn of wb.SheetNames){
        const wb2 = XLSX.utils.book_new();
        XLSX.utils.book_append_sheet(wb2, wb.Sheets[sn], sn);
        const b = XLSX.write(wb2, {type:'array', bookType:'xlsx'});
        const url = URL.createObjectURL(new Blob([b], {type:'application/octet-stream'}));
        const a = document.createElement('a'); a.href=url; a.download=`${sn}.xlsx`; a.textContent=`Tải ${sn}.xlsx`; a.style.cssText='padding:6px 10px;border:1px solid #000;border-radius:999px;margin:4px;display:inline-block;text-decoration:none;color:#000'; out.appendChild(a);
      }
      log.textContent='Đã tách '+wb.SheetNames.length+' sheet';
    } else if(mode==='splitRow'){
      const n = parseInt(document.getElementById('splitRowNum').value)||1000;
      const f = files[0];
      const ab = await f.arrayBuffer();
      const wb = XLSX.read(ab, {type:'array'});
      const ws = wb.Sheets[wb.SheetNames[0]];
      const rows = XLSX.utils.sheet_to_json(ws, {header:1});

async function doExcelClean(){
  const file = document.getElementById('cleanFile').files[0];
  const log = document.getElementById('cleanLog');
  if(!file){ log.textContent='Chọn file'; return; }
  log.textContent='Đang làm sạch...';
  try{
    const ab = await file.arrayBuffer();
    const wb = XLSX.read(ab, {type:'array'});
    wb.SheetNames.forEach(sheetName=>{
      const ws = wb.Sheets[sheetName];
      let rows = XLSX.utils.sheet_to_json(ws, {header:1, defval:''});
      // trim
      if(document.getElementById('clTrim').checked){
        rows = rows.map(r=> r.map(c=> typeof c==='string'? c.trim().replace(/\s+/g,' ') : c));
      }
      // case
      const caseMode = document.getElementById('clCase').value;
      if(caseMode!=='none'){
        rows = rows.map(r=> r.map(c=>{
          if(typeof c!=='string') return c;
          if(caseMode==='upper') return c.toUpperCase();
          if(caseMode==='lower') return c.toLowerCase();
          if(caseMode==='title') return c.replace(/\w\S*/g, w=>w[0].toUpperCase()+w.slice(1).toLowerCase());
          return c;
        }));
      }
      // remove empty rows
      if(document.getElementById('clEmptyRow').checked){
        rows = rows.filter(r=> r.some(cell=> String(cell).trim()!==''));
      }
      // remove empty cols
      if(document.getElementById('clEmptyCol').checked && rows.length){
        const colCount = Math.max(...rows.map(r=>r.length));
        const keepCols=[];
        for(let c=0;c<colCount;c++){
          const hasData = rows.some(r=> String(r[c]||'').trim()!=='');
          if(hasData) keepCols.push(c);
        }
        rows = rows.map(r=> keepCols.map(ci=> r[ci]||''));
      }
      // dedup
      if(document.getElementById('clDup').checked){
        const seen=new Set();
        const uniq=[];
        for(let r of rows){
          const key=JSON.stringify(r);
          if(!seen.has(key)){ seen.add(key); uniq.push(r); }
        }
        rows=uniq;
      }
      wb.Sheets[sheetName] = XLSX.utils.aoa_to_sheet(rows);
    });
    const out = XLSX.write(wb, {type:'array', bookType:'xlsx'});
    const url = URL.createObjectURL(new Blob([out], {type:'application/octet-stream'}));
    log.innerHTML = `Đã làm sạch xong. <a href="${url}" download="${file.name.replace(/\.\w+$/,'')}_sach.xlsx" style="padding:6px 10px;border-radius:999px;background:#000;color:#fff;text-decoration:none">Tải file sạch</a>`;
  }catch(e){ log.textContent='Lỗi: '+e.message; }
}

async function doExcelCompare(){
  const fa = document.getElementById('cmpA').files[0];
  const fb = document.getElementById('cmpB').files[0];
  const log = document.getElementById('cmpLog');
  const out = document.getElementById('cmpOut');
  if(!fa||!fb){ log.textContent='Chọn 2 file'; return; }
  try{
    const abA = await fa.arrayBuffer(); const abB = await fb.arrayBuffer();
    const wbA = XLSX.read(abA, {type:'array'}); const wbB = XLSX.read(abB, {type:'array'});
    const wsA = wbA.Sheets[wbA.SheetNames[0]]; const wsB = wbB.Sheets[wbB.SheetNames[0]];
    const rowsA = XLSX.utils.sheet_to_json(wsA, {header:1}); const rowsB = XLSX.utils.sheet_to_json(wsB, {header:1});
    let diffCount=0;
    let maxR = Math.max(rowsA.length, rowsB.length);
    let maxC = Math.max(...rowsA.map(r=>r.length), ...rowsB.map(r=>r.length));
    let html='<table style="border-collapse:collapse;font-size:11px"><tr><th style="border:1px solid #ccc;padding:4px">#</th>';
    for(let c=0;c<maxC;c++) html+=`<th style="border:1px solid #ccc;padding:4px">C${c+1}</th>`;
    html+='</tr>';
    for(let r=0;r<maxR;r++){
      html+='<tr>';
      html+=`<td style="border:1px solid #eee;padding:4px;background:#f6f6f6">${r+1}</td>`;
      for(let c=0;c<maxC;c++){
        const va = rowsA[r]?.[c]??''; const vb = rowsB[r]?.[c]??'';
        const same = String(va)===String(vb);
        if(!same) diffCount++;
        html+=`<td style="border:1px solid #eee;padding:4px;${same?'':'background:#ffcccc;font-weight:700'}" title="A:${va} | B:${vb}">${same?va:`${va} → ${vb}`}</td>`;
      }
      html+='</tr>';
    }
    html+='</table>';
    log.textContent=`Khác nhau ${diffCount} ô / tổng ${(maxR*maxC)} ô`;
    out.innerHTML=html;
    // tạo file diff
    const diffRows=[['Dòng','Cột','Giá trị A','Giá trị B']];
    for(let r=0;r<maxR;r++) for(let c=0;c<maxC;c++) if(String(rowsA[r]?.[c]??'')!==String(rowsB[r]?.[c]??'')) diffRows.push([r+1,c+1,rowsA[r]?.[c]??'',rowsB[r]?.[c]??'']);
    const wbDiff = XLSX.utils.book_new(); const wsDiff = XLSX.utils.aoa_to_sheet(diffRows); XLSX.utils.book_append_sheet(wbDiff, wsDiff, 'Diff');
    const b = XLSX.write(wbDiff, {type:'array', bookType:'xlsx'}); const url = URL.createObjectURL(new Blob([b], {type:'application/octet-stream'}));
    log.innerHTML+=` <a href="${url}" download="diff.xlsx" style="padding:4px 8px;border-radius:999px;background:#000;color:#fff;text-decoration:none;margin-left:8px">Tải file diff</a>`;
  }catch(e){ log.textContent='Lỗi: '+e.message; }
}

function bgResizeDo(){
  const files=document.getElementById('bgFiles').files;

  const ratio=document.getElementById('bgRatio').value;
  const [rw,rh]=ratio.split(':').map(Number);
  const out=document.getElementById('bgOut'); out.innerHTML='';
  for(let f of files){
    const img=new Image(); img.onload=()=>{
      let w=img.width, h=img.height;
      let targetW=w, targetH=h;
      if(rw/rh > w/h){ targetW = h*rw/rh; }else{ targetH = w*rh/rw; }
      const c=document.createElement('canvas'); c.width=targetW; c.height=targetH;
      const ctx=c.getContext('2d'); ctx.fillStyle=color; ctx.fillRect(0,0,targetW,targetH);
      ctx.drawImage(img, (targetW-w)/2, (targetH-h)/2, w, h);
      c.toBlob(blob=>{ const url=URL.createObjectURL(blob); const a=document.createElement('a'); a.href=url; a.download=f.name; a.innerHTML=`<img src="${url}" style="width:100px;height:100px;object-fit:cover;border-radius:8px"><br>${a.download}`; a.style.textAlign='center'; out.appendChild(a); }, 'image/png');

  let out='';
  if(type==='upper') out=inp.toUpperCase();
  if(type==='lower') out=inp.toLowerCase();
  if(type==='title') out=inp.replace(/\\w\\S*/g, w=>w.charAt(0).toUpperCase()+w.substr(1).toLowerCase());
  if(type==='sentence') out=inp.toLowerCase().replace(/(^\\s*\\w|[.!?]\\s*\\w)/g, c=>c.toUpperCase());
  document.getElementById('caseOut').value=out;
}
function calcAge(){
  const dob=new Date(document.getElementById('ageDob').value);
  const now=new Date();
  let age=now.getFullYear()-dob.getFullYear();
  const m=now.getMonth()-dob.getMonth();
  if(m<0 || (m===0 && now.getDate()<dob.getDate())) age--;
  const days=Math.floor((now-dob)/(1000*60*60*24));
  document.getElementById('ageOut').textContent=`${age} tuổi • ${days} ngày • ${Math.floor(days/30)} tháng`;
}
function showCal(){
  const d=new Date(document.getElementById('calDate').value);
  if(isNaN(d)) return;
  const lunar=convertSolarToLunar(d.getDate(), d.getMonth()+1, d.getFullYear());
  document.getElementById('calOut').innerHTML=`<div style="border:1px solid #eee;padding:12px;border-radius:10px"><b>Dương:</b> ${d.toLocaleDateString('vi-VN')}<br><b>Âm:</b> ${lunar.day}/${lunar.month}/${lunar.year} ${lunar.leap?'nhuận':''}<br><b>Can Chi:</b> ${lunar.canChi}</div>`;
}
// simple lunar - using known algorithm (Ho Ngoc Duc)
function convertSolarToLunar(dd,mm,yy){
  // simplified - returns approx, for demo use library https://github.com/toanlk/lich-am - we embed basic
  // For brevity, use fixed approx: use jd conversion
  const jd = Math.floor((1461*(yy+4800+Math.floor((mm-14)/12)))/4)+Math.floor((367*(mm-2-12*Math.floor((mm-14)/12)))/12)-Math.floor((3*Math.floor((yy+4900+Math.floor((mm-14)/12))/100))/4)+dd-32075;
  // approximate lunar - not perfect but shows
  const k = Math.floor((jd-2415021)/29.530588853);
  return {day: (jd%30)+1, month: ((k%12)+1), year: yy, leap:false, canChi:'Giáp Thìn (approx)'};
}
function genSig(){
  const name=document.getElementById('sigName').value;
  const title=document.getElementById('sigTitle').value;
  const phone=document.getElementById('sigPhone').value;
  document.getElementById('sigOut').innerHTML=`<div style="font-family:sans-serif;border-top:3px solid #000;padding-top:8px"><b>${name}</b><br><span style="color:#666">${title}</span><br>📞 ${phone}<br><span style="font-size:10px;color:#888">LEHA.OS</span></div><button onclick="navigator.clipboard.writeText(document.getElementById('sigOut').innerHTML)" style="margin-top:8px;padding:6px 10px;border-radius:999px;background:#000;color:#fff;cursor:pointer">Copy HTML</button>`;
}
function genQR(){
  const txt=document.getElementById('qrText').value;
  const out=document.getElementById('qrOut'); out.innerHTML='';
  if(!txt) return;
  new QRCode(out, {text:txt, width:200, height:200});
}
function doFindReplace(){
  const txt=document.getElementById('frIn').value;
  const find=document.getElementById('frFind').value;
  const rep=document.getElementById('frRep').value;
  document.getElementById('frOut').value=txt.split(find).join(rep);
}
function convertUnit(){
  const v=parseFloat(document.getElementById('unitVal').value);
  const t=document.getElementById('unitType').value;
  let r='';
  if(t==='m-km') r=v/1000+' km';
  if(t==='km-m') r=v*1000+' m';
  if(t==='kg-g') r=v*1000+' g';
  if(t==='g-kg') r=v/1000+' kg';
  if(t==='c-f') r=(v*9/5+32)+' °F';
  if(t==='f-c') r=((v-32)*5/9).toFixed(2)+' °C';
  document.getElementById('unitOut').textContent=r;
}
function countWords(){
  const txt=document.getElementById('wcIn').value;
  const chars=txt.length;
  const words=txt.trim()?txt.trim().split(/\\s+/).length:0;
  const lines=txt.split('\\n').length;
  document.getElementById('wcOut').innerHTML=`<span style="border:1px solid #eee;padding:6px 10px;border-radius:999px">${chars} ký tự</span><span style="border:1px solid #eee;padding:6px 10px;border-radius:999px">${words} từ</span><span style="border:1px solid #eee;padding:6px 10px;border-radius:999px">${lines} dòng</span>`;
}
function shorten(){
  const url=document.getElementById('shortIn').value;
  if(!url) return;
  const hash=btoa(url).replace(/[^a-zA-Z0-9]/g,'').slice(0,6);
  const short='leha.os/'+hash;
  document.getElementById('shortOut').innerHTML=`<div style="border:1px solid #eee;padding:10px;border-radius:10px;display:flex;justify-content:space-between;align-items:center"><span>${short}</span><button onclick="navigator.clipboard.writeText('${short}')" style="padding:6px 10px;border-radius:999px;background:#000;color:#fff;cursor:pointer">Copy</button></div><div style="font-size:10px;color:#888;margin-top:4px">Gốc: ${url}</div>`;
}

renderApp();
setInterval(()=>{ const el=document.querySelector('[style*="border-radius:999px"][style*="background"]'); },1000);
