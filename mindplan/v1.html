<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>LEHA Notes</title>
<style>
*{box-sizing:border-box;margin:0;padding:0}
:root{
  --radius:6px;
  --bg:#f4f6f9; --panel:#ffffff; --ink:#0f172a; --mut:#64748b; --line:#e2e8f0;
  --pri:#1d4ed8; --pri-ink:#ffffff; --acc:#b45309;
  --sb-bg:#1c2536; --sb-ink:#cbd5e1; --sb-dim:#7d8aa0; --sb-act:rgba(255,255,255,.09); --sb-line:rgba(255,255,255,.07);
  --chip:#eef2f7; --danger:#b91c1c; --ok:#15803d;
  --link:#2563eb; --pill:#e9edf2;
  --shadow:0 1px 2px rgba(15,23,42,.08);
}
[data-theme="dark"]{
  --bg:#0f172a; --panel:#1e293b; --ink:#e2e8f0; --mut:#94a3b8; --line:#334155;
  --pri:#3b82f6; --chip:#273449; --sb-bg:#0b1220;
  --link:#7aa5f8; --pill:#22304a;
  --shadow:0 1px 2px rgba(0,0,0,.4);
}
[data-theme="night"]{
  --bg:#101c2e; --panel:#16263d; --ink:#dbe7f5; --mut:#8aa0bd; --line:#27405f;
  --pri:#4f8fd0; --chip:#1d3350; --sb-bg:#0a1524;
  --link:#7fb3e8; --pill:#1d3350;
}
[data-theme="mono"]{
  --bg:#f5f5f5; --panel:#ffffff; --ink:#111111; --mut:#666666; --line:#d4d4d4;
  --pri:#111111; --chip:#eeeeee; --sb-bg:#1a1a1a; --sb-ink:#d4d4d4; --acc:#555555;
  --link:#111111; --pill:#e4e4e4;
}
[data-theme="sand"]{
  --bg:#f7f3ea; --panel:#fffdf7; --ink:#3d3225; --mut:#8a7a63; --line:#e7ddc9;
  --pri:#92610f; --chip:#f1e9d6; --sb-bg:#2b2419; --sb-ink:#d8cbb2; --acc:#92610f;
  --link:#92610f; --pill:#ece2cb;
}
html,body{height:100%}
body{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;background:var(--bg);color:var(--ink);font-size:15px;line-height:1.5;overflow:hidden}
/* ===== layout ===== */
#app{display:flex;height:100dvh}
/* sidebar */
#sidebar{width:280px;flex:none;background:var(--sb-bg);color:var(--sb-ink);display:flex;flex-direction:column;z-index:60}
.sb-head{padding:14px 14px 10px;display:flex;align-items:center;gap:8px;border-bottom:1px solid var(--sb-line)}
.sb-logo{font-weight:800;font-size:16px;color:#fff;letter-spacing:.3px}
.sb-logo small{font-weight:600;color:var(--sb-dim);font-size:11px}
.sb-search{padding:10px 12px;border-bottom:1px solid var(--sb-line)}
.sb-search input{width:100%;background:rgba(255,255,255,.07);border:1px solid var(--sb-line);border-radius:var(--radius);color:#fff;padding:8px 10px;font-size:14px;outline:none}
.sb-search input::placeholder{color:var(--sb-dim)}
.sb-search input:focus{border-color:var(--pri)}
#treeWrap{flex:1;overflow-y:auto;padding:8px 6px}
.sb-sec-t{font-size:11px;font-weight:700;color:var(--sb-dim);text-transform:uppercase;letter-spacing:.6px;padding:10px 10px 4px;display:flex;justify-content:space-between;align-items:center}
.sb-sec-t button{background:none;border:0;color:var(--sb-dim);font-size:16px;cursor:pointer;padding:2px 8px;border-radius:4px;line-height:1}
.sb-sec-t button:hover{color:#fff;background:var(--sb-act)}
.frow{display:flex;align-items:center;gap:4px;padding:7px 8px;border-radius:8px;cursor:pointer;font-size:14px;user-select:none}
.frow:hover{background:var(--sb-act)}
.frow.on{background:var(--sb-act);box-shadow:inset 2px 0 0 var(--pri)}
.fcaret{width:16px;flex:none;text-align:center;color:var(--sb-dim);font-size:9px;cursor:pointer}
.ficon{width:20px;flex:none;text-align:center;font-size:13px}
.fname{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-transform:uppercase;font-weight:600;font-size:13px;letter-spacing:.4px}
.fcount{font-size:11px;color:var(--sb-dim);background:rgba(255,255,255,.06);border-radius:8px;padding:0 7px}
.fmenu-btn{background:none;border:0;color:var(--sb-dim);cursor:pointer;font-size:14px;padding:2px 6px;border-radius:4px;opacity:0}
.frow:hover .fmenu-btn{opacity:1}
.fmenu-btn:hover{color:#fff;background:rgba(255,255,255,.12)}
.fkids{margin-left:14px;border-left:1px solid var(--sb-line);padding-left:4px}
.frow.drop{outline:2px dashed var(--pri);outline-offset:-2px}
.sb-foot{border-top:1px solid var(--sb-line);padding:8px;display:flex;gap:6px;align-items:center}
.sb-foot select{flex:1;background:rgba(255,255,255,.07);color:var(--sb-ink);border:1px solid var(--sb-line);border-radius:var(--radius);padding:7px 8px;font-size:13px}
.sb-foot button{background:rgba(255,255,255,.07);border:1px solid var(--sb-line);color:var(--sb-ink);border-radius:var(--radius);padding:7px 10px;font-size:13px;cursor:pointer}
/* main */
#main{flex:1;display:flex;min-width:0}
/* note list */
#notelist{width:320px;flex:none;background:var(--panel);border-right:1px solid var(--line);display:flex;flex-direction:column;min-width:0}
.nl-head{padding:12px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:8px}
.nl-head h2{font-size:15px;font-weight:700;flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.btn{background:var(--chip);border:1px solid var(--line);color:var(--ink);border-radius:var(--radius);padding:7px 12px;font-size:13.5px;cursor:pointer;font-family:inherit;box-shadow:var(--shadow)}
.btn:hover{filter:brightness(.97)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:var(--pri-ink)}
.btn.danger{color:var(--danger);border-color:#f3c2c2;background:#fef2f2}
.btn.sm{padding:5px 9px;font-size:12.5px}
#tagbar{display:flex;gap:6px;flex-wrap:wrap;padding:8px 12px;border-bottom:1px solid var(--line);max-height:86px;overflow-y:auto}
#tagbar:empty{display:none}
.tagchip{font-size:12px;background:var(--chip);border:1px solid var(--line);border-radius:10px;padding:2px 9px;cursor:pointer;color:var(--mut)}
.tagchip.on{background:var(--pri);color:#fff;border-color:var(--pri)}
#notes{flex:1;overflow-y:auto;padding:8px}
.nrow{padding:9px 10px;border-radius:var(--radius);cursor:pointer;border:1px solid transparent;margin-bottom:4px}
.nrow:hover{background:var(--chip)}
.nrow.on{background:var(--pill);border-color:transparent;border-radius:10px}
.nrow .t{font-weight:500;font-size:14.5px;color:var(--link);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:flex;gap:6px;align-items:center}
.nrow .s{font-size:12.5px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;margin-top:2px}
.nrow .m{font-size:11.5px;color:var(--mut);margin-top:4px;display:flex;gap:8px;align-items:center}
.pinflag{color:var(--acc);font-size:12px}
.nempty{text-align:center;color:var(--mut);padding:40px 16px;font-size:14px}
/* breadcrumb */
#crumb{padding:10px 18px 0;font-size:12.5px;color:var(--mut);display:flex;gap:6px;flex-wrap:wrap;align-items:center}
#crumb:empty{display:none}
#crumb a{color:var(--mut);cursor:pointer}#crumb a:hover{color:var(--link)}
#crumb b{color:var(--ink);font-weight:600}
/* fold heading caret */
.hfc{cursor:pointer;color:var(--mut);font-size:.75em;margin-right:8px;user-select:none}
.hfc:hover{color:var(--link)}
/* wikilink */
a.wl{color:var(--link);text-decoration:none;border-bottom:1px dotted var(--link);cursor:pointer}
/* indent guides */
#edBody ul ul,#edBody ol ol{border-left:2px solid var(--line);padding-left:14px;margin-left:4px}
/* graph */
#graphSec{display:none;flex:1;flex-direction:column;min-width:0;background:var(--panel)}
#graphSec.show{display:flex}
#gBar{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;align-items:center;gap:10px}
#gBar b{font-size:15px;flex:1}#gBar span{font-size:12px;color:var(--mut)}
#gCanvas{flex:1;touch-action:none;cursor:pointer}
/* settings ios-style */
.set-t{font-size:13px;font-weight:600;color:var(--mut);margin:14px 2px 6px}
.setcard{background:var(--panel);border:1px solid var(--line);border-radius:14px;overflow:hidden;margin-bottom:4px}
.setrow{display:flex;align-items:center;gap:12px;padding:13px 14px;cursor:pointer;font-size:15px}
.setrow+.setrow{border-top:1px solid var(--line)}
.setrow .si{width:26px;text-align:center;font-size:16px;color:var(--mut);flex:none}
.setrow .chev{margin-left:auto;color:#b6bdc9;font-size:15px}
.setsearch{margin-bottom:2px}
.setsearch input{width:100%;border:1px solid var(--line);background:var(--chip);border-radius:12px;padding:10px 14px;font-size:14px;font-family:inherit;color:var(--ink);outline:none}
/* editor */
#editor{flex:1;display:flex;flex-direction:column;min-width:0;background:var(--panel)}
.ed-head{padding:10px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center}
#backBtn{display:none}
#noteTitle{flex:1;border:0;outline:none;font-size:17px;font-weight:700;font-family:inherit;background:transparent;color:var(--ink);min-width:0}
.ed-tools{display:flex;gap:4px;align-items:center}
.icobtn{background:none;border:1px solid transparent;border-radius:var(--radius);cursor:pointer;font-size:13px;color:var(--mut);padding:6px 9px;font-family:inherit;white-space:nowrap}
.icobtn:hover{background:var(--chip);color:var(--ink)}
.icobtn.on{background:var(--chip);color:var(--pri);border-color:var(--line)}
#tagInputRow{padding:8px 14px;border-bottom:1px solid var(--line);display:flex;gap:8px;align-items:center;font-size:13px;color:var(--mut)}
#tagInput{flex:1;border:0;outline:none;background:transparent;color:var(--ink);font-size:13.5px;font-family:inherit}
/* editor toolbar */
#toolbar{display:flex;gap:2px;align-items:center;padding:7px 10px;border-bottom:1px solid var(--line);overflow-x:auto;flex:none;scrollbar-width:none}
#toolbar::-webkit-scrollbar{display:none}
#toolbar .icobtn{flex:none;font-size:13.5px;padding:6px 8px;min-width:32px;text-align:center}
#toolbar select{flex:none;border:1px solid var(--line);border-radius:var(--radius);padding:5px 6px;font-size:13px;background:var(--panel);color:var(--ink)}
.tsep{width:1px;height:20px;background:var(--line);flex:none;margin:0 3px}
#edBody{flex:1;overflow-y:auto;padding:16px 18px;outline:none}
#edBody:empty:before{content:"Bắt đầu viết...";color:var(--mut)}
#mdSrc{flex:1;border:0;outline:none;resize:none;padding:16px 18px;font-family:ui-monospace,Menlo,Consolas,monospace;font-size:14px;line-height:1.6;background:var(--panel);color:var(--ink);display:none}
/* rendered note styles */
#edBody h1,#edBody h2,#edBody h3{margin:14px 0 8px;line-height:1.35}
#edBody h1{font-size:21px}#edBody h2{font-size:18px}#edBody h3{font-size:16px}
#edBody p{margin:8px 0}
#edBody ul,#edBody ol{margin:8px 0 8px 22px}
#edBody a{color:var(--pri)}
#edBody table{border-collapse:collapse;margin:10px 0;width:100%;font-size:14px}
#edBody table th,#edBody table td{border:1px solid var(--line);padding:6px 9px;text-align:left}
#edBody table th{background:var(--chip)}
#edBody blockquote{border-left:3px solid var(--pri);margin:10px 0;padding:4px 12px;color:var(--mut)}
#edBody pre{background:#0f172a;color:#e2e8f0;border-radius:var(--radius);padding:10px 12px;overflow-x:auto;font-size:13px;margin:10px 0}
#edBody code{font-family:ui-monospace,Menlo,Consolas,monospace}
#edBody p code,#edBody li code{background:var(--chip);border-radius:4px;padding:1px 5px;font-size:13px}
.codewrap{border:1px solid var(--line);border-radius:var(--radius);margin:10px 0;overflow:hidden}
.codehead{display:flex;align-items:center;gap:8px;background:var(--chip);padding:5px 8px 5px 12px;font-size:12px;font-weight:700;color:var(--mut)}
.codehead .sp{flex:1}
.codehead button{border:1px solid var(--line);background:var(--panel);border-radius:4px;font-size:11.5px;padding:3px 9px;cursor:pointer;color:var(--ink)}
.codewrap pre{margin:0!important;border-radius:0!important}
.codewrap.closed pre{display:none}
#edBody details.mdfolder{border:1px solid var(--line);border-radius:var(--radius);margin:10px 0;overflow:hidden}
#edBody details.mdfolder summary{cursor:pointer;padding:8px 12px;font-weight:700;background:var(--chip);font-size:14px;list-style:none}
#edBody details.mdfolder .fbody{padding:8px 12px}
/* gallery */
#galSec{border-top:1px solid var(--line);padding:10px 14px;flex:none;max-height:230px;overflow-y:auto}
#galSec .gt{font-size:12px;font-weight:700;color:var(--mut);margin-bottom:8px;display:flex;justify-content:space-between;align-items:center}
#galGrid{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px}
.gitem{position:relative;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden;background:var(--chip);cursor:pointer;aspect-ratio:1}
.gitem img,.gitem video{width:100%;height:100%;object-fit:cover;display:block}
.gitem .gdoc{height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--mut);padding:6px;text-align:center}
.gitem .gdoc .gi{font-size:22px}
.gitem .gx{position:absolute;top:2px;right:2px;width:22px;height:22px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:13px;cursor:pointer;line-height:1}
.gitem .gau{position:absolute;bottom:0;left:0;right:0;background:rgba(0,0,0,.55);color:#fff;font-size:10px;padding:2px 6px;display:flex;justify-content:space-between}
.gitem.dragov{outline:2px dashed var(--pri)}
#galSec:empty{display:none}
/* lightbox */
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:200;display:none;align-items:center;justify-content:center;flex-direction:column;gap:10px;padding:16px}
#lb.open{display:flex}
#lbMedia{max-width:94vw;max-height:80vh;border-radius:8px}
#lbBar{display:flex;gap:8px;align-items:center;color:#fff;font-size:14px}
#lbBar button{background:rgba(255,255,255,.15);border:0;color:#fff;border-radius:6px;padding:8px 14px;font-size:15px;cursor:pointer}
/* modal */
#modal{position:fixed;inset:0;background:rgba(15,23,42,.5);z-index:150;display:none;align-items:center;justify-content:center;padding:16px}
#modal.open{display:flex}
.mbox{background:var(--panel);border-radius:8px;max-width:440px;width:100%;max-height:84dvh;overflow-y:auto;box-shadow:0 12px 40px rgba(0,0,0,.25)}
.mbox .mh{padding:13px 16px;border-bottom:1px solid var(--line);font-weight:700;font-size:15px;display:flex;justify-content:space-between;align-items:center}
.mbox .mb{padding:14px 16px}
.mbox .mf{padding:12px 16px;border-top:1px solid var(--line);display:flex;justify-content:flex-end;gap:8px}
.mbox input[type=text],.mbox textarea,.mbox select{width:100%;border:1px solid var(--line);border-radius:var(--radius);padding:8px 10px;font-size:14px;font-family:inherit;background:var(--panel);color:var(--ink);outline:none;margin-bottom:8px}
.mbox label{font-size:13px;color:var(--mut);display:block;margin-bottom:4px}
.tmpl{display:block;width:100%;text-align:left;background:var(--chip);border:1px solid var(--line);border-radius:var(--radius);padding:10px 12px;margin-bottom:8px;cursor:pointer;font-family:inherit;color:var(--ink)}
.tmpl b{display:block;font-size:14px}
.tmpl span{font-size:12.5px;color:var(--mut)}
.ctxmenu{position:fixed;z-index:300;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:0 8px 24px rgba(0,0,0,.18);padding:5px;min-width:180px}
.ctxmenu button{display:block;width:100%;text-align:left;background:none;border:0;padding:8px 10px;font-size:13.5px;border-radius:4px;cursor:pointer;color:var(--ink);font-family:inherit}
.ctxmenu button:hover{background:var(--chip)}
.ctxmenu button.danger{color:var(--danger)}
#scrim{position:fixed;inset:0;background:rgba(0,0,0,.45);z-index:55;display:none}
#scrim.open{display:block}
#toast{position:fixed;bottom:22px;left:50%;transform:translateX(-50%) translateY(20px);background:#1e293b;color:#fff;padding:9px 18px;border-radius:8px;font-size:13.5px;opacity:0;transition:all .25s;z-index:400;pointer-events:none}
#toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
.hamb{display:none;background:none;border:0;font-size:20px;cursor:pointer;color:var(--ink);padding:4px 8px}
/* mobile */
@media(max-width:900px){
  #sidebar{position:fixed;top:0;left:0;bottom:0;transform:translateX(-105%);transition:transform .22s ease;box-shadow:8px 0 24px rgba(0,0,0,.2)}
  #sidebar.open{transform:none}
  .hamb{display:block}
  #notelist{width:100%;border-right:0}
  #notelist.hide{display:none}
  #editor{display:none;width:100%}
  #editor.show{display:flex}
  #backBtn{display:block}
  .ed-head{padding:8px 10px}
  #toolbar{position:sticky;top:0;background:var(--panel);z-index:5}
}
</style>
</head>
<body>
<div id="app">
  <!-- ===== SIDEBAR ===== -->
  <aside id="sidebar">
    <div class="sb-head">
      <div class="sb-logo">LEHA <small>Notes</small></div>
    </div>
    <div class="sb-search"><input id="q" type="search" placeholder="Tìm kiếm note..." autocomplete="off"></div>
    <div id="treeWrap">
      <div class="sb-sec-t"><span>Thư mục</span><button id="btnNewFolder" title="Tạo thư mục">+</button></div>
      <div id="vtree"></div>
      <div id="ftree"></div>
      <div class="sb-sec-t"><span>Thẻ</span></div>
      <div id="taglist" style="padding:2px 8px;display:flex;flex-wrap:wrap;gap:6px"></div>
    </div>
    <div class="sb-foot">
      <button id="btnSettings" title="Cài đặt" style="width:100%">&#9881; Cài đặt</button>
      <input type="file" id="importFile" accept=".json" hidden>
    </div>
  </aside>
  <div id="scrim"></div>

  <!-- ===== MAIN ===== -->
  <div id="main">
    <section id="notelist">
      <div class="nl-head">
        <button class="hamb" id="hamb1">☰</button>
        <h2 id="nlTitle">Tất cả</h2>
        <button class="btn pri sm" id="btnNewNote">+ Note</button>
      </div>
      <div id="tagbar"></div>
      <div id="notes"></div>
    </section>

    <section id="editor">
      <div id="crumb"></div>
      <div class="ed-head">
        <button class="hamb" id="backBtn" title="Về danh sách">‹</button>
        <button class="hamb" id="hamb2" title="Menu">☰</button>
        <input id="noteTitle" placeholder="Tiêu đề note..." autocomplete="off">
        <div class="ed-tools">
          <button class="icobtn" id="btnPin" title="Ghim">Ghim</button>
          <button class="icobtn" id="btnAttach" title="Đính kèm">Đính kèm</button>
          <button class="icobtn" id="btnMore" title="Thêm">⋯</button>
        </div>
      </div>
      <div id="tagInputRow"><span style="flex:none">Thẻ:</span><input id="tagInput" placeholder="công việc, ý tưởng (cách nhau dấu phẩy)"></div>
      <div id="toolbar">
        <button class="icobtn" id="mMd" title="Chế độ Markdown">MD</button>
        <button class="icobtn on" id="mWy" title="Soạn thảo trực quan">Aa</button>
        <span class="tsep"></span>
        <button class="icobtn" data-c="bold" title="Đậm"><b>B</b></button>
        <button class="icobtn" data-c="italic" title="Nghiêng"><i>I</i></button>
        <select id="hSel" title="Tiêu đề">
          <option value="">Thường</option><option value="h1">Tiêu đề 1</option>
          <option value="h2">Tiêu đề 2</option><option value="h3">Tiêu đề 3</option>
        </select>
        <input type="color" id="colorPick" title="Màu chữ" value="#b45309" style="width:30px;height:30px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--panel)">
        <span class="tsep"></span>
        <button class="icobtn" data-c="justifyLeft" title="Căn trái">≡</button>
        <button class="icobtn" data-c="justifyCenter" title="Căn giữa">≣</button>
        <button class="icobtn" data-c="justifyRight" title="Căn phải">≡</button>
        <span class="tsep"></span>
        <button class="icobtn" id="tCode" title="Khung code">‹›</button>
        <button class="icobtn" id="tTable" title="Chèn bảng">Bảng</button>
        <button class="icobtn" id="tFold" title="Mục gập">Gập</button>
        <button class="icobtn" id="tLink" title="Chèn link">Link</button>
        <button class="icobtn" id="tHtml" title="Nhúng HTML">HTML</button>
        <button class="icobtn" id="tImg" title="Chèn ảnh">Ảnh</button>
        <button class="icobtn" id="tImgIn" title="Chèn ảnh vào bài viết">Ảnh+</button>
        <button class="icobtn" id="tWl" title="Liên kết tới note [[...]]">[[ ]]</button>
        <input type="color" id="hlPick" title="Bôi màu highlight" value="#fef08a" style="width:30px;height:30px;border:1px solid var(--line);border-radius:6px;padding:2px;background:var(--panel)">

    </section>

      <div id="gBar"><button class="hamb" id="gBack" title="Về danh sách" style="display:block">‹</button><b>Xem biểu đồ</b><span id="gCount"></span></div>

<div id="toast"></div>

<script>
"use strict";
/* ================= UTILS ================= */
const $=s=>document.querySelector(s), $$=s=>Array.from(document.querySelectorAll(s));
const uid=()=>'x'+Date.now().toString(36)+Math.random().toString(36).slice(2,8);
const esc=s=>String(s==null?'':s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
const debounce=(f,ms)=>{let t;return(...a)=>{clearTimeout(t);t=setTimeout(()=>f(...a),ms);};};
const fmtSize=b=>b<1024?b+' B':b<1048576?Math.round(b/1024)+' KB':(b/1048576).toFixed(1)+' MB';
const fmtDT=t=>{const d=new Date(t);const p=n=>String(n).padStart(2,'0');return p(d.getDate())+'/'+p(d.getMonth()+1)+' '+p(d.getHours())+':'+p(d.getMinutes());};
function toast(m){const t=$('#toast');t.textContent=m;t.classList.add('show');clearTimeout(t._t);t._t=setTimeout(()=>t.classList.remove('show'),1800);}
function stripHtml(h){const d=document.createElement('div');d.innerHTML=h||'';return (d.textContent||'').trim();}

/* ================= INDEXEDDB ================= */
const DBN='leha-notes-v1';
let _db=null;
function idb(){return new Promise((res,rej)=>{
  if(_db)return res(_db);
  const r=indexedDB.open(DBN,1);
  r.onupgradeneeded=e=>{e.target.result.createObjectStore('kv');};
  r.onsuccess=e=>{_db=e.target.result;res(_db);};
  r.onerror=()=>rej(r.error);
});}
async function kvGet(k){const db=await idb();return new Promise((res,rej)=>{
  const t=db.transaction('kv').objectStore('kv').get(k);
  t.onsuccess=()=>res(t.result==null?null:t.result);t.onerror=()=>rej(t.error);});}
async function kvSet(k,v){const db=await idb();return new Promise((res,rej)=>{
  const t=db.transaction('kv').objectStore('kv').put(v,k);
  t.onsuccess=()=>res();t.onerror=()=>rej(t.error);});}

/* ================= STATE ================= */
let F=[],N=[],BLOBS={};           // folders, notes, blob store {attId:dataURL}
let selFolder='all', selNote=null, q='', tagF='', edMode='wy', mainView='notes';
let dragF=null;
const isMobile=()=>window.innerWidth<=900;

function saveSoon(){clearTimeout(saveSoon._t);saveSoon._t=setTimeout(saveNow,500);}
async function saveNow(){
  try{await kvSet('data',{folders:F,notes:N});await kvSet('blobs',BLOBS);}catch(e){}
}
function newFolder(name,parentId){return{id:uid(),name:name||'Thư mục mới',parentId:parentId||null,icon:'',color:'',collapsed:false,order:Date.now()};}
function newNote(folderId,tpl){
  const n={id:uid(),folderId:folderId||null,title:'',body:'',tags:[],pinned:false,createdAt:Date.now(),updatedAt:Date.now(),atts:[]};
  if(tpl==='meeting'){n.title='Biên bản họp';n.body='<h2>Biên bản họp</h2><p><b>Thời gian:</b> </p><p><b>Thành phần:</b> </p><h3>Nội dung</h3><ul><li></li></ul><h3>Kết luận</h3><p></p>';}
  else if(tpl==='day'){n.title='Kế hoạch ngày';n.body='<h2>Kế hoạch ngày</h2><h3>Ưu tiên</h3><ul><li></li></ul><h3>Lịch</h3><p></p>';}
  else if(tpl==='idea'){n.title='Ý tưởng mới';n.body='<h2>Ý tưởng</h2><p></p><h3>Triển khai</h3><p></p>';}
  else if(tpl==='check'){n.title='Checklist';n.body='<h2>Checklist</h2><ul><li>Việc 1</li><li>Việc 2</li></ul>';}
  return n;
}
</script>
<script>
"use strict";
/* ================= SIDEBAR: FOLDER TREE ================= */
const kids=pid=>F.filter(f=>f.parentId===pid).sort((a,b)=>a.order-b.order);
const fById=id=>F.find(f=>f.id===id);
const nById=id=>N.find(n=>n.id===id);
const notesIn=fid=>N.filter(n=>n.folderId===fid);
function countDeep(fid){let c=notesIn(fid).length;kids(fid).forEach(k=>c+=countDeep(k.id));return c;}

function vrow(id,name){
  return '<div class="frow'+((selFolder===id&&mainView==='notes')||(id==='graph'&&mainView==='graph')?' on':'')+'" data-vf="'+id+'">'
    +'<span class="fcaret"></span>'
    +'<span class="fname">'+esc(name)+'</span></div>';
}
function frowHtml(f,depth){
  const ch=kids(f.id), cnt=countDeep(f.id);
  let h='<div class="frow'+(selFolder===f.id?' on':'')+'" data-fid="'+f.id+'" draggable="true">'
    +'<span class="fcaret" data-fc="'+f.id+'">'+(ch.length?(f.collapsed?'▸':'▾'):'')+'</span>'
    +(f.icon?'<span class="ficon">'+esc(f.icon)+'</span>':'')
    +'<span class="fname">'+esc(f.name)+'</span>'
    +'<button class="fmenu-btn" data-fm="'+f.id+'">⋯</button></div>';
  if(ch.length&&!f.collapsed){h+='<div class="fkids">'+ch.map(c=>frowHtml(c,depth+1)).join('')+'</div>';}
  return h;
}
function renderTree(){
  $('#vtree').innerHTML =
    vrow('all','Tất cả')
    +vrow('recent','Gần đây')
    +vrow('pinned','Đã ghim')
    +vrow('none','Chưa phân loại')
    +vrow('graph','Biểu đồ');
  $('#ftree').innerHTML=kids(null).map(f=>frowHtml(f,0)).join('')||'<div style="color:var(--sb-dim);font-size:13px;padding:6px 10px">Chưa có thư mục</div>';
  renderTagList();
}
function renderTagList(){
  const m={};N.forEach(n=>(n.tags||[]).forEach(t=>m[t]=(m[t]||0)+1));
  const ts=Object.keys(m).sort();
  $('#taglist').innerHTML=ts.map(t=>'<span class="tagchip'+(tagF===t?' on':'')+'" data-tag="'+esc(t)+'">#'+esc(t)+'</span>').join('')
    ||'<span style="color:var(--sb-dim);font-size:12px">Chưa có thẻ</span>';
}
function isDesc(aid,did){ // aid có phải con cháu của did?
  let cur=fById(aid);while(cur){if(cur.parentId===did)return true;cur=fById(cur.parentId);}return false;
}

/* folder context menu */
let ctxEl=null;
function closeCtx(){if(ctxEl){ctxEl.remove();ctxEl=null;}}
function openCtx(x,y,items){
  closeCtx();
  ctxEl=document.createElement('div');ctxEl.className='ctxmenu';
  items.forEach(it=>{
    const b=document.createElement('button');b.textContent=it.t;
    if(it.danger)b.className='danger';
    b.onclick=()=>{closeCtx();it.fn();};
    ctxEl.appendChild(b);
  });
  document.body.appendChild(ctxEl);
  const r=ctxEl.getBoundingClientRect();
  ctxEl.style.left=Math.min(x,innerWidth-r.width-8)+'px';
  ctxEl.style.top=Math.min(y,innerHeight-r.height-8)+'px';
}
document.addEventListener('click',e=>{if(ctxEl&&!e.target.closest('.ctxmenu'))closeCtx();});

function folderMenu(fid,ev){
  const f=fById(fid);if(!f)return;
  openCtx(ev.clientX,ev.clientY,[
    {t:'+ Note mới',fn:()=>createNote(fid)},
    {t:'+ Thư mục con',fn:()=>askName('Tên thư mục con',nm=>{F.push(newFolder(nm,fid));saveSoon();renderTree();})},
    {t:'Đổi tên',fn:()=>askName('Đổi tên thư mục',nm=>{f.name=nm;saveSoon();renderTree();},f.name)},
    {t:'Thu gọn / Mở',fn:()=>{f.collapsed=!f.collapsed;saveSoon();renderTree();}},
    {t:'Đặt icon…',fn:()=>askName('Icon thư mục (để trống = không icon)',nm=>{f.icon=nm;saveSoon();renderTree();},f.icon||'')},
    {t:'Xóa thư mục',danger:true,fn:()=>delFolder(fid)}
  ]);
}
function delFolder(fid){
  const f=fById(fid);if(!f)return;
  confirmDlg('Xóa thư mục "'+f.name+'"?','Note bên trong sẽ chuyển lên thư mục cha.',()=>{
    const subs=[];(function walk(id){subs.push(id);kids(id).forEach(k=>walk(k.id));})(fid);
    N.forEach(n=>{if(subs.includes(n.folderId))n.folderId=f.parentId;});
    F=F.filter(x=>!subs.includes(x.id));
    if(selFolder===fid||subs.includes(selFolder))selFolder='all';
    saveSoon();renderTree();renderList();closeEditor();
  });
}
function askName(title,fn,def){
  openModal(title,'<label>Tên</label><input type="text" id="mName" value="'+esc(def||'')+'">',
    [{t:'Hủy'},{t:'Lưu',pri:true,fn:()=>{const v=$('#mName').value.trim();if(v)fn(v);}}]);
  setTimeout(()=>{const i=$('#mName');i.focus();i.select();},50);
}

/* sidebar events (delegate) */
$('#treeWrap').addEventListener('click',e=>{
  const vf=e.target.closest('[data-vf]');
  if(vf){if(vf.dataset.vf==='graph'){showGraph();return;}hideGraph();selFolder=vf.dataset.vf;tagF='';saveSoon();renderTree();renderList();if(isMobile())closeSidebar();return;}
  const fc=e.target.closest('[data-fc]');
  if(fc){const f=fById(fc.dataset.fc);if(f){f.collapsed=!f.collapsed;saveSoon();renderTree();}return;}
  const fm=e.target.closest('[data-fm]');
  if(fm){folderMenu(fm.dataset.fm,e);return;}
  const tg=e.target.closest('[data-tag]');
  if(tg){tagF=tagF===tg.dataset.tag?'':tg.dataset.tag;renderTree();renderList();return;}
  const fr=e.target.closest('[data-fid]');
  if(fr&&!e.target.closest('[data-fc]')&&!e.target.closest('[data-fm]')){
    selFolder=fr.dataset.fid;tagF='';renderTree();renderList();if(isMobile())closeSidebar();
  }
});
/* drag-drop folders */
$('#treeWrap').addEventListener('dragstart',e=>{
  const r=e.target.closest('[data-fid]');if(!r)return;
  dragF=r.dataset.fid;e.dataTransfer.effectAllowed='move';
});
$('#treeWrap').addEventListener('dragover',e=>{
  const r=e.target.closest('[data-fid]');
  if(r&&r.dataset.fid!==dragF){e.preventDefault();r.classList.add('drop');}
});
$('#treeWrap').addEventListener('dragleave',e=>{const r=e.target.closest('[data-fid]');if(r)r.classList.remove('drop');});
$('#treeWrap').addEventListener('drop',e=>{
  const r=e.target.closest('[data-fid]');if(!r)return;e.preventDefault();
  $$('.frow.drop').forEach(x=>x.classList.remove('drop'));
  const tid=r.dataset.fid;
  if(tid===dragF||isDesc(tid,dragF)){toast('Không thể di chuyển vào chính nó');dragF=null;return;}
  const f=fById(dragF);if(f){f.parentId=tid;f.order=Date.now();saveSoon();renderTree();toast('Đã di chuyển');}
  dragF=null;
});
$('#btnNewFolder').onclick=()=>askName('Tạo thư mục',nm=>{F.push(newFolder(nm,selFolder&&selFolder!=='all'&&fById(selFolder)?selFolder:null));saveSoon();renderTree();});
</script>
<script>
"use strict";
/* ================= MODAL ================= */
function openModal(title,bodyHtml,btns){
  $('#mTitle').textContent=title;$('#mBody').innerHTML=bodyHtml;
  const f=$('#mFoot');f.innerHTML='';
  (btns||[{t:'Đóng'}]).forEach(b=>{
    const el=document.createElement('button');
    el.className='btn'+(b.pri?' pri':'')+(b.danger?' danger':'');el.textContent=b.t;
    el.onclick=()=>{if(b.fn)b.fn();if(!b.keep)closeModal();};
    f.appendChild(el);
  });
  $('#modal').classList.add('open');
}
function closeModal(){$('#modal').classList.remove('open');}
$('#mClose').onclick=closeModal;
$('#modal').addEventListener('click',e=>{if(e.target.id==='modal')closeModal();});
function confirmDlg(title,msg,fn){
  openModal(title,'<p style="font-size:14px;color:var(--mut)">'+esc(msg)+'</p>',
    [{t:'Hủy'},{t:'Xóa',danger:true,fn}]);
}

/* ================= NOTE LIST ================= */
function filteredNotes(){
  let arr=N.slice();
  if(q){const s=q.toLowerCase();arr=arr.filter(n=>(n.title+' '+stripHtml(n.body)+' '+(n.tags||[]).join(' ')).toLowerCase().includes(s));}
  if(tagF)arr=arr.filter(n=>(n.tags||[]).includes(tagF));
  if(selFolder==='recent')arr.sort((a,b)=>b.updatedAt-a.updatedAt).slice(0,8);
  else if(selFolder==='pinned')arr=arr.filter(n=>n.pinned);
  else if(selFolder==='none')arr=arr.filter(n=>!n.folderId);
  else if(selFolder!=='all')arr=arr.filter(n=>n.folderId===selFolder);
  arr.sort((a,b)=>(b.pinned-a.pinned)||(b.updatedAt-a.updatedAt));
  return arr;
}
function folderTitle(){
  if(selFolder==='all')return'Tất cả';
  if(selFolder==='recent')return'Gần đây';
  if(selFolder==='pinned')return'Đã ghim';
  if(selFolder==='none')return'Chưa phân loại';
  const f=fById(selFolder);return f?f.name:'Tất cả';
}
function renderList(){
  $('#nlTitle').textContent=folderTitle()+(q?' · "'+q+'"':'');
  const arr=filteredNotes();
  const allTags={};N.forEach(n=>(n.tags||[]).forEach(t=>allTags[t]=1));
  $('#tagbar').innerHTML=Object.keys(allTags).sort().map(t=>'<span class="tagchip'+(tagF===t?' on':'')+'" data-ltag="'+esc(t)+'">#'+esc(t)+'</span>').join('');
  $('#notes').innerHTML=arr.length?arr.map(n=>{
    const sn=stripHtml(n.body).slice(0,90);
    return '<div class="nrow'+(selNote===n.id?' on':'')+'" data-nid="'+n.id+'">'
      +'<div class="t">'+(n.pinned?'<span class="pinflag">⚑</span>':'')+esc(n.title||'(Không tiêu đề)')+'</div>'
      +(sn?'<div class="s">'+esc(sn)+'</div>':'')
      +'<div class="m"><span>'+fmtDT(n.updatedAt)+'</span>'+((n.tags||[]).slice(0,3).map(t=>'<span>#'+esc(t)+'</span>').join(''))+'</div></div>';
  }).join(''):'<div class="nempty">Chưa có note.<br>Bấm "+ Note" để tạo mới.</div>';
}
$('#notes').addEventListener('click',e=>{
  const r=e.target.closest('[data-nid]');if(!r)return;
  openNote(r.dataset.nid);
});
$('#tagbar').addEventListener('click',e=>{
  const t=e.target.closest('[data-ltag]');if(!t)return;
  tagF=tagF===t.dataset.ltag?'':t.dataset.ltag;renderList();renderTagList();
});
$('#q').addEventListener('input',debounce(e=>{q=e.target.value.trim();renderList();},250));
$('#btnNewNote').onclick=()=>pickTemplate(t=>createNote(selFolder&&fById(selFolder)?selFolder:null,t));

const TPLS=[
  {id:'',t:'Note trống',d:'Bắt đầu từ trang trắng'},
  {id:'meeting',t:'Biên bản họp',d:'Thời gian, thành phần, nội dung, kết luận'},
  {id:'day',t:'Kế hoạch ngày',d:'Ưu tiên và lịch trong ngày'},
  {id:'idea',t:'Ý tưởng',d:'Mô tả ý tưởng và cách triển khai'},
  {id:'check',t:'Checklist',d:'Danh sách việc cần làm'}
];
function pickTemplate(fn){
  openModal('Note mới',TPLS.map(t=>'<button class="tmpl" data-tpl="'+t.id+'"><b>'+esc(t.t)+'</b><span>'+esc(t.d)+'</span></button>').join(''),[{t:'Hủy'}]);
  $$('#mBody [data-tpl]').forEach(b=>b.onclick=()=>{closeModal();fn(b.dataset.tpl);});
}
function createNote(folderId,tpl){
  const n=newNote(folderId,tpl);N.push(n);saveSoon();
  renderList();renderTree();openNote(n.id);
  setTimeout(()=>$('#noteTitle').focus(),80);
}
function delNote(id){
  const n=nById(id);if(!n)return;
  confirmDlg('Xóa note?','"'+(n.title||'(Không tiêu đề)')+'" sẽ bị xóa vĩnh viễn.',()=>{
    (n.atts||[]).forEach(a=>{if(a.blob)delete BLOBS[a.blob];});
    N=N.filter(x=>x.id!==id);if(selNote===id)selNote=null;
    saveSoon();renderList();renderTree();closeEditor();
  });
}
</script>
<script>
"use strict";
/* ================= EDITOR ================= */
function openNote(id){
  const n=nById(id);if(!n)return;
  hideGraph();
  selNote=id;
  $('#noteTitle').value=n.title||'';
  $('#tagInput').value=(n.tags||[]).join(', ');
  $('#btnPin').classList.toggle('on',!!n.pinned);
  setEdMode('wy',true);
  $('#edBody').innerHTML=n.body||'';
  $('#mdSrc').value=html2md(n.body||'');
  renderGallery();
  renderList();renderCrumb();refreshFolds();
  if(isMobile()){$('#notelist').classList.add('hide');$('#editor').classList.add('show');}
  closeSidebar();
}
function folderPath(fid){const p=[];let f=fById(fid);while(f){p.unshift(f);f=fById(f.parentId);}return p;}
function renderCrumb(){
  const n=nById(selNote);if(!n){$('#crumb').innerHTML='';return;}
  const p=folderPath(n.folderId);
  $('#crumb').innerHTML=p.map(f=>'<a data-crumb="'+f.id+'">'+esc(f.name)+'</a>').join('<span>/</span>')
    +(p.length?'<span>/</span>':'')+'<b>'+esc(n.title||'(Không tiêu đề)')+'</b>';
}
$('#crumb').addEventListener('click',e=>{
  const a=e.target.closest('[data-crumb]');if(!a)return;
  selFolder=a.dataset.crumb;tagF='';renderTree();renderList();closeEditor();
});
function closeEditor(){
  hideGraph();
  selNote=null;$('#noteTitle').value='';$('#edBody').innerHTML='';$('#mdSrc').value='';$('#crumb').innerHTML='';
  $('#tagInput').value='';$('#galGrid').innerHTML='';$('#galCount').textContent='';
  if(isMobile()){$('#notelist').classList.remove('hide');$('#editor').classList.remove('show');}
  renderList();
}
$('#backBtn').onclick=closeEditor;
$('#noteTitle').addEventListener('input',debounce(e=>{
  const n=nById(selNote);if(!n)return;n.title=e.target.value;n.updatedAt=Date.now();saveSoon();
},400));
$('#tagInput').addEventListener('input',debounce(e=>{
  const n=nById(selNote);if(!n)return;
  n.tags=e.target.value.split(',').map(s=>s.trim()).filter(Boolean);n.updatedAt=Date.now();
  saveSoon();renderTagList();
},500));
$('#btnPin').onclick=()=>{
  const n=nById(selNote);if(!n)return;n.pinned=!n.pinned;n.updatedAt=Date.now();
  $('#btnPin').classList.toggle('on',n.pinned);saveSoon();renderList();renderTree();
};
$('#btnMore').onclick=e=>{
  const n=nById(selNote);
  const items=[];
  if(n)items.push({t:n.pinned?'Bỏ ghim':'Ghim note',fn:()=>$('#btnPin').click()});
  if(n)items.push({t:'Nhân bản note',fn:()=>{
    const c=JSON.parse(JSON.stringify(n));c.id=uid();c.title=(c.title||'')+' (bản sao)';c.createdAt=c.updatedAt=Date.now();
    (c.atts||[]).forEach(a=>{if(a.blob){const nb=uid();BLOBS[nb]=BLOBS[a.blob];a.blob=nb;}});
    N.push(c);saveSoon();renderList();openNote(c.id);
  }});
  if(n)items.push({t:'Xóa note',danger:true,fn:()=>delNote(n.id)});
  items.push({t:'Đóng',fn:()=>{}});
  openCtx(e.clientX,e.clientY-10,items);
};

/* ---- editor modes ---- */
function setEdMode(m,silent){
  edMode=m;
  $('#mMd').classList.toggle('on',m==='md');
  $('#mWy').classList.toggle('on',m==='wy');
  const showMd=m==='md';
  $('#mdSrc').style.display=showMd?'block':'none';
  $('#edBody').style.display=showMd?'none':'block';
  $('#toolbar').querySelectorAll('[data-c],#hSel,#colorPick,#hlPick,#tCode,#tTable,#tFold,#tLink,#tHtml,#tImg,#tImgIn,#tWl').forEach(b=>b.disabled=showMd);
  if(!silent){const n=nById(selNote);if(n){n.body=showMd?md2html($('#mdSrc').value):$('#edBody').innerHTML;n.updatedAt=Date.now();saveSoon();}}
}
$('#mMd').onclick=()=>{const n=nById(selNote);if(n)$('#mdSrc').value=html2md($('#edBody').innerHTML);setEdMode('md');};
$('#mWy').onclick=()=>{const n=nById(selNote);if(n)$('#edBody').innerHTML=md2html($('#mdSrc').value);setEdMode('wy');refreshFolds();};

/* ---- wysiwyg toolbar ---- */
$('#toolbar').addEventListener('click',e=>{
  const b=e.target.closest('[data-c]');if(!b||b.disabled)return;
  $('#edBody').focus();document.execCommand(b.dataset.c,false,null);edInput();
});
$('#hSel').onchange=e=>{
  if(!e.target.value)return;

function wlTargets(html){const t=[],re=/data-wl="([^"]+)"/g;let m;while(m=re.exec(html||''))t.push(m[1]);return t;}
function graphData(){
  const nodes=N.map(n=>({id:n.id,title:n.title||'(Không tiêu đề)',tags:n.tags||[]}));
  const edges=[];
  N.forEach(n=>{wlTargets(n.body).forEach(t=>{const d=noteByTitle(t);if(d&&d.id!==n.id&&!edges.some(e=>e[0]===n.id&&e[1]===d.id))edges.push([n.id,d.id]);});});
  return{nodes,edges};
}
function showGraph(){
  mainView='graph';closeSidebar();
  $('#graphSec').classList.add('show');
  if(isMobile()){$('#notelist').classList.add('hide');$('#editor').classList.remove('show');}
  else{$('#notelist').style.display='none';$('#editor').style.display='none';}
  renderTree();
  requestAnimationFrame(drawGraph);
}
function hideGraph(){
  if(mainView!=='graph')return;
  mainView='notes';
  $('#graphSec').classList.remove('show');
  if(isMobile()){$('#notelist').classList.remove('hide');}
  else{$('#notelist').style.display='';$('#editor').style.display='';}
  renderTree();

function drawGraph(){
  const cv=$('#gCanvas');
  const r=cv.parentElement.getBoundingClientRect();
  const dpr=window.devicePixelRatio||1;
  cv.width=Math.max(1,r.width*dpr);cv.height=Math.max(1,r.height*dpr);
  cv.style.width=r.width+'px';cv.style.height=r.height+'px';
  const x=cv.getContext('2d');x.scale(dpr,dpr);x.clearRect(0,0,r.width,r.height);
  const g=graphData(),nodes=g.nodes,edges=g.edges;
  $('#gCount').textContent=nodes.length+' note · '+edges.length+' liên kết';
  if(!nodes.length){x.fillStyle='#999';x.font='14px sans-serif';x.textAlign='center';x.fillText('Chưa có note',r.width/2,r.height/2);return;}
  const W=r.width,H=r.height,cx=W/2,cy=H/2,R=Math.max(40,Math.min(W,H)*0.36);
  const deg={};edges.forEach(e=>{deg[e[0]]=(deg[e[0]]||0)+1;deg[e[1]]=(deg[e[1]]||0)+1;});
  let hub=null,hd=-1;nodes.forEach(n=>{if((deg[n.id]||0)>hd){hd=deg[n.id]||0;hub=n.id;}});
  const pos={};
  nodes.forEach((n,i)=>{const a=nodes.length>1?i/nodes.length*Math.PI*2-Math.PI/2:0;
    const rr=n.id===hub?R*0.4:R;
    pos[n.id]={x:cx+Math.cos(a)*rr,y:cy+Math.sin(a)*rr,r:n.id===hub?11:5+Math.min(6,(deg[n.id]||0)*1.6),n};});
  const cs=getComputedStyle(document.documentElement);
  x.lineWidth=1;x.strokeStyle=cs.getPropertyValue('--line')||'#e2e8f0';
  edges.forEach(e=>{const A=pos[e[0]],B=pos[e[1]];if(!A||!B)return;x.beginPath();x.moveTo(A.x,A.y);x.lineTo(B.x,B.y);x.stroke();});
  const ink=cs.getPropertyValue('--ink')||'#111';
  Object.values(pos).forEach(p=>{
    x.fillStyle=(p.n.tags&&p.n.tags.length)?'#65a30d':'#9aa5b1';
    x.beginPath();x.arc(p.x,p.y,p.r,0,7);x.fill();
    x.fillStyle=ink;x.font='11px sans-serif';x.textAlign='center';
    const t=p.n.title.length>16?p.n.title.slice(0,16)+'…':p.n.title;
    x.fillText(t,p.x,p.y+p.r+13);
  });
  cv._pos=pos;
}
$('#gCanvas').addEventListener('click',e=>{
  const pos=e.target._pos;if(!pos)return;
  const r=e.target.getBoundingClientRect(),mx=e.clientX-r.left,my=e.clientY-r.top;
  let best=null,bd=26;
  Object.values(pos).forEach(p=>{const d=Math.hypot(p.x-mx,p.y-my);if(d<bd){bd=d;best=p;}});
  if(best){hideGraph();openNote(best.n.id);}
});

/* ================= MINI MARKDOWN ================= */
function md2html(md){
  const lines=String(md||'').split('\n');let h='',i=0,inCode=false,codeBuf=[];
  const inline=s=>esc(s)
    .replace(/\*\*([^*]+)\*\*/g,'<b>$1</b>').replace(/\*([^*]+)\*/g,'<i>$1</i>')
    .replace(/`([^`]+)`/g,'<code>$1</code>').replace(/==([^=]+)==/g,'<mark>$1</mark>')
    .replace(/\{([a-z]+)\}([^{]+)/gi,'<span style="color:$1">$2</span>')
    .replace(/!\[([^\]]*)\]\(([^)]+)\)/g,'<img src="$2" alt="$1" style="max-width:100%;border-radius:6px">')
    .replace(/\[\[([^\]]+)\]\]/g,'<a class="wl" data-wl="$1">$1</a>')
    .replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  while(i<lines.length){
    const L=lines[i];
    if(/^```/.test(L)){if(!inCode){inCode=true;codeBuf=[];}else{inCode=false;h+='<div class="codewrap"><div class="codehead"><span>CODE</span><span class="sp"></span><button data-cw="t">Thu gọn</button><button data-cw="c">Copy</button></div><pre><code>'+esc(codeBuf.join('\n'))+'</code></pre></div>';}i++;continue;}
    if(inCode){codeBuf.push(L);i++;continue;}
    if(/^:::details\s*(.*)/.test(L)){const t=L.replace(/^:::details\s*/,'');let b=[];i++;while(i<lines.length&&!/^:::$/.test(lines[i])){b.push(lines[i]);i++;}h+='<details class="mdfolder"><summary>'+esc(t||'Mục gập')+'</summary><div class="fbody">'+md2html(b.join('\n'))+'</div></details>';i++;continue;}
    if(/^\|.*\|$/.test(L)&&i+1<lines.length&&/^\|[\s:\-|]+\|$/.test(lines[i+1])){
      const heads=L.split('|').slice(1,-1).map(s=>s.trim());i+=2;let rows='';
      while(i<lines.length&&/^\|.*\|$/.test(lines[i])){rows+='<tr>'+lines[i].split('|').slice(1,-1).map(s=>'<td>'+inline(s.trim())+'</td>').join('')+'</tr>';i++;}
      h+='<table><tr>'+heads.map(x=>'<th>'+inline(x)+'</th>').join('')+'</tr>'+rows+'</table>';continue;}
    let m;
    if(m=L.match(/^(#{1,3})\s+(.*)/)){const lv=m[1].length;h+='<h'+lv+'>'+inline(m[2])+'</h'+lv+'>';}
    else if(/^&gt;\s?/.test(esc(L))||/^>\s?/.test(L)){h+='<blockquote>'+inline(L.replace(/^>\s?/,''))+'</blockquote>';}
    else if(/^\s*[-*]\s+/.test(L)){let it='';while(i<lines.length&&/^\s*[-*]\s+/.test(lines[i])){it+='<li>'+inline(lines[i].replace(/^\s*[-*]\s+/,''))+'</li>';i++;}h+='<ul>'+it+'</ul>';continue;}
    else if(/^\s*\d+\.\s+/.test(L)){let it='';while(i<lines.length&&/^\s*\d+\.\s+/.test(lines[i])){it+='<li>'+inline(lines[i].replace(/^\s*\d+\.\s+/,''))+'</li>';i++;}h+='<ol>'+it+'</ol>';continue;}
    else if(/^\s*$/.test(L)){h+='';}
    else if(/^(->|<-)/.test(L)){const a=L.startsWith('->')?'right':'left';h+='<p style="text-align:'+a+'">'+inline(L.slice(2).trim())+'</p>';}
    else if(/^<html>/.test(L.trim())){h+=L.trim().replace(/^<html>|<\/html>$/g,'');}
    else h+='<p>'+inline(L)+'</p>';
    i++;
  }
  return h;
}
function html2md(html){
  const d=document.createElement('div');d.innerHTML=html||'';
  d.querySelectorAll('.codehead,.hfc').forEach(x=>x.remove());
  let out=[];
  d.childNodes.forEach(n=>{
    if(n.nodeType===3){const t=n.textContent.trim();if(t)out.push(t);}
    else if(n.nodeType!==1)return;
    const t=n.tagName.toLowerCase(), tx=n.textContent;
    if(t==='h1')out.push('# '+tx);else if(t==='h2')out.push('## '+tx);else if(t==='h3')out.push('### '+tx);
    else if(t==='pre')out.push('```\n'+tx+'\n```');
    else if(t==='li')out.push('- '+tx);
    else if(t==='blockquote')out.push('> '+tx);
    else if(t==='details'){const s=n.querySelector('summary');out.push(':::details '+(s?s.textContent:''));const b=n.querySelector('.fbody');if(b)out.push(html2md(b.innerHTML));out.push(':::');}
    else if(t==='table'){const rows=[...n.querySelectorAll('tr')].map(tr=>[...tr.children].map(c=>c.textContent.trim()).join(' | '));if(rows.length){out.push('| '+rows[0].split(' | ').join(' | ')+' |');out.push('|'+rows[0].split(' | ').map(()=>'---').join('|')+'|');rows.slice(1).forEach(r=>out.push('| '+r+' |'));}}
    else if(t==='div'&&n.classList.contains('codewrap')){const c=n.querySelector('code');out.push('```\n'+(c?c.textContent:'')+'\n```');}
    else if(tx.trim())out.push(tx.trim());
  });
  // inline styles -> md (best effort)
  let md=out.join('\n\n');
  d.querySelectorAll('b,strong').forEach(b=>{md=md.split(b.textContent).join('**'+b.textContent+'**');});
  return md;
}

<script>
"use strict";
/* ================= ATTACHMENTS (GALLERY) ================= */
let attTarget=null, lbList=[], lbIdx=0;
$('#btnAttach').onclick=()=>{$('#filePick').click();};
$('#filePick').addEventListener('change',e=>{
  const fs=e.target.files;if(!fs.length)return;
  if(!selNote){toast('Mở một note trước');e.target.value='';return;}
  attTarget=selNote;
  addFiles(fs,()=>{e.target.value='';});
});
function addFiles(fs,done){
  const n=nById(attTarget);if(!n){if(done)done();return;}
  n.atts=n.atts||[];
  let left=fs.length;
  Array.from(fs).forEach(f=>{
    const kind=f.type.startsWith('image/')?'image':f.type.startsWith('audio/')?'audio':f.type.startsWith('video/')?'video':'file';
    const finish=(blobId,dataUrl)=>{
      n.atts.push({id:uid(),name:f.name,size:f.size,mime:f.type,kind,blob:blobId,url:dataUrl||null});
      n.updatedAt=Date.now();saveSoon();renderGallery();
      if(--left===0&&done)done();
    };
    if(f.size>8*1048576&&kind!=='image'){toast('File "'+f.name+'" quá lớn (>8MB), bỏ qua');if(--left===0&&done)done();return;}
    if(kind==='image'){compressImage(f,1200,url=>{const id=uid();BLOBS[id]=url;finish(id,null);});}
    else{const rd=new FileReader();rd.onload=()=>{const id=uid();BLOBS[id]=rd.result;finish(id,null);};rd.readAsDataURL(f);}
  });
}
function compressImage(file,maxPx,cb){
  const img=new Image();
  img.onload=()=>{
    let w=img.width,h=img.height;
    if(Math.max(w,h)>maxPx){const r=maxPx/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);
    cb(c.toDataURL('image/jpeg',0.82));
    URL.revokeObjectURL(img.src);
  };
  img.onerror=()=>{const rd=new FileReader();rd.onload=()=>cb(rd.result);rd.readAsDataURL(file);};
  img.src=URL.createObjectURL(file);
}

  const n=nById(selNote),g=$('#galGrid');

let mRec=null,mChunks=[];
$('#tVoice').onclick=async()=>{
  if(mRec&&mRec.state==='recording'){mRec.stop();return;}
  try{
    const st=await navigator.mediaDevices.getUserMedia({audio:true});
    mRec=new MediaRecorder(st);mChunks=[];
    mRec.ondataavailable=e=>{if(e.data.size)mChunks.push(e.data);};
    mRec.onstop=()=>{
      st.getTracks().forEach(t=>t.stop());
      const blob=new Blob(mChunks,{type:mRec.mimeType||'audio/webm'});
      const rd=new FileReader();
      rd.onload=()=>{
        const n=nById(selNote);
        if(n){const id=uid();BLOBS[id]=rd.result;
          n.atts=n.atts||[];
          n.atts.push({id:uid(),name:'Ghi âm '+fmtDT(Date.now())+'.webm',size:blob.size,mime:blob.type,kind:'audio',blob:id,url:null});
          n.updatedAt=Date.now();saveSoon();renderGallery();toast('Đã lưu ghi âm');}
      };
      rd.readAsDataURL(blob);mRec=null;$('#tVoice').classList.remove('on');$('#tVoice').textContent='Ghi âm';
    };
    mRec.start();$('#tVoice').classList.add('on');$('#tVoice').textContent='■ Dừng';
    toast('Đang ghi âm...');
  }catch(err){toast('Không truy cập được micro');}
};
/* attach link image */
function attachLink(){
  const u=prompt('Dán link ảnh (https://...)');if(!u||!u.startsWith('http'))return;
  const n=nById(selNote);if(!n){toast('Mở một note trước');return;}
  n.atts=n.atts||[];
  n.atts.push({id:uid(),name:'Ảnh link',size:0,mime:'image/*',kind:'image',blob:null,url:u});
  n.updatedAt=Date.now();saveSoon();renderGallery();toast('Đã thêm ảnh');
}
</script>
<script>
"use strict";
/* ================= SIDEBAR / THEME / IO ================= */
function openSidebar(){$('#sidebar').classList.add('open');$('#scrim').classList.add('open');}
function closeSidebar(){$('#sidebar').classList.remove('open');$('#scrim').classList.remove('open');}
$('#hamb1').onclick=openSidebar;$('#hamb2').onclick=openSidebar;$('#scrim').onclick=closeSidebar;
async function doExport(){
  const data={app:'LEHA Notes',v:1,exportedAt:new Date().toISOString(),folders:F,notes:N,blobs:BLOBS};
  const b=new Blob([JSON.stringify(data)],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(b);
  a.download='leha-notes-'+new Date().toISOString().slice(0,10)+'.json';a.click();
  setTimeout(()=>URL.revokeObjectURL(a.href),2000);toast('Đã xuất JSON');
}
function doImport(){$('#importFile').click();}
function openSettings(){
  const th=document.documentElement.dataset.theme;
  const ths=[['light','Sáng'],['dark','Tối'],['night','Đêm'],['mono','Đơn sắc'],['sand','Cát']];
  openModal('Cài đặt',
    '<div class="setsearch"><input id="setQ" placeholder="Tìm kiếm cài đặt..."></div>'
    +'<div class="set-t">Giao diện</div><div class="setcard">'
    +ths.map(t=>'<div class="setrow" data-th="'+t[0]+'"><span class="si">◐</span><span>'+t[1]+'</span><span class="chev">'+(th===t[0]?'✓':'›')+'</span></div>').join('')+'</div>'
    +'<div class="set-t">Dữ liệu</div><div class="setcard">'
    +'<div class="setrow" id="setExp"><span class="si">⤓</span><span>Xuất JSON</span><span class="chev">›</span></div>'
    +'<div class="setrow" id="setImp"><span class="si">⤒</span><span>Nhập JSON</span><span class="chev">›</span></div></div>'
    +'<div class="set-t">Giới thiệu</div><div class="setcard"><div class="setrow"><span class="si">ℹ</span><span>LEHA Notes v1 · single-file</span></div></div>',
    [{t:'Đóng'}]);
  $$('#mBody [data-th]').forEach(r=>r.onclick=()=>{document.documentElement.dataset.theme=r.dataset.th;kvSet('theme',r.dataset.th);openSettings();});
  $('#setExp').onclick=()=>{closeModal();doExport();};
  $('#setImp').onclick=()=>{closeModal();doImport();};
  $('#setQ').oninput=e=>{const q=e.target.value.toLowerCase();$$('#mBody .setrow').forEach(r=>{r.style.display=r.textContent.toLowerCase().includes(q)?'':'none';});};
}
$('#btnSettings').onclick=openSettings;
$('#importFile').addEventListener('change',e=>{
  const f=e.target.files[0];if(!f)return;
  const rd=new FileReader();
  rd.onload=()=>{
    try{
      const d=JSON.parse(rd.result);
      if(!d.folders||!d.notes)throw 0;
      if(!confirm('Nhập sẽ THAY THẾ toàn bộ dữ liệu hiện tại. Tiếp tục?'))return;
      F=d.folders;N=d.notes;BLOBS=d.blobs||{};
      selFolder='all';selNote=null;saveSoon();renderTree();renderList();closeEditor();
      toast('Đã nhập '+N.length+' note');
    }catch(err){toast('File không hợp lệ');}
    e.target.value='';
  };
  rd.readAsText(f);
});
document.addEventListener('keydown',e=>{
  if((e.ctrlKey||e.metaKey)&&e.key.toLowerCase()==='k'){e.preventDefault();$('#q').focus();if(isMobile())openSidebar();}
  if(e.key==='Escape'){closeModal();closeCtx();$('#lb').classList.remove('open');}
});
$('#tagInputRow').style.display='none';
/* show tag row only when editing */
const _openNote=openNote;
openNote=function(id){_openNote(id);$('#tagInputRow').style.display='flex';};

/* ================= INIT ================= */
async function seed(){
  const f1={id:uid(),name:'Công việc',parentId:null,icon:'',color:'',collapsed:false,order:1};
  const f2={id:uid(),name:'Cá nhân',parentId:null,icon:'',color:'',collapsed:false,order:2};
  F=[f1,f2];
  const n1=newNote(f1.id);n1.title='Chào mừng đến LEHA Notes';
  n1.body='<p>Đây là app ghi chú dạng thư mục, giao diện gọn như The Wall.</p><h3>Cách dùng</h3><ul><li>Bấm <b>+ Note</b> để tạo ghi chú mới</li><li>Thư mục bên trái: tạo, đổi tên, kéo thả sắp xếp</li><li>Soạn thảo 2 chế độ: <b>MD</b> (Markdown) và <b>Aa</b> (trực quan)</li><li>Đính kèm ảnh/file/ghi âm ở nút <b>Đính kèm</b></li></ul><p>Gõ <b>Ctrl+K</b> để tìm kiếm toàn cục.</p>';
  n1.tags=['bắt đầu'];n1.pinned=true;
  const n2=newNote(f2.id);n2.title='Ý tưởng';
  n2.body='<p>Ghi nhanh ý tưởng ở đây...</p>';
  N=[n1,n2];
  await saveNow();
}
async function init(){
  try{
    const d=await kvGet('data'), b=await kvGet('blobs'), th=await kvGet('theme');
    if(d&&d.notes){F=d.folders||[];N=d.notes||[];BLOBS=b||{};}
    else await seed();
    if(th){document.documentElement.dataset.theme=th;}
  }catch(e){await seed();}
  renderTree();renderList();
  if(isMobile()){$('#editor').classList.remove('show');}
}
document.addEventListener('DOMContentLoaded',init);
</script>
</body>
