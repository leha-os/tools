<!DOCTYPE html>
<html lang="vi" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>LEHA MindPlan</title>
<style>
/* ============ THEME ============ */
:root,[data-theme="light"]{
  --bg:#f8fafc;--panel:#ffffff;--ink:#0f172a;--mut:#64748b;--faint:#94a3b8;
  --line:#e2e8f0;--line2:#f1f5f9;--pri:#2563eb;--pri-soft:#eff6ff;
  --ok:#15803d;--warn:#b45309;--bad:#b91c1c;
  --sel:#eef4ff;--shadow:0 4px 18px rgba(15,23,42,.10);
  --nodebd:#c3ccd8;--edge:#94a3b8;
}
[data-theme="dark"]{
  --bg:#111827;--panel:#1f2937;--ink:#f3f4f6;--mut:#9ca3af;--faint:#6b7280;
  --line:#374151;--line2:#1f2937;--pri:#7aa3d8;--pri-soft:#1e3a5f;
  --ok:#6f9e7e;--warn:#d9a441;--bad:#e0655f;
  --sel:#1e3a5f;--shadow:0 4px 18px rgba(0,0,0,.4);
  --nodebd:#4b5563;--edge:#6b7280;
}
[data-theme="night"]{
  --bg:#0b1526;--panel:#12233d;--ink:#e8eef7;--mut:#8fa3bd;--faint:#5c6f8a;
  --line:#1e3a5f;--line2:#0f1e33;--pri:#6ba3c8;--pri-soft:#14304d;
  --ok:#6f9e7e;--warn:#d9a441;--bad:#e0655f;
  --sel:#14304d;--shadow:0 4px 18px rgba(0,0,0,.5);
  --nodebd:#2c4a6b;--edge:#3b5878;
}
[data-theme="mono"]{
  --bg:#ffffff;--panel:#ffffff;--ink:#111111;--mut:#555555;--faint:#999999;
  --line:#dddddd;--line2:#f5f5f5;--pri:#111111;--pri-soft:#f0f0f0;
  --ok:#111111;--warn:#555555;--bad:#111111;
  --sel:#f0f0f0;--shadow:0 4px 18px rgba(0,0,0,.08);
  --nodebd:#bbbbbb;--edge:#999999;
}
[data-theme="sand"]{
  --bg:#faf6ef;--panel:#fffdf8;--ink:#3d2f1e;--mut:#8a7557;--faint:#b8a88c;
  --line:#e8dcc8;--line2:#f5efe2;--pri:#8a6d3b;--pri-soft:#f5efe2;
  --ok:#5f7a4a;--warn:#a86f14;--bad:#a03d2d;
  --sel:#f5efe2;--shadow:0 4px 18px rgba(61,47,30,.10);
  --nodebd:#d4c4a5;--edge:#b8a88c;
}
/* ============ BASE ============ */
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%;margin:0}
body{background:var(--bg);color:var(--ink);font:15px/1.45 -apple-system,BlinkMacSystemFont,"Segoe UI",Roboto,Arial,sans-serif;overflow:hidden}
button{font:inherit;color:inherit}
::-webkit-scrollbar{width:8px;height:8px}::-webkit-scrollbar-thumb{background:var(--line);border-radius:4px}
/* ============ HEADER (logo only) ============ */
header{height:52px;display:flex;align-items:center;gap:10px;padding:0 14px;background:var(--panel);border-bottom:1px solid var(--line);position:fixed;inset:0 0 auto 0;z-index:40}
.logo{font-weight:800;font-size:16px;letter-spacing:.3px;cursor:pointer;user-select:none;white-space:nowrap}
.logo small{font-weight:600;color:var(--mut);font-size:12px}
#docName{font-size:13px;color:var(--mut);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
/* ============ SIDEBAR ============ */
#scrim{position:fixed;inset:0;background:rgba(15,23,42,.4);z-index:48;display:none}
#scrim.open{display:block}
#sidebar{position:fixed;top:0;left:0;bottom:0;width:320px;max-width:88vw;background:var(--panel);z-index:50;border-right:1px solid var(--line);box-shadow:var(--shadow);transform:translateX(-105%);transition:transform .22s ease;display:flex;flex-direction:column}
#sidebar.open{transform:none}
.sb-head{display:flex;align-items:center;justify-content:space-between;padding:14px 16px;border-bottom:1px solid var(--line)}
.sb-head b{font-size:15px}
.sb-x{border:0;background:none;font-size:20px;color:var(--mut);cursor:pointer;padding:6px 10px}
.sb-body{flex:1;overflow-y:auto;padding:12px 14px 30px}
.sb-sec{margin-bottom:18px}
.sb-t{font-size:11px;font-weight:700;color:var(--faint);text-transform:uppercase;letter-spacing:.6px;margin-bottom:8px}
.sb-nav{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.sb-nav button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:10px 8px;font-size:13px;cursor:pointer;text-align:center}
.sb-nav button.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri);font-weight:700}
.sb-grid{display:flex;flex-wrap:wrap;gap:6px}
.btn{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:9px 12px;font-size:13.5px;cursor:pointer}
.btn:active{background:var(--line2)}
.btn.pri{background:var(--pri);border-color:var(--pri);color:#fff;font-weight:700}
.btn.danger{color:var(--bad);border-color:var(--bad)}
.sb-row{display:flex;align-items:center;gap:8px;margin-bottom:8px}
.sb-row label{font-size:12px;color:var(--mut);min-width:86px}
.sb-row input,.sb-row select{flex:1;border:1px solid var(--line);border-radius:6px;padding:8px;font-size:13.5px;background:var(--panel);color:var(--ink);font-family:inherit}
/* node detail in sidebar */
#ndEmpty{color:var(--faint);font-size:13px;text-align:center;padding:20px 0}
.fld{margin-bottom:12px}
.fld>label{display:block;font-size:12px;font-weight:700;color:var(--mut);margin-bottom:5px}
.fld input[type=text],.fld input[type=date],.fld input[type=number],.fld select{width:100%;border:1px solid var(--line);border-radius:6px;padding:9px;font-size:14px;background:var(--panel);color:var(--ink);font-family:inherit}
.fld input[type=range]{width:100%}
.prow2{display:flex;align-items:center;gap:10px}
.prow2 output{font-weight:700;min-width:44px;text-align:right}
.swatches{display:flex;gap:6px;flex-wrap:wrap}
.sw{width:30px;height:30px;border-radius:50%;border:2px solid transparent;cursor:pointer}
.sw.on{border-color:var(--ink)}
.iconpick{display:grid;grid-template-columns:repeat(6,1fr);gap:4px;max-height:150px;overflow-y:auto;border:1px solid var(--line);border-radius:8px;padding:8px}
.iconpick button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.iconpick button.on{border-color:var(--pri);background:var(--pri-soft)}
.iconpick svg{width:20px;height:20px}
/* ============ MAIN ============ */
main{position:fixed;inset:52px 0 0 0;overflow:hidden}
.view{position:absolute;inset:0;display:none;overflow:hidden}
.view.on{display:block}
#view-outline{overflow-y:auto}
/* ============ OUTLINE (Workflowy-like) ============ */
.otree{padding:14px 14px 80px;max-width:760px;margin:0 auto}
.obar{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--line);background:var(--panel);position:sticky;top:0;z-index:5}
.obar input[type=month]{border:1px solid var(--line);border-radius:6px;padding:7px;font-size:13px;background:var(--panel);color:var(--ink);font-family:inherit}
.obar .btn{padding:7px 10px;font-size:12.5px}
.ohint{font-size:11.5px;color:var(--faint);margin-left:auto}
.orow{margin:0}
.oline{display:flex;align-items:flex-start;gap:3px;padding:2px 4px;border-radius:4px;position:relative}
.orow.sel>.oline{background:var(--sel)}
.ocaret{width:20px;min-width:20px;text-align:center;color:var(--faint);font-size:11px;padding-top:4px;cursor:pointer;user-select:none;flex:none;line-height:1.4}
.ocaret.has{color:var(--mut)}
.obull{width:14px;min-width:14px;text-align:center;color:var(--faint);font-size:8px;padding-top:6px;user-select:none;flex:none;line-height:1}
.otitle{flex:1;font-size:15px;line-height:1.42;outline:none;padding:1px 2px;min-width:40px;word-break:break-word;color:var(--ink);caret-color:var(--pri)}
.otitle:focus{background:var(--sel)}
.otitle:empty:before{content:attr(data-ph);color:var(--faint)}
.otitle code{background:var(--line2);border-radius:4px;padding:0 4px;font-size:13px;font-family:ui-monospace,monospace}
.otitle strong{font-weight:700}.otitle em{font-style:italic}
.odots{font-size:10px;color:var(--faint);padding-top:6px;flex:none;white-space:nowrap}
.onote{margin:0 0 2px 37px;font-size:13.5px;color:var(--mut);outline:none;line-height:1.5;word-break:break-word;white-space:pre-wrap}
.onote:empty{display:none}
.okids{margin-left:14px;border-left:1px solid var(--line2);padding-left:2px}
.orow.dim>.oline{opacity:.35}
.gempty{color:var(--faint);text-align:center;padding:40px 16px;font-size:14px}
/* ============ NOTE EDITOR (in sidebar) ============ */
.nmode{display:flex;gap:4px;margin-bottom:6px}
.nmode button{flex:1;border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:7px;font-size:12.5px;cursor:pointer}
.nmode button.on{background:var(--pri-soft);border-color:var(--pri);color:var(--pri);font-weight:700}
.ntools{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.ntools button{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:6px 9px;font-size:12.5px;cursor:pointer;min-width:34px}
.ntools button:active{background:var(--line2)}
#noteMd{width:100%;min-height:130px;border:1px solid var(--line);border-radius:8px;padding:10px;font-size:13.5px;font-family:ui-monospace,monospace;background:var(--panel);color:var(--ink);resize:vertical}
#noteRich{border:1px solid var(--line);border-radius:8px;padding:10px;min-height:130px;font-size:13.5px;outline:none;background:var(--panel)}
#noteRich:focus{border-color:var(--pri)}
#notePrev{border:1px dashed var(--line);border-radius:8px;padding:10px;font-size:13.5px;min-height:60px}
#notePrev:empty{display:none}
/* rendered markdown */
.md h1{font-size:19px;margin:10px 0 6px}.md h2{font-size:17px;margin:9px 0 5px}.md h3{font-size:15px;margin:8px 0 4px}
.md p{margin:6px 0}.md ul{margin:6px 0;padding-left:20px}
.md code{background:var(--line2);padding:1px 5px;border-radius:4px;font-size:12.5px;font-family:ui-monospace,monospace}
.md pre{background:var(--line2);border-radius:8px;padding:10px;overflow-x:auto;font-size:12.5px}
.md pre code{background:none;padding:0}
.md table{border-collapse:collapse;width:100%;font-size:13px;margin:8px 0}
.md th,.md td{border:1px solid var(--line);padding:6px 9px;text-align:left}
.md th{background:var(--line2)}
.md a{color:var(--pri)}
.md details{border:1px solid var(--line);border-radius:8px;margin:8px 0;overflow:hidden}
.md summary{padding:9px 12px;font-weight:700;cursor:pointer;background:var(--line2);list-style:none;display:flex;align-items:center;gap:8px}
.md details>div{padding:10px 12px}
.cbwrap{position:relative;margin:8px 0}
.cbwrap .cbbar{display:flex;align-items:center;justify-content:space-between;background:var(--line2);border-radius:8px 8px 0 0;padding:6px 6px 6px 12px;font-size:12px;color:var(--mut);font-weight:700}
.cbwrap pre{margin:0;border-radius:0 0 8px 8px}
.cbwrap.collapsed pre{display:none}
.cbwrap .cbbar{border-radius:8px}
.cbwrap.collapsed .cbbar{border-radius:8px}
.cbcpy{border:1px solid var(--line);background:var(--panel);border-radius:6px;padding:4px 10px;font-size:12px;cursor:pointer}
.al-l{text-align:left}.al-c{text-align:center}.al-r{text-align:right}
/* ============ GALLERY (thư viện đính kèm) ============ */
.gal{display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin-top:6px}
.gitem{position:relative;aspect-ratio:1;border-radius:8px;overflow:hidden;background:var(--line2);border:1px solid var(--line);cursor:pointer}
.gitem img,.gitem video{width:100%;height:100%;object-fit:cover;display:block}
.gitem .gdoc{width:100%;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:4px;font-size:11px;color:var(--mut);padding:6px;text-align:center}
.gitem .gdoc svg{width:26px;height:26px}
.gitem .gx{position:absolute;top:4px;right:4px;width:26px;height:26px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:14px;cursor:pointer;display:flex;align-items:center;justify-content:center}
.gitem .gdur{position:absolute;bottom:4px;left:4px;background:rgba(0,0,0,.6);color:#fff;font-size:10px;border-radius:4px;padding:1px 6px}
.gitem .gmic{position:absolute;inset:0;display:flex;align-items:center;justify-content:center}
.gempty2{grid-column:1/-1;text-align:center;color:var(--faint);font-size:12.5px;padding:14px;border:1px dashed var(--line);border-radius:8px}
.gadd{display:flex;gap:6px;margin-top:8px;flex-wrap:wrap}
.gadd .btn{font-size:12.5px;padding:8px 10px}
/* lightbox */
#lb{position:fixed;inset:0;background:rgba(0,0,0,.88);z-index:100;display:none;align-items:center;justify-content:center;flex-direction:column;padding:16px}
#lb.open{display:flex}
#lb img,#lb video{max-width:100%;max-height:82vh;border-radius:8px}
#lb .lbbar{display:flex;gap:10px;margin-top:12px;align-items:center}
#lb .lbbar button{border:1px solid #555;background:#222;color:#fff;border-radius:8px;padding:9px 16px;font-size:14px;cursor:pointer}
#lb .lbname{color:#ccc;font-size:13px}
/* ============ MINDMAP ============ */
#view-map{background:var(--bg)}
#cv{width:100%;height:100%;display:block;touch-action:none}
.mnode{cursor:grab}
.mnode rect{fill:var(--panel);stroke:var(--nodebd);stroke-width:1;rx:6}
.mnode text{font-size:12.5px;font-weight:600;fill:var(--ink)}
.mnode .sub{font-size:10px;font-weight:400;fill:var(--mut)}
.mnode.sel rect{stroke:var(--pri);stroke-width:2.5}
.medge{fill:none;stroke:var(--edge);stroke-width:1.5}
#minimap{position:absolute;right:12px;bottom:12px;width:140px;height:100px;background:var(--panel);border:1px solid var(--line);border-radius:8px;box-shadow:var(--shadow);z-index:6;overflow:hidden}
#minimap svg{width:100%;height:100%}
.mtoolbar{position:absolute;left:12px;bottom:12px;display:flex;gap:6px;z-index:6}
.mtoolbar button{border:1px solid var(--line);background:var(--panel);border-radius:8px;padding:8px 11px;font-size:12.5px;cursor:pointer;box-shadow:var(--shadow)}
/* ============ GANTT ============ */
#view-gantt{overflow:auto;padding:14px}
.gantt{border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel);min-width:640px}
.grow{display:flex;border-bottom:1px solid var(--line2);min-height:34px}
.grow:last-child{border-bottom:0}
.glabel{width:190px;min-width:190px;padding:7px 10px;font-size:13px;border-right:1px solid var(--line);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.glabel.grp{background:var(--line2);font-weight:700}
.gbar-area{flex:1;position:relative}
.gbar{position:absolute;top:8px;height:18px;border-radius:5px;background:var(--pri);opacity:.85;cursor:pointer;min-width:4px}
.gbar i{display:block;height:100%;background:rgba(0,0,0,.28);border-radius:5px}
.gbar.overdue{background:var(--bad)}
.gbar.due3{background:#ef4444}
.gbar.due7{background:#f59e0b}
.ghead{display:flex;background:var(--line2);font-size:11px;color:var(--mut);font-weight:700}
.ghead .glabel{padding:7px 10px}
.gscale{flex:1;display:flex}
.gscale span{flex:1;text-align:center;padding:7px 0;border-left:1px solid var(--line)}
/* ============ CALENDAR ============ */
#view-cal{overflow-y:auto;padding:14px}
.calnav{display:flex;align-items:center;gap:8px;margin-bottom:10px;max-width:760px;margin-left:auto;margin-right:auto}
.calnav b{flex:1;text-align:center;font-size:15px}
.cal-grid{display:grid;grid-template-columns:repeat(7,1fr);gap:4px;max-width:760px;margin:0 auto}
.cal-dow{font-size:11px;font-weight:700;color:var(--mut);text-align:center;padding:4px}
.cal-day{min-height:74px;border:1px solid var(--line);border-radius:8px;padding:4px;background:var(--panel);overflow:hidden}
.cal-day.dim{opacity:.4}
.cal-day.today{border-color:var(--pri);border-width:2px}
.cal-num{font-size:11px;font-weight:700;color:var(--mut)}
.cal-chip{display:flex;align-items:center;gap:4px;font-size:11px;border-radius:5px;padding:2px 5px;margin:2px 0;cursor:pointer;border:1px solid var(--line);white-space:nowrap;overflow:hidden;background:var(--pri-soft)}
.cal-chip .ct{overflow:hidden;text-overflow:ellipsis}
.cal-chip.overdue{background:#fecaca!important;border-color:#dc2626!important}
.cal-chip.due3{background:#fee2e2!important;border-color:#ef4444!important}
.cal-chip.due7{background:#fef3c7!important;border-color:#f59e0b!important}
.cal-more{font-size:10px;color:var(--faint)}
/* ============ TASK ============ */
#view-task{overflow-y:auto;padding:14px}
.tfilters{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:10px;max-width:900px;margin-left:auto;margin-right:auto}
.tfilters button{border:1px solid var(--line);background:var(--panel);border-radius:16px;padding:7px 13px;font-size:12.5px;cursor:pointer}
.tfilters button.on{background:var(--pri);color:#fff;border-color:var(--pri);font-weight:700}
.ttable{max-width:900px;margin:0 auto;border:1px solid var(--line);border-radius:8px;overflow:hidden;background:var(--panel)}
.trow{display:flex;align-items:center;gap:8px;padding:9px 12px;border-bottom:1px solid var(--line2);font-size:13.5px}
.trow:last-child{border-bottom:0}
.trow .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;cursor:pointer}
.trow .tm{font-size:11.5px;color:var(--mut);white-space:nowrap}
.stt{font-size:11px;font-weight:700;border-radius:10px;padding:2px 9px;white-space:nowrap}
.stt.overdue{background:#fecaca;color:#7f1d1d}.stt.due3{background:#fee2e2;color:#991b1b}
.stt.due7{background:#fef3c7;color:#92400e}.stt.ok{background:#dcfce7;color:#166534}
.stt.todo{background:var(--line2);color:var(--mut)}
/* ============ DASHBOARD ============ */
#view-dash{overflow-y:auto;padding:16px}
.dgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px;max-width:640px;margin:0 auto}
.dcard{background:var(--panel);border:1px solid var(--line);border-radius:10px;padding:16px}
.dcard .n{font-size:28px;font-weight:800}
.dcard .l{font-size:12.5px;color:var(--mut)}
/* ============ SEARCH ============ */
#searchBox{position:fixed;top:60px;left:50%;transform:translateX(-50%);width:min(480px,92vw);background:var(--panel);border:1px solid var(--line);border-radius:12px;box-shadow:var(--shadow);z-index:90;display:none;overflow:hidden}
#searchBox.open{display:block}
#searchBox input{width:100%;border:0;border-bottom:1px solid var(--line);padding:13px 15px;font-size:15px;outline:none;background:var(--panel);color:var(--ink)}
#srList{max-height:320px;overflow-y:auto}
.sr-item{padding:10px 15px;font-size:14px;cursor:pointer;border-bottom:1px solid var(--line2)}
.sr-item:active{background:var(--sel)}
.sr-item small{color:var(--faint);display:block;font-size:11.5px}
/* ============ PRESENT ============ */
#present{position:fixed;inset:0;background:#0b1220;color:#fff;z-index:120;display:none;align-items:center;justify-content:center;flex-direction:column;padding:30px;text-align:center}
#present.open{display:flex}
#present h2{font-size:26px;margin:0 0 14px;max-width:700px}
#present .pnote{font-size:15px;color:#cbd5e1;max-width:640px;line-height:1.6}
#present .pnav{position:absolute;bottom:26px;display:flex;gap:10px;align-items:center}
#present .pnav button{background:#1e293b;border:1px solid #334155;color:#fff;border-radius:8px;padding:10px 18px;font-size:14px;cursor:pointer}
#present .pcount{color:#64748b;font-size:13px}
/* toast */
#toast{position:fixed;bottom:24px;left:50%;transform:translateX(-50%) translateY(80px);background:#0f172a;color:#fff;border-radius:10px;padding:11px 20px;font-size:14px;z-index:200;transition:transform .25s;opacity:0}
#toast.show{transform:translateX(-50%) translateY(0);opacity:1}
@media(max-width:640px){
  .otree{padding:10px 8px 90px}
  .cal-day{min-height:58px}
  .dgrid{grid-template-columns:1fr 1fr}
  .ohint{display:none}
}
</style>
</head>
<body>
<header>
  <div class="logo" id="logoBtn">LEHA <small>MindPlan</small></div>
  <div id="docName"></div>
</header>

<div id="scrim"></div>
<aside id="sidebar">
  <div class="sb-head"><b>Menu</b><button class="sb-x" id="sbClose">×</button></div>
  <div class="sb-body">
    <div class="sb-sec">
      <div class="sb-t">Chế độ xem</div>
      <div class="sb-nav" id="viewNav">
        <button data-v="outline" class="on">Outline</button>
        <button data-v="map">Mindmap</button>
        <button data-v="gantt">Gantt</button>
        <button data-v="cal">Lịch</button>
        <button data-v="task">Task</button>

const COLORS=['#e8eef4','#e6efe4','#f4efe4','#ece8f2','#f2e8e8','#e4f0f2'];
/* ================= INDEXEDDB ================= */
let DB={name:'Bản đồ mới',nodes:[],theme:'light',monthFilter:'',seq:0};
let idb=null;
function idbOpen(){return new Promise((res,rej)=>{
  const r=indexedDB.open('mindplan_v2',2);
  r.onupgradeneeded=e=>{const d=e.target.result;
    if(!d.objectStoreNames.contains('docs'))d.createObjectStore('docs');
    if(!d.objectStoreNames.contains('blobs'))d.createObjectStore('blobs');};
  r.onsuccess=e=>{idb=e.target.result;res();};r.onerror=e=>rej(e);});}
function idbPut(store,key,val){return new Promise((res,rej)=>{
  const t=idb.transaction(store,'readwrite');t.objectStore(store).put(val,key);
  t.oncomplete=res;t.onerror=e=>rej(e);});}
function idbGet(store,key){return new Promise((res,rej)=>{
  const t=idb.transaction(store,'readonly');const q=t.objectStore(store).get(key);
  q.onsuccess=()=>res(q.result);q.onerror=e=>rej(e);});}
function idbDel(store,key){return new Promise((res,rej)=>{
  const t=idb.transaction(store,'readwrite');t.objectStore(store).delete(key);
  t.oncomplete=res;t.onerror=e=>rej(e);});}
/* ================= DATA MODEL ================= */
const byId=id=>DB.nodes.find(n=>n.id===id);
function nodeDefaults(){return{id:uid(),pid:null,title:'',note:'',noteMode:'md',
  icon:'none',iconColor:'#475569',color:'#eef2ff',tags:[],start:'',end:'',progress:0,
  budget:0,cost:0,assignee:'',isProject:false,collapsed:false,
  imgs:[],files:[],voices:[],order:Date.now()+Math.random(),x:0,y:0};}
function children(pid){return DB.nodes.filter(n=>n.pid===pid).sort((a,b)=>a.order-b.order);}
function roots(){return children(null);}
function descendants(id){const out=[];(function w(pid){children(pid).forEach(c=>{out.push(c);w(c.id);});})(id);return out;}
function depthOf(n){let d=0,p=n;while(p&&p.pid){p=byId(p.pid);d++;}return d;}
function pathOf(n){const p=[];let c=n;while(c){p.unshift(c);c=c.pid?byId(c.pid):null;}return p;}
/* ================= UNDO ================= */
const hist={stack:[],i:-1};
function snap(){return JSON.stringify({nodes:DB.nodes,name:DB.name});}
function histPush(){hist.stack=hist.stack.slice(0,hist.i+1);hist.stack.push(snap());if(hist.stack.length>60)hist.stack.shift();hist.i=hist.stack.length-1;}
function histDo(d){const ni=hist.i+d;if(ni<0||ni>=hist.stack.length)return;hist.i=ni;
  const s=JSON.parse(hist.stack[ni]);DB.nodes=s.nodes;DB.name=s.name;save();renderAll();}
function histInit(){hist.stack=[snap()];hist.i=0;}

function dueLevel(n){

  if(diff<0)return'overdue';if(diff<=3)return'due3';if(diff<=7)return'due7';return'';
}
function dueLabel(n){const l=dueLevel(n);

  let b=0,c=0;ch.forEach(k=>{const r=rollup(k);b+=r.budget;c+=r.cost;});return{budget:b,cost:c};

/* ================= MARKDOWN ================= */
function mdInline(s){
  s=esc(s);
  s=s.replace(/`([^`]+)`/g,'<code>$1</code>');
  s=s.replace(/\*\*([^*]+)\*\*/g,'<strong>$1</strong>');
  s=s.replace(/(^|[^*])\*([^*\n]+)\*/g,'$1<em>$2</em>');
  s=s.replace(/==([^=]+)==/g,'<mark>$1</mark>');
  s=s.replace(/\{([a-z]+)\}([^<{]+)/g,(m,c,t)=>'<span style="color:'+c+'">'+t+'</span>');
  s=s.replace(/\[([^\]]+)\]\(([^)]+)\)/g,'<a href="$2" target="_blank">$1</a>');
  s=s.replace(/#([a-zA-Z0-9_àáạảãâầấậẩẫăằắặẳẵèéẹẻẽêềếệểễìíịỉĩòóọỏõôồốộổỗơờớợởỡùúụủũưừứựửữỳýỵỷỹđ]+)/g,'<span style="color:var(--pri)">#$1</span>');
  return s;
}
function mdBlock(src){
  const lines=String(src||'').split('\n');let h='',i=0;
  const isCodeFence=l=>l.trim().startsWith('```');
  while(i<lines.length){
    const l=lines[i],t=l.trim();
    if(isCodeFence(l)){
      let code=[];i++;
      while(i<lines.length&&!isCodeFence(lines[i])){code.push(lines[i]);i++;}
      i++;
      const id='cb'+uid();
      h+='<div class="cbwrap collapsed" id="'+id+'"><div class="cbbar"><span>CODE</span><span><button class="cbcpy" data-cb="'+id+'">Thu gọn</button> <button class="cbcpy" data-copy="'+esc(code.join('\n'))+'">Copy</button></span></div><pre><code>'+esc(code.join('\n'))+'</code></pre></div>';
      continue;
    }
    if(t.startsWith(':::details')){
      const title=t.slice(10).trim()||'Mục gập';let inner=[];i++;
      while(i<lines.length&&lines[i].trim()!==':::'){inner.push(lines[i]);i++;}
      i++;
      h+='<details><summary>'+esc(title)+'</summary><div>'+mdBlock(inner.join('\n'))+'</div></details>';
      continue;
    }
    if(/^\|(.+)\|$/.test(t)){
      let rows=[];i++;
      while(i<lines.length&&/^\|(.+)\|$/.test(lines[i].trim())){rows.push(lines[i].trim());i++;}
      const cells=r=>r.slice(1,-1).split('|').map(c=>'<td>'+mdInline(c.trim())+'</td>').join('');
      let th='';
      if(rows.length>1&&/^\|[\s:\-|]+\|$/.test(rows[1])){th='<tr>'+rows[0].slice(1,-1).split('|').map(c=>'<th>'+mdInline(c.trim())+'</th>').join('')+'</tr>';rows=rows.slice(2);}
      h+='<table><tbody>'+th+rows.map(r=>'<tr>'+cells(r)+'</tr>').join('')+'</tbody></table>';
      continue;
    }
    if(t.startsWith('<html>')){
      let inner=[];i++;
      while(i<lines.length&&!lines[i].trim().startsWith('</html>')){inner.push(lines[i]);i++;}
      i++;h+='<div>'+inner.join('\n')+'</div>';continue;
    }
    if(t.startsWith('### ')){h+='<h3>'+mdInline(t.slice(4))+'</h3>';i++;continue;}
    if(t.startsWith('## ')){h+='<h2>'+mdInline(t.slice(3))+'</h2>';i++;continue;}
    if(t.startsWith('# ')){h+='<h1>'+mdInline(t.slice(2))+'</h1>';i++;continue;}
    if(t==='->'){h+='<div class="al-l">';i++;continue;}
    if(t==='>-'){h+='<div class="al-r">';i++;continue;}
    if(t==='><'){h+='<div class="al-c">';i++;continue;}
    if(t==='<'){h+='</div>';i++;continue;}
    if(/^[-*] /.test(t)){let items=[];while(i<lines.length&&/^[-*] /.test(lines[i].trim())){items.push('<li>'+mdInline(lines[i].trim().slice(2))+'</li>');i++;}h+='<ul>'+items.join('')+'</ul>';continue;}
    if(t===''){i++;continue;}
    h+='<p>'+mdInline(l)+'</p>';i++;
  }
  return h;
}

/* ================= OUTLINE ================= */
let selectedId=null, monthFilter='';
function mRange(){
  if(!monthFilter)return null;
  const[y,m]=monthFilter.split('-').map(Number);
  const a=y+'-'+q2(m)+'-01',b=new Date(y,m,0);
  return{a,b:y+'-'+q2(m)+'-'+q2(b.getDate())};
}
function inMonth(n,rg){
  if(!rg)return true;
  const s=n.start||n.end,e=n.end||n.start;
  if(!s)return false;
  return s<=rg.b&&e>=rg.a;
}
function hasMatch(n,rg){if(inMonth(n,rg))return true;return children(n.id).some(c=>hasMatch(c,rg));}
function outlineRow(n,rg){
  const ch=children(n.id),dim=rg&&!inMonth(n,rg);
  const dots=[];
  if(n.note&&n.note.trim())dots.push('✎');
  const media=(n.imgs||[]).length+(n.files||[]).length+(n.voices||[]).length;
  if(media)dots.push('◉'+media);
  if(n.isProject)dots.push('◆');
  if(Number(n.progress)>=100)dots.push('✓');
  let h='<div class="orow'+(dim?' dim':'')+(selectedId===n.id?' sel':'')+'" data-id="'+n.id+'">';
  h+='<div class="oline">';
  h+='<span class="ocaret'+(ch.length?' has':'')+'" data-caret="'+n.id+'">'+(ch.length?(n.collapsed?'▸':'▾'):'')+'</span>';
  h+='<span class="obull">•</span>';
  if(n.icon&&n.icon!=='none'&&IC[n.icon])h+='<span style="color:'+esc(n.iconColor||'#64748b')+';display:inline-flex;flex:none;padding-top:3px;width:18px;height:18px">'+IC[n.icon]+'</span>';
  h+='<div class="otitle" contenteditable="true" spellcheck="false" data-title="'+n.id+'" data-ph="Nhập nội dung...">'+(mdInline(n.title||'')||'')+'</div>';
  if(dots.length)h+='<span class="odots">'+dots.join(' ')+'</span>';
  h+='</div>';
  if(n.note&&n.note.trim())h+='<div class="onote">'+esc(n.note.split('\n')[0].slice(0,90))+'</div>';
  h+='<div class="okids"'+(n.collapsed?' style="display:none"':'')+'>';
  if(!n.collapsed)ch.forEach(c=>{if(!rg||hasMatch(c,rg))h+=outlineRow(c,rg);});
  h+='</div></div>';
  return h;
}
function renderOutline(){
  const box=$('#otree'),rg=mRange();
  let h='';
  const rs=roots().filter(r=>!rg||hasMatch(r,rg));
  rs.forEach(r=>{h+=outlineRow(r,rg);});
  if(!h)h='<div class="gempty">Chưa có dòng nào.<br><span style="font-size:12px">Bấm + Dòng gốc trong menu để bắt đầu</span></div>';
  box.innerHTML=h;
  bindOutline();
}
function outlineEnter(id){
  const n=byId(id);if(!n)return;histPush();
  const nn=nodeDefaults();nn.pid=n.pid;nn.color=n.color;
  const sibs=children(n.pid);const ix=sibs.findIndex(x=>x.id===id);
  nn.order=(ix>=0?(sibs[ix].order+(sibs[ix+1]?sibs[ix+1].order:sibs[ix].order+2))/2:Date.now());
  DB.nodes.push(nn);save();renderOutline();focusTitle(nn.id);
}
function focusTitle(id){requestAnimationFrame(()=>{const el=document.querySelector('[data-title="'+id+'"]');if(el){el.focus();const r=document.createRange();r.selectNodeContents(el);r.collapse(false);const s=getSelection();s.removeAllRanges();s.addRange(r);}});}
function bindOutline(){
  const tree=$('#otree');if(!tree||tree._bound)return;tree._bound=true;
  tree.addEventListener('focusin',e=>{
    const t=e.target.closest('[data-title]');
    if(t){const n=byId(t.dataset.title);if(n&&n.title!==t.textContent){t.textContent=n.title||'';}return;}
  });
  tree.addEventListener('focusout',e=>{
    const t=e.target.closest('[data-title]');
    if(t&&!t.contains(e.relatedTarget)){
      const n=byId(t.dataset.title);
      if(n){const raw=t.textContent;if(raw!==(n.title||'')){histPush();n.title=raw;save();}
        t.innerHTML=mdInline(n.title||'');}
      return;}
  });
  tree.addEventListener('input',e=>{
    const t=e.target.closest('[data-title]');
    if(t){const n=byId(t.dataset.title);if(n&&t.textContent!==(n.title||'')){n.title=t.textContent;save();}}
  });
  tree.addEventListener('keydown',e=>{
    const t=e.target.closest('[data-title]');if(!t)return;
    const id=t.dataset.title,n=byId(id);if(!n)return;
    if(e.key==='Enter'&&!e.shiftKey){e.preventDefault();outlineEnter(id);}
    else if(e.key==='Tab'){e.preventDefault();histPush();
      if(e.shiftKey){ // outdent
        if(n.pid){const p=byId(n.pid);if(p){n.pid=p.pid;const sibs=children(n.pid);n.order=(sibs.length?Math.max(...sibs.map(x=>x.order)):0)+1;}}}
      else{ // indent: thành con của anh em phía trên
        const sibs=children(n.pid);const ix=sibs.findIndex(x=>x.id===id);
        if(ix>0){n.pid=sibs[ix-1].id;n.order=Date.now();n.collapsed=false;}
      }
      save();renderOutline();focusTitle(id);
    }
    else if(e.key==='Backspace'&&!(t.textContent||'').trim()){
      e.preventDefault();histPush();
      const sibs=children(n.pid);const ix=sibs.findIndex(x=>x.id===id);
      const prev=sibs[ix-1]||byId(n.pid);
      DB.nodes=DB.nodes.filter(x=>x.id!==id&&!descendants(id).some(d=>d.id===x.id));
      save();renderOutline();if(prev)focusTitle(prev.id);
    }
    else if(e.key==='ArrowDown'||e.key==='ArrowUp'){
      e.preventDefault();
      const all=Array.from(tree.querySelectorAll('[data-title]'));
      const ix=all.indexOf(t);const nx=all[ix+(e.key==='ArrowDown'?1:-1)];
      if(nx)nx.focus();
    }
  });
  tree.addEventListener('click',e=>{
    const c=e.target.closest('[data-caret]');
    if(c){const n=byId(c.dataset.caret);if(n&&children(n.id).length){histPush();n.collapsed=!n.collapsed;save();renderOutline();}return;}
    if(e.target.closest('[data-title]'))return;
    const row=e.target.closest('.orow');if(!row)return;
    selectNode(row.dataset.id);
  });
}

  selectedId=id;
  $$('.orow.sel').forEach(x=>x.classList.remove('sel'));
  const row=document.querySelector('.orow[data-id="'+id+'"]');

function compressImg(file){return new Promise(res=>{
  const img=new Image();const url=URL.createObjectURL(file);
  img.onload=()=>{const mx=1280;let w=img.width,h=img.height;
    if(Math.max(w,h)>mx){const r=mx/Math.max(w,h);w=Math.round(w*r);h=Math.round(h*r);}
    const c=document.createElement('canvas');c.width=w;c.height=h;
    c.getContext('2d').drawImage(img,0,0,w,h);URL.revokeObjectURL(url);
    c.toBlob(b=>res(b||file),'image/jpeg',0.82);};
  img.onerror=()=>res(file);img.src=url;});}

    if(!vis.length||n.collapsed){H[n.id]=NH+VG;return H[n.id];}
    let s=0;vis.forEach(c=>{s+=h(c);});H[n.id]=Math.max(NH+VG,s);return H[n.id];
  }
  roots().forEach(r=>h(r));
  return H;
}
function mmLayout(){
  const H=mmMeasure();mmNodes=[];
  let ry=0;
  roots().forEach(r=>{
    layoutNode(r,0,ry+(H[r.id]-VG)/2,true);
    ry+=H[r.id];
  });
  // căn giữa theo root đầu
  if(mmNodes.length){
    const xs=mmNodes.map(n=>n.x),ys=mmNodes.map(n=>n.y);
    const cx=(Math.min(...xs)+Math.max(...xs))/2,cy=(Math.min(...ys)+Math.max(...ys))/2;
    mmNodes.forEach(n=>{n.x-=cx;n.y-=cy;});
  }
}
function layoutNode(n,depth,cy,isRoot){
  const H=mmMeasure._H||{};
  const rec={n,x:depth*(NW+HG),y:cy,side:0};
  mmNodes.push(rec);
  const ch=children(n.id);
  if(n.collapsed||!ch.length)return;
  // chia 2 bên ở cấp 1, các cấp sau cùng phía cha
  let total=0;ch.forEach(c=>total+=subH(c));
  let y=cy-total/2;
  ch.forEach((c,i)=>{
    const hh=subH(c);
    const side=isRoot?(i<Math.ceil(ch.length/2)?-1:1):rec.side;
    const cc={n:c,x:(depth+1)*(NW+HG)*(side===-1?-1:1),y:y+hh/2-VG/2,side:side===-1?-1:1};
    // đệ quy với side
    layoutSub(c,depth+1,y+hh/2-VG/2,side,cc);
    y+=hh;
  });
  function layoutSub(n2,d2,cy2,side2,rec2){
    mmNodes.push(rec2);
    const ch2=children(n2.id);
    if(n2.collapsed||!ch2.length)return;
    let t2=0;ch2.forEach(c=>t2+=subH(c));
    let y2=cy2-t2/2;
    ch2.forEach(c=>{
      const hh=subH(c);
      const r2={n:c,x:(d2+1)*(NW+HG)*(side2===-1?-1:1),y:y2+hh/2-VG/2,side:side2};
      layoutSub(c,d2+1,y2+hh/2-VG/2,side2,r2);
      y2+=hh;
    });
  }
}
const _sh={};
function subH(n){
  if(_sh[n.id])return _sh[n.id];
  const ch=children(n.id);
  let h;
  if(!ch.length||n.collapsed)h=NH+VG;
  else{h=0;ch.forEach(c=>h+=subH(c));h=Math.max(NH+VG,h);}
  _sh[n.id]=h;return h;
}

function renderMinimap(){

  const x0=Math.min(...xs)-NW,y0=Math.min(...ys)-NH,x1=Math.max(...xs)+NW,y1=Math.max(...ys)+NH;

function bindMap(svg){
  if(svg._b)return;svg._b=true;
  let pan=null,pinch0=0,k0=1;
  const pos=e=>{const r=svg.getBoundingClientRect();return{x:e.clientX-r.left,y:e.clientY-r.top};};
  svg.addEventListener('pointerdown',e=>{
    const g=e.target.closest('.mnode');
    if(g){selectNode(g.dataset.mn);dragNode(e,g);return;}
    pan={p:pos(e),x:MZ.x,y:MZ.y};svg.setPointerCapture(e.pointerId);
  });
  svg.addEventListener('pointermove',e=>{
    if(!pan)return;const p=pos(e);
    let nx=pan.x+(p.x-pan.p.x),ny=pan.y+(p.y-pan.p.y);
    if(MZ.grid){nx=Math.round(nx/20)*20;ny=Math.round(ny/20)*20;}
    MZ.x=nx;MZ.y=ny;renderMap();
  });
  svg.addEventListener('pointerup',()=>{pan=null;});
  svg.addEventListener('wheel',e=>{e.preventDefault();
    const f=e.deltaY<0?1.12:0.89;MZ.k=Math.min(2.5,Math.max(0.3,MZ.k*f));renderMap();},{passive:false});
  svg.addEventListener('touchstart',e=>{
    if(e.touches.length===2){pinch0=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);k0=MZ.k;}
  },{passive:true});
  svg.addEventListener('touchmove',e=>{
    if(e.touches.length===2&&pinch0){e.preventDefault();
      const d=Math.hypot(e.touches[0].clientX-e.touches[1].clientX,e.touches[0].clientY-e.touches[1].clientY);
      MZ.k=Math.min(2.5,Math.max(0.3,k0*d/pinch0));renderMap();}
  },{passive:false});
  svg.addEventListener('dblclick',e=>{
    const g=e.target.closest('.mnode');
    if(g){const r=mmNodes.find(q=>q.n.id===g.dataset.mn);if(r){MZ.x=-r.x*MZ.k;MZ.y=-r.y*MZ.k;MZ.k=Math.max(MZ.k,1.1);renderMap();}}
  });
}
function dragNode(e,g){

}

function renderGantt(){
  const box=$('#ganttBox'),rg=mRange();
  const all=[];
  (function w(pid,dep){children(pid).forEach(c=>{if(!rg||hasMatch(c,rg))all.push({n:c,dep});w(c.id,dep+1);});})(null,0);
  const dated=all.filter(x=>x.n.start||x.n.end);
  if(!dated.length){box.innerHTML='<div class="gempty">Chưa có dòng nào có ngày.<br><span style="font-size:12px">Mở chi tiết dòng để đặt ngày bắt đầu/kết thúc</span></div>';return;}
  let mn='9999',mx='0000';
  dated.forEach(x=>{const s=x.n.start||x.n.end,e=x.n.end||x.n.start;if(s<mn)mn=s;if(e>mx)mx=e;});
  if(rg){mn=rg.a;mx=rg.b;}
  const d0=new Date(mn+'T00:00:00'),d1=new Date(mx+'T00:00:00');
  const months=[];{const d=new Date(d0);d.setDate(1);while(d<=d1){months.push(d.getFullYear()+'-'+q2(d.getMonth()+1));d.setMonth(d.getMonth()+1);}}
  const total=Math.max(1,Math.round((d1-d0)/864e5)+1);
  const pct=s=>Math.min(100,Math.max(0,Math.round((new Date(s+'T00:00:00')-d0)/864e5)/total*100));
  let h='<div class="gantt"><div class="ghead"><div class="glabel">Dòng / Tháng</div><div class="gscale">'+months.map(m=>'<span>'+m.slice(5)+'/'+m.slice(2,4)+'</span>').join('')+'</div></div>';
  let lastGrp='';
  dated.forEach(x=>{
    const n=x.n,top=pathOf(n)[0];
    const grp=top?top.title:'';
    if(grp!==lastGrp){h+='<div class="grow"><div class="glabel grp">'+esc(grp||'Chung')+'</div><div class="gbar-area"></div></div>';lastGrp=grp;}
    const s=n.start||n.end,e=n.end||n.start;
    const l=pct(s),w=Math.max(1.5,pct(e)-l+100/total*0.5);
    h+='<div class="grow"><div class="glabel" data-goto="'+n.id+'">'+'&nbsp;'.repeat(Math.min(x.dep,4)*2)+esc(n.title||'Không tên')+'</div>'
      +'<div class="gbar-area"><div class="gbar '+dueLevel(n)+'" data-goto="'+n.id+'" style="left:'+l+'%;width:'+w+'%"><i style="width:'+(Number(n.progress)||0)+'%"></i></div></div></div>';
  });
  h+='</div>';box.innerHTML=h;
  box.querySelectorAll('[data-goto]').forEach(el=>el.onclick=()=>{showView('map');setTimeout(()=>{const r=mmNodes.find(q=>q.n.id===el.dataset.goto);if(r){MZ.x=-r.x*MZ.k;MZ.y=-r.y*MZ.k;renderMap();}selectNode(el.dataset.goto);},60);});
}

let calCur='';
function renderCalendar(){
  const box=$('#calBox');

  const[y,m]=calCur.split('-').map(Number);

  const dim=new Date(y,m,0).getDate();
  const today=new Date();const tStr=today.getFullYear()+'-'+q2(today.getMonth()+1)+'-'+q2(today.getDate());
  let h='<div class="calnav"><button class="btn" id="cPrev">←</button><b>Tháng '+m+'/'+y+'</b><button class="btn" id="cNext">→</button><button class="btn" id="cToday">Hôm nay</button></div>';
  h+='<div class="cal-grid">'+['T2','T3','T4','T5','T6','T7','CN'].map(d=>'<div class="cal-dow">'+d+'</div>').join('');
  for(let i=0;i<startDow;i++)h+='<div class="cal-day dim"></div>';
  for(let d=1;d<=dim;d++){
    const ds=y+'-'+q2(m)+'-'+q2(d);
    const chips=DB.nodes.filter(n=>{const s=n.start||n.end,e=n.end||n.start;return s&&s<=ds&&e>=ds;});
    h+='<div class="cal-day'+(ds===tStr?' today':'')+'" data-day="'+ds+'"><div class="cal-num">'+d+'</div>';
    chips.slice(0,4).forEach(n=>{h+='<div class="cal-chip '+dueLevel(n)+'" data-chip="'+n.id+'"><span class="ct">'+esc(n.title||'Không tên')+'</span></div>';});
    if(chips.length>4)h+='<div class="cal-more">+'+(chips.length-4)+' nữa</div>';
    h+='</div>';
  }
  h+='</div>';box.innerHTML=h;
  $('#cPrev').onclick=()=>{let yy=y,mm=m-1;if(mm<1){mm=12;yy--;}calCur=yy+'-'+q2(mm);renderCalendar();};
  $('#cNext').onclick=()=>{let yy=y,mm=m+1;if(mm>12){mm=1;yy++;}calCur=yy+'-'+q2(mm);renderCalendar();};
  $('#cToday').onclick=()=>{const d=new Date();calCur=d.getFullYear()+'-'+q2(d.getMonth()+1);renderCalendar();};

    if(!touch)c.draggable=true;
    c.addEventListener('click',()=>{showView('map');setTimeout(()=>{const r=mmNodes.find(q=>q.n.id===c.dataset.chip);if(r){MZ.x=-r.x*MZ.k;MZ.y=-r.y*MZ.k;renderMap();}selectNode(c.dataset.chip);},60);});

  });

    cell.addEventListener('dragover',e=>e.preventDefault());
    cell.addEventListener('drop',e=>{e.preventDefault();
      const id=e.dataTransfer.getData('text/plain');const n=byId(id);if(!n)return;
      const to=cell.dataset.day,from=n.start||n.end;if(!from||from===to)return;
      histPush();
      const delta=Math.round((new Date(to+'T00:00:00')-new Date(from+'T00:00:00'))/864e5);
      const sh=s2=>{if(!s2)return s2;const d=new Date(s2+'T00:00:00');d.setDate(d.getDate()+delta);return d.getFullYear()+'-'+q2(d.getMonth()+1)+'-'+q2(d.getDate());};
      n.start=sh(n.start);n.end=sh(n.end);save();renderCalendar();toast('Đã dời sang '+fmtD(to));
    });
  });

/* ================= TEMPLATES ================= */
function mkTree(pid,title,kids,color){
  const n=nodeDefaults();n.pid=pid;n.title=title;if(color)n.color=color;DB.nodes.push(n);
  (kids||[]).forEach(k=>{if(typeof k==='string')mkTree(n.id,k);else mkTree(n.id,k.t,k.k,k.c);});
  return n;
}
function tplLife(){
  const r=nodeDefaults();r.title='Cuộc sống của tôi';r.color='#e8eef4';DB.nodes.push(r);
  const areas=[['Gia đình','#e6efe4','home'],['Cá nhân','#f4efe4','user'],['Công việc','#e8eef4','proj'],['Sức khỏe','#f2e8e8','heart']];
  [2026,2027].forEach(y=>{
    areas.forEach(a=>{
      let an=DB.nodes.find(x=>x.pid===r.id&&x.title===a[0]);
      if(!an){an=nodeDefaults();an.pid=r.id;an.title=a[0];an.color=a[1];an.icon=a[2];DB.nodes.push(an);}
      let yn=DB.nodes.find(x=>x.pid===an.id&&x.title===String(y));
      if(!yn){yn=nodeDefaults();yn.pid=an.id;yn.title='Năm '+y;DB.nodes.push(yn);}
      const MN=['Tháng 1','Tháng 2','Tháng 3','Tháng 4','Tháng 5','Tháng 6','Tháng 7','Tháng 8','Tháng 9','Tháng 10','Tháng 11','Tháng 12'];
      MN.forEach((mn2,mi)=>{
        const last=new Date(y,mi+1,0).getDate();
        let mnd=nodeDefaults();mnd.pid=yn.id;mnd.title=mn2+' '+y;
        mnd.start=y+'-'+q2(mi+1)+'-01';mnd.end=y+'-'+q2(mi+1)+'-'+q2(last);
        DB.nodes.push(mnd);
      });
    });
  });
}
const TPLS={
  life:{name:'Cuộc sống',fn:tplLife},
  swot:{name:'SWOT',fn:()=>{const r=mkTree(null,'Phân tích SWOT');['Điểm mạnh','Điểm yếu','Cơ hội','Thách thức'].forEach(t=>mkTree(r.id,t));}},
  kickoff:{name:'Kickoff dự án',fn:()=>{const r=mkTree(null,'Kickoff dự án');['Mục tiêu','Phạm vi','Nhân sự','Timeline','Rủi ro','Ngân sách'].forEach(t=>mkTree(r.id,t));}},
  meeting:{name:'Biên bản họp',fn:()=>{const r=mkTree(null,'Biên bản họp');['Thời gian / Địa điểm','Người tham dự','Nội dung','Quyết định','Action items'].forEach(t=>mkTree(r.id,t));}},
  yearly:{name:'Mục tiêu năm',fn:()=>{const r=mkTree(null,'Mục tiêu năm');['Sự nghiệp','Tài chính','Sức khỏe','Gia đình','Học tập'].forEach(t=>mkTree(r.id,t));}},
  weekly:{name:'Kế hoạch tuần',fn:()=>{const r=mkTree(null,'Kế hoạch tuần');['Thứ 2','Thứ 3','Thứ 4','Thứ 5','Thứ 6','Thứ 7','Chủ nhật'].forEach(t=>mkTree(r.id,t));}}
};
$('#aNew').onclick=()=>{
  const names=Object.keys(TPLS).map((k,i)=>(i+1)+'. '+TPLS[k].name).join('\n');
  const c=prompt('Tạo bản đồ mới từ template:\n'+names+'\n0. Trống\nChọn số:','1');
  if(c==null)return;
  const ks=Object.keys(TPLS);const ix=parseInt(c,10)-1;
  histPush();DB.nodes=[];DB.name='Bản đồ mới';
  if(ix>=0&&ix<ks.length){TPLS[ks[ix]].fn();DB.name=TPLS[ks[ix]].name;}
  selectedId=null;save();renderAll();$('#docName').textContent=DB.name;toast('Đã tạo: '+DB.name);
};
$('#aAddRoot').onclick=()=>{histPush();const n=nodeDefaults();DB.nodes.push(n);save();renderAll();
  if(currentView==='outline')setTimeout(()=>focusTitle(n.id),80);closeSidebar();};
/* ================= EXPORT ================= */
function svgExport(){
  for(const k in _sh)delete _sh[k];mmLayout();
  if(!mmNodes.length)return'';
  const xs=mmNodes.map(n=>n.x),ys=mmNodes.map(n=>n.y);
  const x0=Math.min(...xs)-NW/2-30,y0=Math.min(...ys)-NH/2-30,x1=Math.max(...xs)+NW/2+30,y1=Math.max(...ys)+NH/2+30;
  let h='<svg xmlns="http://www.w3.org/2000/svg" width="'+(x1-x0)+'" height="'+(y1-y0)+'" viewBox="'+x0+' '+y0+' '+(x1-x0)+' '+(y1-y0)+'">';
  h+='<rect x="'+x0+'" y="'+y0+'" width="'+(x1-x0)+'" height="'+(y1-y0)+'" fill="white"/>';
  mmNodes.forEach(r=>{
    if(!r.n.pid)return;const p=mmNodes.find(q=>q.n.id===r.n.pid);if(!p)return;
    const x1p=p.x+(p.side===-1?-NW/2:NW/2),x2=r.x+(r.side===-1?NW/2:-NW/2),mx=(x1p+x2)/2;
    h+='<path d="M'+x1p+','+p.y+' C'+mx+','+p.y+' '+mx+','+r.y+' '+x2+','+r.y+'" fill="none" stroke="#94a3b8" stroke-width="1.5"/>';
  });
  mmNodes.forEach(r=>{const n=r.n,pg=Number(n.progress)||0;
    h+='<g><rect x="'+(r.x-NW/2)+'" y="'+(r.y-NH/2)+'" width="'+NW+'" height="'+NH+'" rx="6" fill="'+esc(n.color||'#eef2ff')+'" stroke="#c3ccd8"/>'
      +'<text x="'+(r.x-NW/2+8)+'" y="'+(r.y+5)+'" font-size="12.5" font-weight="600" font-family="sans-serif">'+esc((n.title||'').slice(0,24))+'</text>';
    if(pg>0)h+='<rect x="'+(r.x-NW/2+8)+'" y="'+(r.y+12)+'" width="'+((NW-24)*pg/100)+'" height="5" rx="2.5" fill="#15803d"/>';
    h+='</g>';});
  return h+'</svg>';
}
$('#aExport').onclick=()=>{
  const svg=svgExport();if(!svg){toast('Chưa có gì để xuất');return;}
  const img=new Image();
  img.onload=()=>{const sc=3,c=document.createElement('canvas');c.width=img.width*sc;c.height=img.height*sc;
    const x=c.getContext('2d');x.scale(sc,sc);x.fillStyle='#fff';x.fillRect(0,0,img.width,img.height);x.drawImage(img,0,0);
    const a=document.createElement('a');a.download='mindplan.png';a.href=c.toDataURL('image/png');a.click();toast('Đã xuất PNG');};
  img.src='data:image/svg+xml;charset=utf-8,'+encodeURIComponent(svg);
};
$('#aExportSvg').onclick=()=>{
  const svg=svgExport();if(!svg){toast('Chưa có gì để xuất');return;}
  const b=new Blob([svg],{type:'image/svg+xml'});const a=document.createElement('a');
  a.href=URL.createObjectURL(b);a.download='mindplan.svg';a.click();toast('Đã xuất SVG');
};
$('#aExportPdf').onclick=()=>{
  const svg=svgExport();if(!svg){toast('Chưa có gì để xuất');return;}
  const w=open('','_blank');if(!w){toast('Trình duyệt chặn popup');return;}
  w.document.write('<html><head><title>LEHA MindPlan</title><style>@page{size:A3 landscape;margin:8mm}body{margin:0}</style></head><body>'+svg+'</body></html>');
  w.document.close();w.focus();setTimeout(()=>w.print(),400);
};
/* JSON */
$('#aJsonOut').onclick=async()=>{
  const blobs={};
  for(const n of DB.nodes){
    for(const arr of [n.imgs,n.files,n.voices])for(const r of (arr||[])){
      if(r.blobId&&!blobs[r.blobId]){try{const b=await idbGet('blobs',r.blobId);
        if(b)blobs[r.blobId]=await new Promise(res=>{const fr=new FileReader();fr.onload=()=>res(fr.result);fr.readAsDataURL(b);});}catch(e){}}
    }
  }
  const data=JSON.stringify({app:'mindplan-v2',name:DB.name,nodes:DB.nodes,blobs});
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([data],{type:'application/json'}));
  a.download='mindplan.json';a.click();toast('Đã xuất JSON');
};
$('#aJsonIn').onclick=()=>$('#jsonFile').click();
$('#jsonFile').addEventListener('change',async e=>{
  const f=e.target.files[0];if(!f)return;
  try{const d=JSON.parse(await f.text());
    if(d.app!=='mindplan-v2'&&!d.nodes)throw 0;
    histPush();DB.name=d.name||'Bản đồ mới';DB.nodes=d.nodes||[];
    if(d.blobs)for(const k in d.blobs){
      const b=await(await fetch(d.blobs[k])).blob();await idbPut('blobs',k,b);}
    save();renderAll();$('#docName').textContent=DB.name;toast('Đã nạp');
  }catch(err){toast('File không hợp lệ');}
  e.target.value='';
});

let currentView='outline';
function showView(v){
  currentView=v;
  $$('.view').forEach(x=>x.classList.remove('on'));
  $('#view-'+v).classList.add('on');
  $$('#viewNav button').forEach(b=>b.classList.toggle('on',b.dataset.v===v));
  renderAll();closeSidebar();
}
$$('#viewNav button').forEach(b=>b.onclick=()=>showView(b.dataset.v));
function renderAll(){
  $('#docName').textContent=DB.name;
  if(currentView==='outline')renderOutline();
  else if(currentView==='map')renderMap();
  else if(currentView==='gantt')renderGantt();
  else if(currentView==='cal')renderCalendar();
  else if(currentView==='task')renderTasks();
  else if(currentView==='dash')renderDash();
}
function render(){renderAll();}
addEventListener('resize',debounce(()=>{if(currentView==='map')renderMap();},200));
/* ================= INIT ================= */
(async function init(){
  try{await idbOpen();}catch(e){}
  await loadAll();
  if(!DB.nodes.length){
    // dữ liệu mẫu gọn
    const r=nodeDefaults();r.title='Kế hoạch của tôi';r.color='#e8eef4';DB.nodes.push(r);
    const a=nodeDefaults();a.pid=r.id;a.title='Công việc';a.color='#e8eef4';a.icon='proj';DB.nodes.push(a);
    const b=nodeDefaults();b.pid=r.id;b.title='Cá nhân';b.color='#f4efe4';b.icon='user';DB.nodes.push(b);
    const t1=nodeDefaults();t1.pid=a.id;t1.title='Hoàn thành báo cáo tuần';t1.isProject=true;t1.end=new Date(Date.now()+2*864e5).toISOString().slice(0,10);t1.progress=40;DB.nodes.push(t1);
    const t2=nodeDefaults();t2.pid=b.id;t2.title='Đọc sách 30 phút';t2.note='Danh sách đọc:\n- Sách 1\n- Sách 2';DB.nodes.push(t2);
    save();
  }
  histInit();renderAll();
})();
</script>
